/* ---------- tokens: three looks (ember, lichen, ash), each light and dark ---------- */
:root{
  --ground:#ECEAE6; --surface:#F5F3EF; --surface2:#DFDCD7;
  --ink:#26262A; --ink2:#5C5A5D; --ink3:#625F60; --accent-ink:#855250; --accent:#9A5F5C; --ornament:#7F7A79;
  --accent-tint:color-mix(in srgb, var(--accent) 8%, transparent);
  --accent-border:color-mix(in srgb, var(--accent) 24%, transparent);
  --glow-strong:color-mix(in srgb, var(--accent) 26%, transparent);
  --glow-soft:color-mix(in srgb, var(--accent) 10%, transparent);
  --card-edge:color-mix(in srgb, var(--ink) 7%, transparent); --line-section:color-mix(in srgb, var(--ink) 20%, transparent); --line-row:color-mix(in srgb, var(--ink) 10%, transparent); --sep-opacity:.45;
  --ink-glow:color-mix(in srgb, var(--ink) 10%, transparent);
  --bg:var(--ground); --bg2:var(--surface2); --card:var(--surface); --card2:var(--surface2);
  --line:var(--line-row); --line2:var(--ink-glow);
  --teal:var(--accent); --teal-soft:var(--accent-tint); --onaccent:var(--surface);
  --garnet:#8C3B4A; --garnet-soft:#F2E0E1;
  --ochre:#A8762A; --ochre-soft:#F3E7CE; --ochre-ink:#85601F;
  --indigo:#3D4E7A; --olive:#5C6B3C;
  --maxw:600px;
  --tap:46px;
}
/* type sets (brief nutrilog-260928-type-sets): independent of the colour look */
html, html[data-type="fraunces"]{
  --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
  --font-body:'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --display-weight:300; --display-style:italic; --display-variation:'opsz' 144, 'SOFT' 100; --display-tracking:0; --display-scale:1;
}
html[data-type="marcellus"]{
  --font-display:'Marcellus', Georgia, 'Times New Roman', serif;
  --font-body:'Raleway', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --display-weight:400; --display-style:normal; --display-variation:normal; --display-tracking:.01em; --display-scale:1;
}
html[data-type="jost"]{
  --font-display:'Jost', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-body:'Jost', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --display-weight:300; --display-style:normal; --display-variation:normal; --display-tracking:-.005em; --display-scale:1.02;
}
html[data-look="ember"]{
  --ground:#F1E8DA; --surface:#F8F2E7; --surface2:#E8DDC8;
  --ink:#33291E; --ink2:#6E5F4B; --ink3:#6D5F4B; --accent-ink:#835724; --accent:#A9702F; --ornament:#8F7C61;
}
html[data-look="lichen"]{
  --ground:#ECEDE2; --surface:#F5F5EC; --surface2:#DFE2D2;
  --ink:#262B24; --ink2:#5B6358; --ink3:#5E645A; --accent-ink:#456B48; --accent:#4E7A52; --ornament:#7E8A79;
}
html[data-theme="dark"]{
  --ground:#15161A; --surface:#1B1C21; --surface2:#23242A;
  --ink:#E8E4DE; --ink2:#ABA6A0; --ink3:#908C89; --accent:#CFA3A0; --accent-ink:#CFA3A0; --ornament:#8F8A88;
  --accent-tint:color-mix(in srgb, var(--accent) 9%, transparent);
  --glow-strong:color-mix(in srgb, var(--accent) 42%, transparent);
  --glow-soft:color-mix(in srgb, var(--accent) 16%, transparent);
  --ink-glow:color-mix(in srgb, var(--ink) 16%, transparent); --line-section:color-mix(in srgb, var(--ink) 22%, transparent); --line-row:color-mix(in srgb, var(--ink) 12%, transparent); --sep-opacity:.55;
  --onaccent:var(--ground);
  --garnet:#D9909B; --garnet-soft:#2E1F22;
  --ochre:#D8A85E; --ochre-soft:#2C2418; --ochre-ink:#D8A85E;
  --indigo:#93A4D2; --olive:#A2B278;
}
html[data-look="ember"][data-theme="dark"]{
  --ground:#141110; --surface:#1B1714; --surface2:#231E19;
  --ink:#EEE3D2; --ink2:#B7A68D; --ink3:#97856D; --accent:#D9A066; --accent-ink:#D9A066; --ornament:#9C8A70;
}
html[data-look="lichen"][data-theme="dark"]{
  --ground:#0F1411; --surface:#151B17; --surface2:#1C231E;
  --ink:#E3E6D8; --ink2:#A6AF9D; --ink3:#818D7B; --accent:#9FBF9C; --accent-ink:#9FBF9C; --ornament:#8B9886;
}
@media (prefers-color-scheme: dark){
  html[data-theme="device"]{
    --ground:#15161A; --surface:#1B1C21; --surface2:#23242A;
    --ink:#E8E4DE; --ink2:#ABA6A0; --ink3:#908C89; --accent:#CFA3A0; --accent-ink:#CFA3A0; --ornament:#8F8A88;
    --accent-tint:color-mix(in srgb, var(--accent) 9%, transparent);
    --glow-strong:color-mix(in srgb, var(--accent) 42%, transparent);
    --glow-soft:color-mix(in srgb, var(--accent) 16%, transparent);
    --ink-glow:color-mix(in srgb, var(--ink) 16%, transparent); --line-section:color-mix(in srgb, var(--ink) 22%, transparent); --line-row:color-mix(in srgb, var(--ink) 12%, transparent); --sep-opacity:.55;
    --onaccent:var(--ground);
    --garnet:#D9909B; --garnet-soft:#2E1F22;
    --ochre:#D8A85E; --ochre-soft:#2C2418; --ochre-ink:#D8A85E;
    --indigo:#93A4D2; --olive:#A2B278;
  }
  html[data-look="ember"][data-theme="device"]{
    --ground:#141110; --surface:#1B1714; --surface2:#231E19;
    --ink:#EEE3D2; --ink2:#B7A68D; --ink3:#97856D; --accent:#D9A066; --accent-ink:#D9A066; --ornament:#9C8A70;
  }
  html[data-look="lichen"][data-theme="device"]{
    --ground:#0F1411; --surface:#151B17; --surface2:#1C231E;
    --ink:#E3E6D8; --ink2:#A6AF9D; --ink3:#818D7B; --accent:#9FBF9C; --accent-ink:#9FBF9C; --ornament:#8B9886;
  }
}

/* ---------- base ---------- */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body); font-weight:300;
  font-size:16px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overflow-wrap:break-word;
}
h1,h2,h3{font-family:var(--font-display);font-weight:var(--display-weight);font-style:var(--display-style);font-variation-settings:var(--display-variation);letter-spacing:var(--display-tracking);margin:0}
b,strong,th,h4,h5,h6{font-weight:400}
h1{font-size:calc(clamp(26px,7.5vw,32px) * var(--display-scale));line-height:1.15}
h2{font-size:calc(23px * var(--display-scale));line-height:1.2}
h3{font-size:calc(19px * var(--display-scale));line-height:1.25}
p{margin:0 0 12px}
p:last-child{margin-bottom:0}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--ochre);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums lining-nums}
html{font-variant-numeric:lining-nums}
input,select,textarea,button{font-variant-numeric:inherit}

/* ---------- layout ---------- */
#app{max-width:var(--maxw);margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
  backdrop-filter:blur(10px);
}
.topbar .brand{display:flex;min-width:0}
.topbar h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{flex:1;padding:16px 14px calc(96px + env(safe-area-inset-bottom))}
.screen{display:none;animation:fade .18s ease-out}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* reduced motion: see the motion block in app.css */

/* ---------- bottom nav ---------- */
#tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:grid;grid-template-columns:repeat(5,1fr);
  gap:2px;
  padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  backdrop-filter:blur(12px);
}
#tabbar .tab{
  background:none;border:0;cursor:pointer;color:var(--ink3);
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:7px 2px 5px;border-radius:14px;font-family:inherit;font-weight:400;
  min-height:var(--tap);
}
#tabbar .tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-linecap:round;stroke-linejoin:round}
#tabbar .tab[aria-current="page"] .dot{opacity:1}

/* ---------- cards, ornament ---------- */
.card{
  padding:16px;margin:0 0 14px;
}
.card > h2, .card > h3{margin-bottom:8px}
.orn{display:flex;align-items:center}
.orn::before,.orn::after{content:"";flex:1;height:1px}
.eyebrow{
  font-size:11.5px;font-weight:400;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink3);margin:0 0 6px;
}
.muted{color:var(--ink2);font-size:14.5px}
.tiny{font-size:13px;color:var(--ink2);line-height:1.5}

/* ---------- buttons ---------- */
button{font-family:inherit}
button svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.btn svg{width:18px;height:18px;flex:none}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:var(--tap);padding:11px 18px;
  border:1px solid var(--teal);background:var(--teal);color:var(--onaccent);
  font-size:15.5px;font-weight:400;cursor:pointer;text-decoration:none;
}
.btn:not(.ghost):not(.quiet):not(.danger){font-family:var(--font-display);font-weight:var(--display-weight);font-style:var(--display-style);font-variation-settings:var(--display-variation)}
.btn.quiet{border-color:var(--line2)}
.btn.danger{background:var(--garnet);border-color:var(--garnet);color:var(--onaccent)}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btnrow{display:flex;flex-wrap:wrap;gap:9px}
.iconbtn{
  width:var(--tap);height:var(--tap);min-width:var(--tap);border-radius:50%;
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;
}
.iconbtn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.linkbtn{background:none;border:0;color:var(--accent-ink);text-decoration:underline;text-underline-offset:3px;
  cursor:pointer;font-size:14.5px;padding:8px 0;min-height:38px}

/* ---------- forms ---------- */
.field{margin:0 0 16px}
.field > label, .flabel{display:block;font-size:13.5px;font-weight:400;color:var(--ink2);margin:0 0 6px;letter-spacing:.02em}
input[type=text],input[type=number],input[type=password],select,textarea{
  width:100%;min-height:var(--tap);padding:11px 13px;
  background:var(--card);color:var(--ink);
  border:1px solid var(--line2);border-radius:var(--r-sm);
  font-family:inherit;font-size:16px;
}
textarea{min-height:82px;resize:vertical;line-height:1.5}
input::placeholder,textarea::placeholder{color:var(--ink3);opacity:.85}
.opts{display:grid;gap:8px}
.opts.two{grid-template-columns:1fr 1fr}
.opts.three{grid-template-columns:repeat(3,1fr)}
.opt{
  display:flex;gap:10px;align-items:flex-start;
  border:1px solid var(--line2);background:var(--card);border-radius:var(--r-sm);
  padding:12px;cursor:pointer;min-height:var(--tap);
}
.opt input{position:absolute;opacity:0;width:0;height:0}
.opt .mark{
  width:19px;height:19px;flex:none;margin-top:1px;border-radius:50%;
  border:1.5px solid var(--line2);position:relative;background:var(--bg);
}
.opt.sq .mark{border-radius:6px}
.opt .txt{flex:1;min-width:0}
.opt .t1{font-size:15px;font-weight:400;display:block}
.opt .t2{font-size:13px;color:var(--ink2);display:block;margin-top:2px;line-height:1.45}
.opt:has(input:checked){border-color:var(--teal);background:var(--teal-soft)}
.opt:has(input:checked) .mark{border-color:var(--teal);background:var(--teal)}
.opt:has(input:checked) .mark::after{
  content:"";position:absolute;inset:0;margin:auto;width:7px;height:7px;border-radius:50%;background:var(--card)
}
.opt.sq:has(input:checked) .mark::after{
  width:5px;height:9px;border-radius:0;background:none;margin-top:2px;
  border:solid var(--card);border-width:0 2px 2px 0;transform:rotate(42deg)
}
.opt:has(input:focus-visible){outline:2px solid var(--ochre);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;font-family:inherit;
}
.chip[aria-pressed="true"]{border-color:var(--teal)}
.chip.add{border-style:dashed;color:var(--ink2)}
.inline{display:flex;gap:9px;align-items:flex-start}
.inline:has(> .field){align-items:flex-end;margin-bottom:16px}
.inline > .field{margin-bottom:0}
.inline > *{flex:1}
.inline > .none{flex:none}

/* ---------- range band (signature) ---------- */
.band{padding:18px 16px 12px;margin-bottom:14px}
.band .val{font-family:var(--font-display);font-size:calc(clamp(30px,10vw,42px) * var(--display-scale));line-height:1.05;font-weight:var(--display-weight);font-style:var(--display-style);font-variation-settings:var(--display-variation)}
.band .val .to{font-size:.55em;color:var(--ink2);padding:0 .18em;font-family:var(--font-body);font-weight:400;font-style:normal;font-variation-settings:normal}
.band .unit{font-size:.42em;color:var(--ink2);font-family:var(--font-body);font-weight:400;padding-left:.25em;font-style:normal;font-variation-settings:normal}
.macro{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.macro .m{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 10px;text-align:center}
.macro .m .k{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.macro .m .v{font-size:17px;font-weight:400;margin-top:3px;white-space:nowrap}
.macro .m .u{font-size:12px;color:var(--ink2)}
.macro .m.p{border-bottom:2px solid var(--teal)}
.macro .m.f{border-bottom:2px solid var(--ochre)}
.macro .m.c{border-bottom:2px solid var(--indigo)}

/* ---------- status / notices ---------- */
.notice{
  border-radius:var(--r-sm);padding:12px 13px;font-size:14px;line-height:1.5;
  border:1px solid var(--line2);background:var(--card2);margin:0 0 12px;
}
.notice.warn{border-color:var(--ochre);background:var(--ochre-soft)}
.notice.bad{border-color:var(--garnet);background:var(--garnet-soft)}
.notice.good{border-color:var(--teal);background:var(--teal-soft)}
.notice b{font-weight:400}
.bar{
  margin:0 14px 6px;padding:12px 14px;border-radius:var(--r-sm);
  border:1px solid var(--ochre);background:var(--ochre-soft);font-size:14px;
}
.bar.bad{border-color:var(--garnet);background:var(--garnet-soft)}
.bar .btnrow{margin-top:10px}
.verbatim{
  margin-top:8px;padding:10px 11px;border-radius:8px;
  background:var(--bg2);border:1px solid var(--line);
  font-size:13px;line-height:1.45;white-space:pre-wrap;word-break:break-word;
  max-height:230px;overflow:auto;
}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--ink2);font-size:14px}
.kv .v{font-size:14.5px;text-align:right;font-weight:400;min-width:0;overflow-wrap:anywhere}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px}
.pill.ok{border-color:var(--teal);color:var(--accent-ink);background:var(--teal-soft)}
.pill.err{border-color:var(--garnet);color:var(--garnet);background:var(--garnet-soft)}
.pill.wait{border-color:var(--ochre);color:var(--ochre-ink);background:var(--ochre-soft)}

/* ---------- sheet + toast ---------- */
.sheetbg{position:fixed;inset:0;z-index:60;background:rgba(30,22,10,.42);display:flex;align-items:flex-end;justify-content:center}
.sheet{
  width:100%;max-width:var(--maxw);max-height:88dvh;overflow:auto;
  background:var(--bg);border-radius:var(--r-lg) var(--r-lg) 0 0;
  border-top:1px solid var(--line);padding:18px 16px calc(20px + env(safe-area-inset-bottom));
  animation:up .2s ease-out;
}
@keyframes up{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
.sheet h2{margin-bottom:10px}
.sheet .close{position:absolute;right:14px;top:-52px}
.sheethead{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px}
.sheethead h2{flex:1}
ol.reasons{margin:0;padding-left:20px}
ol.reasons li{margin-bottom:11px;font-size:14.5px;line-height:1.55}
#toast{
  position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);
  z-index:70;background:var(--ink);color:var(--bg);padding:11px 17px;
  font-size:14px;max-width:min(92vw,var(--maxw));text-align:center;
}
.hide{display:none !important}

/* ---------- surfaces (reskin brief 2): tokens, cards, text softness, buttons, chips ---------- */
:root{
  --catch:rgba(255,255,255,.7);
  --outer:color-mix(in srgb, var(--ink) 8%, transparent);
  --halo2:color-mix(in srgb, var(--accent) 5%, transparent);
  --shadow:0 4px 24px var(--outer); --shadow-lift:0 4px 24px var(--outer);
  --r:14px; --r-sm:12px; --r-lg:18px;
}
html[data-theme="dark"]{
  --catch:color-mix(in srgb, var(--ink) 10%, transparent);
  --outer:rgba(0,0,0,.35);
  --halo2:color-mix(in srgb, var(--accent) 8%, transparent);
  --shadow:0 4px 24px var(--outer); --shadow-lift:0 4px 24px var(--outer);
}
@media (prefers-color-scheme: dark){
  html[data-theme="device"]{
    --catch:color-mix(in srgb, var(--ink) 10%, transparent);
    --outer:rgba(0,0,0,.35);
    --halo2:color-mix(in srgb, var(--accent) 8%, transparent);
    --shadow:0 4px 24px var(--outer); --shadow-lift:0 4px 24px var(--outer);
  }
}
body{text-shadow:0 0 9px var(--ink-glow)}
h1,h2,h3,.band .val,.btn:not(.ghost):not(.quiet):not(.danger){text-shadow:0 0 8px var(--glow-soft),0 0 24px var(--glow-soft)}
.eyebrow,.macro .m .k{text-shadow:0 0 6px var(--ink-glow)}
.card,.band{
  background:linear-gradient(180deg,var(--surface2) 0%,var(--surface) 26%);border:0;border-radius:14px;
  box-shadow:inset 0 0 0 1px var(--card-edge),inset 0 1px 0 var(--catch),inset 0 0 36px var(--glow-soft),0 4px 24px var(--outer);
}
.card.flat{background:var(--surface2);box-shadow:inset 0 0 0 1px var(--card-edge)}
.btn{border-radius:12px}
.btn:not(.ghost):not(.quiet):not(.danger){
  min-height:56px;padding:15px 18px;border:0;border-radius:14px;
  background:var(--accent-tint);color:var(--accent-ink);font-size:calc(20px * var(--display-scale));
  box-shadow:inset 0 0 0 1px var(--accent-border),inset 0 0 30px var(--accent-tint),0 0 24px var(--glow-soft);
}
.btn.quiet,.btn.ghost{background:var(--surface2);border:0;color:var(--ink2);box-shadow:inset 0 0 0 1px var(--card-edge)}
.chip,.pill{
  border:0;border-radius:9px;background:var(--accent-tint);color:var(--accent-ink);
  font-size:11px;letter-spacing:.04em;box-shadow:inset 0 0 0 1px var(--accent-border);text-shadow:0 0 8px var(--glow-soft);
}
.chip{min-height:36px;padding:8px 12px}
.chip[aria-pressed="true"]{background:var(--accent-tint);color:var(--accent-ink);box-shadow:inset 0 0 0 1px var(--accent-border),0 0 8px var(--glow-soft)}
#toast{border-radius:12px;box-shadow:0 4px 24px var(--outer)}


/* ---------- v0.2 components ---------- */

.daynav{display:flex;align-items:center;gap:10px;justify-content:space-between;margin:0 0 12px}
.daynav > span,.datepick{flex:1;text-align:center;font-weight:400}

.totals{display:flex;flex-direction:column;gap:2px}

.rbar{position:relative}
.rzone{position:absolute;background:var(--teal-soft);border-left:1.5px solid var(--teal);border-right:1.5px solid var(--teal)}

.band .val .unit{font-size:.42em}

.rowbtn{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 2px;font:inherit;color:var(--ink);cursor:pointer;text-align:left;min-height:var(--tap)}

.entry{display:grid;grid-template-columns:1fr auto;grid-template-areas:"n k" "m m";gap:2px 12px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:10px 2px;font:inherit;color:var(--ink);text-align:left;cursor:pointer}

.frow{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;margin:0 0 7px;font:inherit;color:var(--ink);cursor:pointer}

.rlist{display:flex;flex-direction:column;gap:9px}

.rthumb{flex:none;width:74px;height:74px;border-radius:12px;background:linear-gradient(135deg,var(--teal-soft),var(--ochre-soft));background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:var(--accent-ink);font-family:var(--font-display);font-size:30px;font-weight:400}

.rbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}

.rmeta{font-size:13px;color:var(--ink2)}
.rmeta .mi{white-space:nowrap}
.fhint{display:block;font-size:12px;line-height:1.3;color:var(--ink3);margin-top:4px}

.rtags{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.rtags .pill{font-size:11px;padding:2px 7px}
.star{color:var(--ochre)}
.btn svg,label.btn svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.rhero.has{height:220px}
.rhero{height:96px;border-radius:var(--r-lg);background:linear-gradient(135deg,var(--teal-soft),var(--ochre-soft));background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:var(--accent-ink);font-family:var(--font-display);font-size:64px}
.kvgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kvgrid > div{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 10px;display:flex;flex-direction:column;gap:1px}
.kvgrid .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.kvgrid .v{font-weight:400}
.stepper{display:flex;align-items:center;gap:8px}
.ing{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.ing:last-child{border-bottom:0}
.ing input{width:18px;height:18px;flex:none;accent-color:var(--teal);transform:translateY(3px)}
.ing .q{flex:none;min-width:64px;font-weight:400;color:var(--accent-ink)}
.ing .it{flex:1}
.ing input:checked ~ .it{color:var(--ink3);text-decoration:line-through}
.ptrow{display:flex;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.ptrow .it{flex:1}
.ptrow .chip{min-height:34px;padding:5px 10px}
ol.steps{margin:0;padding-left:22px}
ol.steps li{margin-bottom:10px;line-height:1.55}
ul.tips{margin:6px 0 0;padding-left:20px}
ul.tips li{margin-bottom:6px}
.src{padding:6px 0;border-bottom:1px solid var(--line)}
.src:last-child{border-bottom:0}
details summary{cursor:pointer}
.ntable .kv{padding:6px 0}

.scanbox{position:relative;border-radius:var(--r);overflow:hidden;background:#000;aspect-ratio:4/3}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanline{position:absolute;left:10%;right:10%;top:50%;height:2px;background:var(--garnet);box-shadow:0 0 12px var(--garnet)}
.phimg{width:100%;max-height:220px;object-fit:contain;border-radius:var(--r);background:var(--bg2);margin-bottom:12px}
.fit{display:inline-flex;align-items:center;justify-content:center;min-width:52px;height:36px;border-radius:999px;font-weight:400;font-size:15px;border:1.5px solid}
.fit.ok{color:var(--accent-ink);border-color:var(--teal);background:var(--teal-soft)}
.fit.wait{color:var(--ochre-ink);border-color:var(--ochre);background:var(--ochre-soft)}
.fit.err{color:var(--garnet);border-color:var(--garnet);background:var(--garnet-soft)}

.flag{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:10px;margin-bottom:6px;font-size:14px}
.flag .v{text-align:right}
.flag.lo{background:var(--ochre-soft)} .flag.lo2{background:var(--garnet-soft)} .flag.hi{background:var(--garnet-soft)}
.daychart{display:flex;flex-direction:column;width:100%;height:120px;margin-top:12px}

.sheetfoot{margin-top:16px;position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom));background:var(--bg);padding:10px 0 4px}
select{appearance:auto}
input[type=search],input[type=date]{width:100%;min-height:var(--tap);padding:11px 13px;background:var(--card);color:var(--ink);border:1px solid var(--line2);border-radius:var(--r-sm);font-family:inherit;font-size:16px}

/* ---------- surfaces (reskin brief 2): header, margins, tab bar, segments, bubbles, separators ---------- */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse 70% 30% at 50% 0%,var(--glow-soft) 0%,transparent 70%),
             radial-gradient(ellipse 80% 40% at 50% 110%,var(--halo2) 0%,transparent 70%)}
.topbar{background:color-mix(in srgb, var(--ground) 88%, transparent);border-bottom:1px solid var(--line-section);overflow:hidden}
.topbar .iconbtn{width:34px;height:34px;min-width:34px;border:0;background:var(--surface2);color:var(--ink2);
  box-shadow:inset 0 0 0 1px var(--card-edge),0 0 14px var(--outer)}
.topbar .iconbtn svg{width:16px;height:16px;stroke-width:1.3}
main{padding-left:32px;padding-right:32px}

.seg{background:var(--surface2);border:0;border-radius:10px;padding:3px;gap:3px;box-shadow:inset 0 0 0 1px var(--card-edge)}
.seg button{border-radius:8px;background:none;color:var(--ink3);font-size:12.5px;font-weight:400;letter-spacing:.03em;text-shadow:0 0 6px var(--ink-glow)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 0 14px var(--outer),inset 0 0 0 1px var(--card-edge)}
.bubble{border-radius:14px;box-shadow:none}
.bubble.me{background:var(--accent-tint);color:var(--ink);border:1px solid var(--accent-border);border-bottom-right-radius:4px}
.bubble.ai{background:var(--surface);color:var(--ink);border:1px solid var(--card-edge);border-bottom-left-radius:4px}
.orn{height:20px;gap:0;margin:16px 0}
.orn i{width:140px;height:20px;flex:none;background:none;transform:none;opacity:1}
.orn::before,.orn::after{background:linear-gradient(to right,transparent,var(--card-edge),transparent)}
.rowbtn .plus{width:30px;height:30px;flex:none;border:0;border-radius:50%;background:var(--surface2);color:var(--ink2);
  box-shadow:inset 0 0 0 1px var(--card-edge)}

/* ---------- header (reskin brief 2): ornament slot and screen label, centred ---------- */
.topbar{justify-content:center}
.topbar .brand{flex:none;flex-direction:column;align-items:center;gap:0;max-width:calc(100% - 92px)}

.topbar h1{font-family:var(--font-body);font-style:normal;font-variation-settings:normal;font-weight:400;font-size:10px;line-height:1.4;
  letter-spacing:.26em;text-transform:uppercase;color:var(--ink3);text-shadow:0 0 6px var(--ink-glow);margin-top:-2px}
#btnBack,#btnSettings{position:absolute;top:calc(env(safe-area-inset-top) + 14px)}
#btnBack{left:12px}

/* ---------- wide screens (brief layout-wide): side rail, content up to 1080 px, two columns, sheets as dialogs ---------- */
@media (min-width: 900px){
  body{padding-left:92px}
  #app{max-width:1080px}

/* ---- core.js ---- */
/* ============================================================
   NutriLog core: helpers, storage, records, state, migration,
   nutrient vocabulary, reference values, goal engine.
   Plain browser JavaScript, no build step beyond concatenation.
   ============================================================ */

/* ---------- 1. Small helpers ---------- */

const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function t(key, vars){
  const table = STR[S.lang] || STR.en;
  let s = table[key];
  if (s === undefined) s = (STR.en[key] !== undefined ? STR.en[key] : key);
  if (vars) for (const k in vars) s = s.split('{'+k+'}').join(String(vars[k]));
  return s;
}

/* Pick the Czech or English half of a {cs, en} pair. */
function L(obj){
  if (!obj) return '';
  if (typeof obj === 'string') return obj;
  return obj[S.lang] || obj.en || obj.cs || '';
}

/* Names that follow the app language even for records saved while the
   app was in the other language (v0.2.3). The stored text is not changed. */
function exclLabel(x){
  const k = x && x.id ? ALLERGENS.find(a => a.id === x.id) : null;
  return k ? L(k) : ((x && x.label) || '');
}

function icon(name, cls){
  return '<svg class="'+(cls||'')+'" aria-hidden="true"><use href="#i-'+name+'"/></svg>';
}

function locale(){ return S.lang === 'cs' ? 'cs-CZ' : 'en-GB'; }

function fmtNum(n, digits){
  if (n == null || !isFinite(n)) return '–';
  return new Intl.NumberFormat(locale(), {maximumFractionDigits: digits == null ? 0 : digits}).format(n);
}

/* Smart rounding for nutrient amounts: fewer decimals for bigger numbers. */
function fmtAmt(n){
  if (n == null || !isFinite(n)) return '–';
  const a = Math.abs(n);
  if (a >= 100) return fmtNum(n, 0);
  if (a >= 10) return fmtNum(n, 1);
  if (a >= 1) return fmtNum(n, 1);
  if (a === 0) return '0';
  return fmtNum(n, 2);
}

function numDate(d, withYear){
  if (typeof d === 'string') d = dateFromKey(d);
  let result = d.getDate() + '.' + (d.getMonth() + 1) + '.';
  if (withYear) result += d.getFullYear();
  return result;
}

function fmtDateTime(iso){
  if (!iso) return t('never');
  const d = new Date(iso);
  if (isNaN(d.getTime())) return iso;
  const hours = String(d.getHours()).padStart(2, '0');
  const minutes = String(d.getMinutes()).padStart(2, '0');
  return numDate(d) + ' ' + hours + ':' + minutes;
}

function fmtLongDate(d){
  return new Intl.DateTimeFormat(locale(), {weekday:'long', day:'numeric', month:'long'}).format(d);
}

function fmtShortDate(key){
  const d = dateFromKey(key);
  return new Intl.DateTimeFormat(locale(), {weekday:'short'}).format(d) + ' ' + numDate(d);
}

function ago(iso){
  if (!iso) return t('never');
  const mins = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 2) return t('just_now');
  if (mins < 60) return t('ago_min', {n: mins});
  const h = Math.floor(mins/60);
  if (h < 48) return t('ago_hour', {n: h});
  return t('ago_day', {n: Math.floor(h/24)});
}

/* Local calendar date, not UTC. The phone is in Prague; a date taken
   from UTC would jump a day every evening. */
function localDateKey(d){
  const x = d || new Date();
  const p = n => String(n).padStart(2,'0');
  return x.getFullYear()+'-'+p(x.getMonth()+1)+'-'+p(x.getDate());
}
function dateFromKey(key){
  const [y,m,d] = key.split('-').map(Number);
  return new Date(y, m-1, d, 12, 0, 0);
}
function addDays(key, n){
  const d = dateFromKey(key); d.setDate(d.getDate()+n); return localDateKey(d);
}
/* Returns true when the number of calendar days from startKey to dateKey
   is a multiple of every (including zero), so dateKey falls on a scheduled
   day of the cycle.  Works for dates before startKey too.  Falls back to
   true when startKey is missing or every is not a number >= 2. */
function cycleDue(startKey, dateKey, every){
  if (!startKey || typeof every !== 'number' || every < 2) return true;
  const s = dateFromKey(startKey).getTime();
  const d = dateFromKey(dateKey).getTime();
  const dayMs = 24 * 60 * 60 * 1000;
  const diff = Math.round((d - s) / dayMs);
  return Math.abs(diff % every) === 0;
}
function localTime(d){
  const x = d || new Date();
  const p = n => String(n).padStart(2,'0');
  return p(x.getHours())+':'+p(x.getMinutes());
}
/* ISO 8601 with the local offset, e.g. 2026-09-21T14:03:11+02:00.
   Other apps reading the data get both the instant and the wall clock. */
function nowIso(d){
  const x = d || new Date();
  const p = n => String(Math.floor(Math.abs(n))).padStart(2,'0');
  const off = -x.getTimezoneOffset();
  const sign = off >= 0 ? '+' : '-';
  return localDateKey(x)+'T'+p(x.getHours())+':'+p(x.getMinutes())+':'+p(x.getSeconds())+
    sign+p(off/60)+':'+p(off%60);
}
/* Parse an ISO 8601 timestamp to milliseconds since epoch.
   Returns 0 for null, undefined, empty, or unparseable input. */
function isoMs(s){
  if (!s || typeof s !== 'string') return 0;
  const ms = Date.parse(s);
  return Number.isFinite(ms) ? ms : 0;
}
/* Sort comparator for ISO 8601 timestamps (oldest first). */
function cmpIso(a, b){
  return isoMs(a) - isoMs(b);
}

/* UTF-8 safe base64. btoa alone throws on Czech diacritics. */
function b64encode(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  const step = 0x8000;
  for (let i = 0; i < bytes.length; i += step){
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i+step));
  }
  return btoa(bin);
}
function b64decode(b64){
  const bin = atob(String(b64).replace(/\s/g,''));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

/* Cheap stable hash, used only to notice that nothing changed. */
function hashString(str){
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++){
    h ^= str.charCodeAt(i);
    h = (h + ((h<<1)+(h<<4)+(h<<7)+(h<<8)+(h<<24))) >>> 0;
  }
  return h.toString(16);
}

/* Time sortable unique id (ULID layout: 10 chars time, 16 chars random).
   Safe to merge between devices and apps without collisions. */
const ULID_CHARS = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
function ulid(){
  let ts = Date.now(), timePart = '';
  for (let i = 0; i < 10; i++){ timePart = ULID_CHARS[ts % 32] + timePart; ts = Math.floor(ts / 32); }
  const rnd = new Uint8Array(16);
  crypto.getRandomValues(rnd);
  let r = '';
  for (let i = 0; i < 16; i++) r += ULID_CHARS[rnd[i] % 32];
  return timePart + r;
}

/* Strip diacritics and lowercase, for search. */
function fold(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
}

function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
function round1(n){ return Math.round(n*10)/10; }
function deepCopy(o){ return o == null ? o : JSON.parse(JSON.stringify(o)); }
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

function toastFadeMs(){
  if(document.body.classList.contains('quickmode')){ return 0; }
  const t = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--t-fast'));
  return isFinite(t) ? t : 160;
}
function toast(msg, ms){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.remove('hide', 'out');
  el.classList.remove('in');
  void el.offsetWidth;
  el.classList.add('in');
  clearTimeout(toast._tm);
  toast._tm = setTimeout(function(){
    el.classList.remove('in');
    el.classList.add('out');
    toast._tm = setTimeout(function(){
      el.classList.add('hide');
      el.classList.remove('out');
    }, toastFadeMs());
  }, ms || 3200);
}

/* ---------- 2. Storage. IndexedDB, schema 2 ----------
   kv              prefs, meta (app settings, not shared data)
   secrets         API keys. Never exported, never backed up.
   records         all personal data as typed records (see RECORD TYPES)
   recipes         recipe records: archive, starter, own and Claude recipes
   media           small images (photo thumbnails, recipe thumbnails)
   profileHistory  legacy from schema 1, kept read only
   snapshots       rolling daily copies kept on the device
   ------------------------------------------------------ */

const DB_NAME = 'nutrilog';
const DB_VERSION = 2;
let _db = null;

function openDB(){
  if (_db) return Promise.resolve(_db);
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      const txu = req.transaction;
      if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv', {keyPath:'key'});
      if (!db.objectStoreNames.contains('secrets')) db.createObjectStore('secrets', {keyPath:'key'});
      if (!db.objectStoreNames.contains('profileHistory')) db.createObjectStore('profileHistory', {keyPath:'id', autoIncrement:true});
      if (!db.objectStoreNames.contains('snapshots')) db.createObjectStore('snapshots', {keyPath:'date'});
      let rec;
      if (!db.objectStoreNames.contains('records')) rec = db.createObjectStore('records', {keyPath:'id'});
      else rec = txu.objectStore('records');
      if (!rec.indexNames.contains('type')) rec.createIndex('type', 'type');
      if (!rec.indexNames.contains('type_date')) rec.createIndex('type_date', ['type','date']);
      if (!db.objectStoreNames.contains('recipes')) db.createObjectStore('recipes', {keyPath:'id'});
      if (!db.objectStoreNames.contains('media')) db.createObjectStore('media', {keyPath:'id'});
    };
    req.onsuccess = () => {
      _db = req.result;
      _db.onversionchange = () => { try { _db.close(); } catch(e){} _db = null; };
      resolve(_db);
    };
    req.onerror = () => reject(req.error);
    req.onblocked = () => toast(t('db_blocked'), 8000);
  });
}

function tx(store, mode){
  return openDB().then(db => db.transaction(store, mode).objectStore(store));
}
function reqp(r){
  return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
}
async function dbGet(store, key){ return reqp((await tx(store,'readonly')).get(key)); }
async function dbAll(store){ return reqp((await tx(store,'readonly')).getAll()); }
async function dbPut(store, val){ return reqp((await tx(store,'readwrite')).put(val)); }
async function dbDel(store, key){ return reqp((await tx(store,'readwrite')).delete(key)); }
async function dbClear(store){ return reqp((await tx(store,'readwrite')).clear()); }
async function dbPutMany(store, vals){
  const db = await openDB();
  return new Promise((res, rej) => {
    const t2 = db.transaction(store, 'readwrite');
    const os = t2.objectStore(store);
    vals.forEach(v => os.put(v));
    t2.oncomplete = () => res(true);
    t2.onerror = () => rej(t2.error);
  });
}

async function kvGet(key, fallback){
  const r = await dbGet('kv', key);
  return r ? r.value : fallback;
}
async function kvSet(key, value){ return dbPut('kv', {key, value}); }

async function secretGet(key){
  const r = await dbGet('secrets', key);
  return r ? r.value : '';
}
async function secretSet(key, value){ return dbPut('secrets', {key, value}); }

/* ---------- 3. Records ----------
   Every piece of personal data is one record with the same envelope:
     id         ULID, or a fixed id for singletons ("profile")
     type       what kind of record (see RECORD_TYPES)
     schema     version of that type's body, starts at 1
     app        which app wrote it ("nutrilog")
     createdAt  ISO 8601 with offset
     updatedAt  ISO 8601 with offset, changes on every write
     deleted    true for a tombstone (kept so sync can see deletions)
     date       local calendar day YYYY-MM-DD, for dated records
   The body follows. Units are part of field names or fixed per nutrient.
   ------------------------------------------------------ */

const RECORD_TYPES = {
  profile:           {schema:2, shared:true},  /* body data, goals, food preferences */
  body_weight:       {schema:1, shared:true},  /* dated weight in kg */
  food_entry:        {schema:1, shared:true},  /* one eaten item on one day */
  supplement:        {schema:1, shared:true},  /* a supplement you take */
  supplement_intake: {schema:1, shared:true},  /* one intake on one day */
  food:              {schema:1, shared:true},  /* your own food: label, barcode, manual */
  recipe_note:       {schema:1, shared:true},  /* favourite, rating, notes, cooked dates for a recipe */
  pantry_item:       {schema:1, shared:true},  /* what is at home */
  chat_message:      {schema:1, shared:false}, /* chat history */
  photo_eval:        {schema:1, shared:false}, /* result of a photo evaluation */
  summary:           {schema:1, shared:true},  /* written weekly or monthly review */
  meal_plan:         {schema:1, shared:true},  /* saved suggestions or meal prep plan */
  cooking_session:   {schema:1, shared:true},  /* one cooking of a recipe: axis, flags, servings, changes, servings logged */
  recipe_overlay:    {schema:1, shared:true},  /* saved personal changes to one recipe */
  shopping_item:     {schema:1, shared:true}   /* one line of the shopping list */
};

let dirtyTimer = null;
function markDirty(reason){
  S.meta.dataChangedAt = nowIso();
  if (typeof scheduleSync === 'function') scheduleSync();
  if (dirtyTimer) clearTimeout(dirtyTimer);
  dirtyTimer = setTimeout(() => { dirtyTimer = null; saveMeta(); scheduleBackup(reason || 'data changed'); }, 400);
}

async function recPut(rec, opts){
  if (!rec.type || !RECORD_TYPES[rec.type]) throw new Error('Unknown record type: ' + rec.type);
  const now = nowIso();
  if (!rec.id) rec.id = ulid();
  if (!rec.createdAt) rec.createdAt = now;
  if (!rec.schema) rec.schema = RECORD_TYPES[rec.type].schema;
  if (!rec.app) rec.app = 'nutrilog';
  rec.updatedAt = now;
  if (rec.deleted === undefined) rec.deleted = false;
  await dbPut('records', rec);
  if (!opts || !opts.silent) markDirty(rec.type);
  return rec;
}
async function recGet(id){
  const r = await dbGet('records', id);
  return (r && !r.deleted) ? r : null;
}
async function recByType(type, includeDeleted){
  const os = await tx('records','readonly');
  const all = await reqp(os.index('type').getAll(type));
  return includeDeleted ? all : all.filter(r => !r.deleted);
}
async function recByTypeDate(type, from, to){
  const os = await tx('records','readonly');
  const range = IDBKeyRange.bound([type, from], [type, to]);
  const all = await reqp(os.index('type_date').getAll(range));
  return all.filter(r => !r.deleted);
}
async function recDelete(id){
  const r = await dbGet('records', id);
  if (!r) return;
  r.deleted = true;
  r.updatedAt = nowIso();
  await dbPut('records', r);
  markDirty(r.type + ' deleted');
}

function mergeDefaults(target, defaults){
  const out = deepCopy(defaults);
  if (!target) return out;
  for (const k in target){
    if (target[k] && typeof target[k] === 'object' && !Array.isArray(target[k]) && out[k] && typeof out[k] === 'object' && !Array.isArray(out[k])){
      out[k] = mergeDefaults(target[k], out[k]);
    } else if (target[k] !== undefined){
      out[k] = target[k];
    }
  }
  return out;
}

async function loadState(){

    await saveMeta();

  S.lang    = S.prefs.lang;

  await migrateFromSchema1();
  S.profile = await recGet('profile');
  /* v0.2.6: old diet style and aims chips become eating pattern, focus and hints (idea 8). The old fields stay stored. */
  if (S.profile && (!S.profile.food || S.profile.food.pattern === undefined)){
    S.profile = migrateDietV3(S.profile);

  }
  /* One-time upgrade: when modules are not set and the user already has data, turn everything on. */

    var has = S.profile !== null || S.secrets.anthropic !== '' || (await recByType('food_entry')).length > 0 || (await recByType('supplement')).length > 0;

function profileFromV1(p){
  if (!p) return null;
  const rec = {

    person: {
      sex: p.sex || '',
      age: p.age === '' || p.age == null ? null : Number(p.age),
      ageRecordedOn: (p.savedAt || nowIso()).slice(0,10),

    },

      dietStyle: [], aims: [], focusNutrients: [], notes: '',

async function migrateFromSchema1(){
  const existing = await dbGet('records', 'profile');
  if (existing) return;
  const old = await kvGet('profile', null);
  if (!old) return;
  const rec = profileFromV1(old);
  rec.createdAt = old.savedAt ? nowIso(new Date(old.savedAt)) : nowIso();
  await recPut(rec, {silent:true});
  /* every saved weight becomes a dated weight record */
  const hist = await dbAll('profileHistory');
  const byDay = {};
  hist.forEach(h => { if (h.weight && h.savedAt) byDay[localDateKey(new Date(h.savedAt))] = h; });
  for (const day in byDay){
    await recPut({type:'body_weight', date: day, kg: Number(byDay[day].weight), source:'profile'}, {silent:true});
  }
  S.meta.migratedFromSchema1 = nowIso();
  await saveMeta();
}

const NUT = {};
NUTRIENTS.forEach(n => { NUT[n.k] = n; });
const NUT_KEYS = NUTRIENTS.map(n => n.k);
/* EPA and DHA are also shown together, as the long chain omega 3. */
const NUT_DERIVED = { o3ld: {cs:'Omega 3, EPA a DHA', en:'Omega 3, EPA and DHA', unit:'mg', from:['epa','dha'], scale:1000, grp:'fat'} };

/* EU (EFSA) upper levels used to warn about supplements, in the units of
   NUTRIENTS. Only supplements are counted, so the warning is a lower bound:
   for most nutrients the limit covers food plus supplements; for magnesium
   it covers supplements only. Iron has a safe level (40 mg), not an upper
   level. Source: EFSA overview of upper levels, version 11, August 2025. */
const SUPP_UL = {vitd:100, vita:3000, vite:300, b6:12, mg:250, zn:25, se:255, iod:600, ca:2500, fe:40};

/* [{k, amount, ul}] for every SUPP_UL nutrient above its level, in SUPP_UL order. */
function suppUlOver(nutrients){
  if (!nutrients) return [];
  const out = [];
  for (const k of Object.keys(SUPP_UL)){
    const v = nutrients[k];
    if (typeof v === 'number' && isFinite(v) && v > SUPP_UL[k]) out.push({k, amount: v, ul: SUPP_UL[k]});
  }
  return out;
}

function nutLabel(k){ return NUT[k] ? L(NUT[k]) : (NUT_DERIVED[k] ? L(NUT_DERIVED[k]) : k); }
function nutUnit(k){ return NUT[k] ? NUT[k].unit : (NUT_DERIVED[k] ? NUT_DERIVED[k].unit : ''); }

/* Add nutrient maps. Unknown stays unknown: null + number = number, but the
   count of unknowns is tracked separately by the review. */
function nutAdd(acc, n, factor){
  if (!n) return acc;
  const f = factor == null ? 1 : factor;
  for (const k in n){
    const v = n[k];
    if (v == null || !isFinite(v)) continue;
    acc[k] = (acc[k] || 0) + v * f;
  }
  return acc;
}
function nutScale(n, factor){
  const out = {};
  for (const k in (n||{})){
    const v = n[k];
    out[k] = (v == null || !isFinite(v)) ? null : Math.round(v * factor * 1000) / 1000;
  }
  return out;
}
function nutRound(n){
  const out = {};
  for (const k in (n||{})){
    const v = n[k];
    if (v == null || !isFinite(v)) { out[k] = null; continue; }
    const a = Math.abs(v);
    out[k] = a >= 100 ? Math.round(v) : a >= 1 ? Math.round(v*10)/10 : Math.round(v*1000)/1000;
  }
  return out;
}

/* ---------- 7. Goal engine (from v0.1, unchanged maths) ----------
   Mifflin, St Jeor resting energy, times an activity band,
   widened into a range, then held above a floor. */

const ACTIVITY = [
  {id:1, mult:1.40, unc:0.13, k:'act1'},
  {id:2, mult:1.55, unc:0.13, k:'act2'},
  {id:3, mult:1.70, unc:0.14, k:'act3'},
  {id:4, mult:1.90, unc:0.16, k:'act4'}
];
const TRAIN_MET = {
  strength: 3.5, heavy: 6.0, cycling: 5.0, cyclinghard: 9.0,
  circuits: 7.5, hiit: 11.0, climbing: 5.8, yoga: 2.3
};
const TRAIN_ATTEND = { always: 0.9, usually: 0.75, sometimes: 0.5 };
function sessionKcal(type, weightKg, minutes) {
  var met = TRAIN_MET[type];
  if (met == null) met = 3.5;
  if (minutes == null || minutes === '' || isNaN(Number(minutes))) minutes = 60;
  else minutes = Number(minutes);
  if (minutes <= 0) return 0;
  var wk = Number(weightKg);
  if (!isFinite(wk) || wk <= 0) return 0;
  return (met - 1) * wk * minutes / 60;
}
function trainingPerDay(detail, weightKg) {
  if (!detail || detail.on !== true) return 0;
  var sessions = Number(detail.sessions);
  if (!sessions || sessions <= 0) return 0;
  var attend = TRAIN_ATTEND[detail.attendance];
  if (attend == null) attend = 0.75;
  var perSession = sessionKcal(detail.type, weightKg, detail.minutes);
  return perSession * sessions * attend / 7;
}

const SPLITS = {
  balanced: {p:25, f:30, c:45},
  protein:  {p:35, f:30, c:35},
  lowcarb:  {p:30, f:45, c:25}
};
const DIRECTIONS = { lose:0.90, maintain:1.00, gain:1.07 };
const RMR_REL_UNC = 0.10;
const FLOOR_ABS = { male:1500, female:1200 };
const DEFAULT_SLOTS = { breakfast:25, lunch:35, snack:10, dinner:30 };
const SLOTS = ['breakfast','lunch','snack','dinner'];
const SLOT_PRESETS = [
  {id:'three',   slots:{breakfast:30, lunch:35, snack:0,  dinner:35}},
  {id:'snack',   slots:{breakfast:25, lunch:35, snack:10, dinner:30}},
  {id:'bigbf',   slots:{breakfast:35, lunch:35, snack:10, dinner:20}},
  {id:'lightbf', slots:{breakfast:15, lunch:35, snack:15, dinner:35}}
];

function slotPresetId(slots){
  if (!slots) return null;
  for (var i = 0; i < SLOT_PRESETS.length; i++){
    var p = SLOT_PRESETS[i];
    var match = true;
    for (var j = 0; j < SLOTS.length; j++){
      if (Number(slots[SLOTS[j]]) !== p.slots[SLOTS[j]]){ match = false; break; }
    }
    if (match) return p.id;
  }
  return null;
}

function round10(n){ return Math.round(n/10)*10; }
function round5(n){ return Math.round(n/5)*5; }

/* The engine reads a flat view, so the maths stays exactly as tested. */
function flatProfile(rec){
  if (!rec || !rec.person) return null;
  const P = rec.person, G = rec.goals || {};
  const ms = G.macroSplit || {};
  return {
    sex: P.sex, age: P.age, height: P.heightCm, weight: P.weightKg,
    bodyFat: P.bodyFatPct, periods: P.periods,
    activity: P.activityLevel, direction: G.direction || 'maintain',
    split: ms.preset || 'balanced', custom: {p: ms.proteinPct, f: ms.fatPct, c: ms.carbPct}
  };
}

function computeTargets(rec){
  const p = flatProfile(rec);
  if (!p || !p.age || !p.weight) return null;
  const w = Number(p.weight), h = Number(p.height), a = Number(p.age);
  const bf = Number(p.bodyFat);
  let rmr, rmrRel, method;
  if (bf >= 3 && bf <= 60) {
    rmr = 22 * (w * (1 - bf/100)) + 500;
    rmrRel = 0.10;
    method = 'leanmass';
  } else if (h > 0) {
    rmr = 10*w + 6.25*h - 5*a - 78;
    rmrRel = Math.sqrt(0.10*0.10 + (83/rmr)*(83/rmr));
    method = 'mifflin';
  } else {
    const male = a < 30 ? 15.057*w + 692.2 : a < 60 ? 11.472*w + 873.1 : 11.711*w + 587.7;
    const female = a < 30 ? 14.818*w + 486.6 : a < 60 ? 8.126*w + 845.6 : 9.082*w + 658.5;
    rmr = (male + female) / 2;
    const half = Math.abs(male - female) / 2;
    rmrRel = Math.sqrt(0.12*0.12 + (half/rmr)*(half/rmr));
    method = 'weight';
  }
  const d = rec.person.activityDetail;
  if (d && d.on === true) {
    var band = ACTIVITY.find(x => x.id === Number(d.base));
    if (!band) band = ACTIVITY[0];
    var trainExact = trainingPerDay(d, w);
  } else {
    var band = ACTIVITY.find(x => x.id === Number(p.activity)) || ACTIVITY[1];
    var trainExact = 0;
  }
  const tdee = rmr * band.mult + trainExact;
  const actRel = band.unc / band.mult;
  const rel = Math.sqrt(rmrRel*rmrRel + actRel*actRel);
  const adj = DIRECTIONS[p.direction] || 1;
  let low  = tdee * (1 - rel) * adj;
  let high = tdee * (1 + rel) * adj;
  const floorAbs = 1200;
  const floor = Math.max(round10(rmr), floorAbs);
  let floorBinding = false;
  if (low < floor){ low = floor; floorBinding = true; }
  if (floorBinding && high < floor * 1.08) high = floor * 1.08;
  low = round10(low); high = round10(high);
  const split = p.split === 'custom'
    ? {p:Number(p.custom.p), f:Number(p.custom.f), c:Number(p.custom.c)}
    : SPLITS[p.split] || SPLITS.balanced;
  const mac = (pct, kcalPerG) => ({
    low:  round5(low  * pct/100 / kcalPerG),
    high: round5(high * pct/100 / kcalPerG)
  });
  const macros = { p: mac(split.p,4), f: mac(split.f,9), c: mac(split.c,4) };
  return {
    rmr: Math.round(rmr), mult: band.mult, tdee: Math.round(tdee), training: Math.round(Math.round(trainExact * 1e6) / 1e6),
    relPct: Math.round(rel*1000)/10, method,
    low, high, mid: round10((low+high)/2), floor, floorAbs, floorBinding, split, macros,
    proteinPerKg: { low: Math.round(macros.p.low/w*10)/10, high: Math.round(macros.p.high/w*10)/10 }
  };
}

function slotShares(){
  const s = (S.profile && S.profile.goals && S.profile.goals.slots) || DEFAULT_SLOTS;
  const sum = SLOTS.reduce((a,k) => a + (Number(s[k])||0), 0) || 100;
  const out = {};
  SLOTS.forEach(k => out[k] = (Number(s[k])||0) / sum);
  return out;
}

function splitPreview(rec){
  const g = computeTargets(rec);
  if (!g) return null;
  const kcal = g.mid;
  const weight = Number(rec.person.weightKg);
  const p = round5(kcal * g.split.p / 100 / 4);
  const f = round5(kcal * g.split.f / 100 / 9);
  const c = round5(kcal * g.split.c / 100 / 4);
  const pkg = Math.round(p / weight * 10) / 10;
  const fatHigh = g.split.f > 35;
  const s = (rec.goals && rec.goals.slots) || DEFAULT_SLOTS;
  const sum = SLOTS.reduce((a, k) => a + (Number(s[k]) || 0), 0) || 100;
  const slots = [];
  SLOTS.forEach(k => {
    const share = (Number(s[k]) || 0) / sum;
    if (share === 0) return;
    slots.push({ slot: k, kcal: round10(kcal * share) });
  });
  return { kcal, p, f, c, pkg, fatHigh, slots };
}

/* ---------- 8. Reference values ----------
   Daily values for adults from the European Food Safety Authority
   (EFSA Dietary Reference Values, 2017 summary report and updates),
   with WHO limits for saturated fat. kind:
     min   aim to reach at least this
     max   stay under this
     info  shown, never flagged
   ------------------------------------------------------ */

function referenceValues(){
  const p = flatProfile(S.profile) || {};
  const g = computeTargets(S.profile);
  const age = Number(p.age) || 30;
  const w = Number(p.weight) || 63.3;
  const f = clamp((w - 58.5) / (68.1 - 58.5), 0, 1);
  const mix = (fem, man, d) => d ? round1(fem + f*(man - fem)) : Math.round(fem + f*(man - fem));
  const kcal = g ? g.mid : 2250;
  const MJ = kcal * 4.184 / 1000;
  const ref = {
    kcal: {kind:'range', low: g ? g.low : null, high: g ? g.high : null},
    prot: {kind:'range', low: g ? g.macros.p.low : null, high: g ? g.macros.p.high : null},
    fat:  {kind:'range', low: g ? g.macros.f.low : null, high: g ? g.macros.f.high : null},
    carb: {kind:'range', low: g ? g.macros.c.low : null, high: g ? g.macros.c.high : null},
    fib:  {kind:'min', v:25},
    sug:  {kind:'info'},
    sfa:  {kind:'max', v: Math.round(kcal*0.10/9)},
    trans:{kind:'info'},
    chol: {kind:'info'},
    ala:  {kind:'min', v: round1(kcal*0.005/9)},
    o3ld: {kind:'min', v:250},
    na:   {kind:'max', v:2000},
    k:    {kind:'min', v:3500},
    ca:   {kind:'min', v: age < 25 ? 1000 : 950},
    mg:   {kind:'min', v: mix(300, 350)},
    p:    {kind:'min', v:550},
    fe:   {kind:'min', v: p.periods === 'no' ? 11 : 16},
    zn:   {kind:'min', v: mix(9.3, 11.7, 1)},
    cu:   {kind:'min', v: mix(1.3, 1.6, 1)},
    mn:   {kind:'min', v:3},
    se:   {kind:'min', v:70},
    iod:  {kind:'min', v:150},
    vita: {kind:'min', v: mix(650, 750)},
    vitd: {kind:'min', v:15},
    vite: {kind:'min', v: mix(11, 13, 1)},
    vitk: {kind:'min', v:70},
    vitc: {kind:'min', v: mix(95, 110)},
    b1:   {kind:'min', v: round1(0.1*MJ)},
    b2:   {kind:'min', v:1.6},
    b3:   {kind:'min', v: Math.round(1.6*MJ)},
    b5:   {kind:'min', v:5},
    b6:   {kind:'min', v: mix(1.6, 1.7, 1)},
    biot: {kind:'min', v:40},
    fol:  {kind:'min', v:330},
    b12:  {kind:'min', v:4},
    choline: {kind:'min', v:400},
    alc:  {kind:'info'},
    caff: {kind:'max', v:400}
  };
  return ref;
}

function impliedExclusions(rec){
  const F = (rec && rec.food) || {};
  const out = [];
  const push = (ids, label, type) => ids.forEach(id => out.push({id, label, type, syn: []}));
  const P = F.pattern, o = F.patternOpts || {};
  if (P === 'pescatarian') push(['meat'], t('fp_'+P), 'pattern');
  if (P === 'vegetarian') push(['meat','fish','crustaceans','molluscs'].concat(o.noEggs?['egg']:[], o.noMilk?['milk']:[]), t('fp_'+P), 'pattern');
  if (P === 'vegan') push(['meat','fish','crustaceans','molluscs','egg','milk','honey'], t('fp_'+P), 'pattern');
  if ((F.conditions||[]).indexOf('coeliac') >= 0) push(['gluten'], t('fc_coeliac'), 'condition');
  const R = {halal:['pork','alcohol'], kosher:['pork','crustaceans','molluscs'], nopork:['pork'], nobeef:['beef'], noalcohol:['alcohol']};
  (F.rules||[]).forEach(r => { if (R[r]) push(R[r], t('fr_'+r), 'rule'); });
  return out;
}

/* Convert old diet-style chips (rec.goals.dietStyle, rec.goals.aims)
   to the new profile fields (rec.food.pattern, etc.).
   Returns a deep copy; original is untouched. */
function migrateDietV3(rec){
  const r = deepCopy(rec);
  if (r.food && r.food.pattern !== undefined) return r;
  if (!r.food) r.food = {};
  if (!r.goals) r.goals = {};
  const ds = r.goals.dietStyle || [];
  const aims = r.goals.aims || [];

  // pattern
  if (ds.includes('vegan')) r.food.pattern = 'vegan';
  else if (ds.includes('vegetarian')) r.food.pattern = 'vegetarian';
  else if (ds.includes('pescatarian')) r.food.pattern = 'pescatarian';
  else if (ds.includes('flexitarian')) r.food.pattern = 'littlemeat';
  else r.food.pattern = 'everything';

  // patternOpts, conditions, rules
  r.food.patternOpts = { noEggs: false, noMilk: false };
  r.food.conditions = [];
  r.food.rules = [];

  // prefs
  r.food.prefs = [];
  if (ds.includes('glutenfree') && !(r.food.exclusions||[]).some(e => e.id === 'gluten'))
    r.food.prefs.push('avoidgluten');
  if (ds.includes('lactosefree')) r.food.prefs.push('lactosefreeproducts');

  // goals.focus: aims that are in HEALTH_FOCUS (aims order), then mediterranean from ds
  r.goals.focus = aims.filter(a => HEALTH_FOCUS.includes(a));
  if (ds.includes('mediterranean') && !r.goals.focus.includes('mediterranean'))
    r.goals.focus.push('mediterranean');

  // goals.hints: aims that are in SOFT_HINTS
  r.goals.hints = aims.filter(a => SOFT_HINTS.includes(a));

  return r;
}


/* All exclusion words for the hard filter, folded for matching.
   Longer words are cut by one letter so Czech endings still match
   (mléko, mléka, mlékem). Over matching is the safe side for allergies. */
function exclusionTerms(){
  const ex = (S.profile && S.profile.food && S.profile.food.exclusions) || [];
  const out = [];
  ex.concat(impliedExclusions(S.profile)).forEach(x => {
    /* a known allergen always carries the full, current list of other names */
    const known = x.id ? ALLERGENS.find(a => a.id === x.id) : null;
    const group = x.id && DIET_GROUPS[x.id] ? DIET_GROUPS[x.id] : [];
    const words = (x.type === 'pattern' || x.type === 'condition' || x.type === 'rule' ? [] : [x.label]).concat(x.syn || [], known ? known.syn.concat([known.cs, known.en]) : [], group).map(fold)
      .map(w => w.replace(/[^a-z0-9]+/g,' ').trim()).filter(w => w.length >= 3)
      .map(w => (w.length >= 5 && w.indexOf(' ') < 0) ? w.slice(0, -1) : w);
    out.push({id: x.id || null, label: (x.type === 'pattern' || x.type === 'condition' || x.type === 'rule') ? x.label : exclLabel(x), type: x.type, words});
  });
  return out;
}

/* Returns the exclusions a piece of text hits, e.g. a recipe's ingredient list. */
function exclusionHits(text){
  const base = ' ' + fold(text).replace(/[^a-z0-9]+/g,' ') + ' ';
  const hits = [];
  exclusionTerms().forEach(x => {
    let f = base;
    (EXCLUSION_FALSE_FRIENDS[x.id] || []).forEach(ph => { f = f.split(' ' + ph).join(' '); });
    for (const w of x.words){
      if (f.indexOf(' ' + w) >= 0){ hits.push({label:x.label, type:x.type, word:w}); break; }
    }
  });
  return hits;
}

/* Recipe amounts: common fractions as ¼ ½ ¾ ⅓ ⅔. */
function fmtQty(q){
  if (q == null || q === '') return '';
  const n = Number(q);
  if (!isFinite(n)) return String(q);
  const fr = [[0.25,'¼'],[0.5,'½'],[0.75,'¾'],[0.333,'⅓'],[0.667,'⅔']];
  const whole = Math.floor(n), rest = n - whole;
  for (const [v, s] of fr){ if (Math.abs(rest - v) < 0.04) return (whole ? whole : '') + s; }
  if (n >= 20) return fmtNum(Math.round(n));
  return fmtNum(n, 1);
}

const FOODDB = { ready:false, loading:null, foods:[], byId:{}, nutrients:[], source:'' };

async function loadFoodDb(){
  if (FOODDB.ready) return FOODDB;
  if (FOODDB.loading) return FOODDB.loading;
  FOODDB.loading = (async () => {
    const res = await fetch('data/foods.json?v=' + encodeURIComponent(VERSION));
    if (!res.ok) throw new Error('foods.json ' + res.status);
    const j = await res.json();
    FOODDB.nutrients = j.nutrients;
    FOODDB.source = j.source;
    FOODDB.foods = j.foods.map(f => {
      const per100 = {};
      j.nutrients.forEach((k, i) => { per100[k] = f.n[i]; });
      const food = {
        ref: 'usda:' + f.i, kind: 'usda', en: f.en, cs: f.cs || null, cat: f.c,
        per100, portions: (f.p || []).map(p => ({label: p[0], g: p[1]}))
      };
      food._tok = tokensOf(food.en + ' ' + (food.cs || ''));
      food._head = fold(food.en.split(',')[0]);
      return food;
    });
    FOODDB.foods.forEach(f => { FOODDB.byId[f.ref] = f; });
    FOODDB.ready = true;
    return FOODDB;
  })();
  try { return await FOODDB.loading; }
  catch(e){ FOODDB.loading = null; throw e; }
}

function tokensOf(s){
  return fold(s).replace(/[^a-z0-9%]+/g,' ').split(' ').filter(Boolean);

/* English alternatives for one Czech (or English) query word. */
function expandToken(tok){
  const alts = [tok];
  for (const [cs, en] of CS_EN){
    if (tok.startsWith(cs) || (cs.length >= 4 && cs.startsWith(tok) && tok.length >= 3)) alts.push(en);
  }
  return alts;
}

const PROCESSED = ['breaded','batter','tenders','nugget','patty','patties','fried','frozen','canned','prepared','with added','dehydrated','imitation','sweetened','flavored','mix,','powder','stick','substitute'];

/* Category weights: everyday groups first. */
const CAT_WEIGHT = {1:3,2:1,4:1,5:3,6:0,7:1,8:1,9:3,10:2,11:3,12:2,13:2,14:0,15:2,16:3,17:1,18:1,19:0,20:3,22:0,23:0};

function scoreFood(food, qTokens){
  let score = 0;
  for (let qi = 0; qi < qTokens.length; qi++){
    const alts = qTokens[qi];
    let best = -1;
    for (const a of alts){
      for (let i = 0; i < food._tok.length; i++){
        if (food._tok[i].startsWith(a)){
          const s = (food._tok[i] === a ? 3 : 2) + (i < 3 ? 2 : 0);
          if (s > best) best = s;
          break;
        }
      }
    }
    if (best < 0) return -1;
    score += best;
    if (qi === 0 && alts.some(a => food._head.startsWith(a))) score += 4;
  }
  score += (CAT_WEIGHT[food.cat] || 0);
  const en = food.en.toLowerCase();
  if (/\braw\b/.test(en)) score += 0.5;
  /* processed variants sink unless you asked for them */
  const q = qTokens.map(a => a.join(' ')).join(' ');
  PROCESSED.forEach(w => { if (en.indexOf(w) >= 0 && q.indexOf(w.slice(0, 4)) < 0) score -= 3; });
  if (/skinless|boneless|meat only|lean only/.test(en)) score += 0.8;
  score -= food.en.length / 90;
  return score;
}

/* Search everything local: your foods first, then the database. */
async function searchLocalFoods(q, limit){
  const qt = tokensOf(q);
  if (!qt.length) return [];
  const qTokens = qt.map(expandToken);
  const mine = (await recByType('food')).map(customFoodView);
  const out = [];
  mine.forEach(f => {
    f._tok = tokensOf(f.en + ' ' + (f.cs||'') + ' ' + (f.brand||''));
    f._head = fold((f.cs || f.en || '').split(',')[0]);
    const s = scoreFood(f, qTokens);
    if (s >= 0) out.push({food:f, s: s + 20});
  });
  try { await loadFoodDb(); } catch(e){ /* offline and never loaded: only own foods */ }
  FOODDB.foods.forEach(f => {
    const s = scoreFood(f, qTokens);
    if (s >= 0) out.push({food:f, s});
  });
  out.sort((a,b) => b.s - a.s);
  return out.slice(0, limit || 40).map(x => x.food);
}

/* Your own foods are records of type "food"; this gives them the same
   shape as database foods so the rest of the app treats them alike. */
function customFoodView(r){
  return {
    ref: 'food:' + r.id, kind: 'custom', id: r.id, en: r.name, cs: null, brand: r.brand || '',
    barcode: r.barcode || '', per100: r.per100 || {}, portions: r.portions || [], cat: -1,
    basis: r.basis || 'label', source: r.source || 'manual'

function foodName(food){
  if (!food) return '';
  if (food.kind === 'custom' || food.kind === 'off') return food.en + (food.brand ? ' · ' + food.brand : '');
  return (S.lang === 'cs' && food.cs) ? food.cs : food.en;
}

async function getFoodByRef(ref){
  if (!ref) return null;
  if (ref.startsWith('usda:')){ await loadFoodDb(); return FOODDB.byId[ref] || null; }
  if (ref.startsWith('food:')){ const r = await recGet(ref.slice(5)); return r ? customFoodView(r) : null; }
  return null;
}

/* Foods you logged recently, most frequent first. */
async function recentFoods(days, limit){
  const to = localDateKey(), from = addDays(to, -(days || 45));
  const entries = await recByTypeDate('food_entry', from, to);
  const count = {};
  const last = {};
  entries.forEach(e => {
    const ref = e.source && e.source.ref;
    if (!ref || !(ref.startsWith('usda:') || ref.startsWith('food:'))) return;
    count[ref] = (count[ref] || 0) + 1;
    if (!last[ref] || cmpIso(e.updatedAt, last[ref].updatedAt) > 0) last[ref] = e;
  });
  const refs = Object.keys(count).sort((a,b) => count[b] - count[a]).slice(0, limit || 12);
  const out = [];
  for (const ref of refs){
    const f = await getFoodByRef(ref);
    if (f) out.push({food:f, lastGrams: last[ref].amount && last[ref].amount.grams});
  }
  return out;
}
