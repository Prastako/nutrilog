/* ============================================================
   Chat with Claude about ingredients you have or miss, recipes,
   meal prep. Claude can update the pantry and save recipes through
   tools; everything it does is shown in the conversation.
   ============================================================ */

const CHAT_TOOLS = [
  {
    name: 'update_pantry',
    description: 'Update the list of ingredients the person has at home. Use when they say they have, bought, used up or ran out of something.',
    input_schema: {type:'object', properties:{
      have: {type:'array', items:{type:'string'}, description:'Ingredients now at home'},
      ran_out: {type:'array', items:{type:'string'}, description:'Ingredients used up; they go on the shopping list'},
      remove: {type:'array', items:{type:'string'}, description:'Remove from the list entirely'}
    }}
  },
  {
    name: 'save_recipe',
    description: 'Save a complete recipe to the person\'s recipe collection. Only when they ask to save or keep it.',
    input_schema: RECIPE_SCHEMA
  },
  {
    name: 'show_recipe',
    description: 'Show a recipe card from the archive so the person can open it. Use the archive id.',
    input_schema: {type:'object', properties:{ recipe_id:{type:'string'} }, required:['recipe_id']}
  }
];

let CHAT_HOST = null;
function chatQ(sel){ return (CHAT_HOST || document).querySelector(sel); }

function chatScrollEnd(){
  const log = chatQ('#chatLog');
  if (CHAT_HOST && CHAT_HOST.id !== 's-chat'){
    if (log) log.scrollTop = log.scrollHeight;
    else window.scrollTo(0, document.body.scrollHeight);
  } else {
    window.scrollTo(0, document.body.scrollHeight);
  }
}

async function chatHistory(){
  const all = await recByType('chat_message');
  const thread = S.meta.chatThread || null;
  return all.filter(m => (m.thread || null) === thread).sort((a,b) => cmpIso(a.createdAt, b.createdAt));
}

function chatBubble(m){
  if (m.role === 'note') return '<div class="cnote tiny">'+esc(m.text)+'</div>';
  const body = m.role === 'assistant' ? mdLite(m.text || '') : esc(m.text || '').replace(/\n/g,'<br>');
  let extra = '';
  (m.cards || []).forEach(id => { const r = RECIPES.byId[id]; if (r) extra += recipeCard(r); });
  return '<div class="bubble '+(m.role === 'user' ? 'me' : 'ai')+'">'+body+(extra ? '<div class="rlist" style="margin-top:8px">'+extra+'</div>' : '')+'</div>';
}

/* Tiny markdown: bold, bullet lists, numbered lists, headings. Enough for chat. */
function mdLite(src){
  const lines = esc(src).split('\n');
  let out = '', list = null;
  const close = () => { if (list){ out += '</'+list+'>'; list = null; } };
  lines.forEach(line => {
    let l = line.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    const ul = l.match(/^\s*[-•*]\s+(.*)$/), ol = l.match(/^\s*\d+[.)]\s+(.*)$/), hd = l.match(/^#{1,4}\s+(.*)$/);
    if (ul){ if (list !== 'ul'){ close(); out += '<ul>'; list = 'ul'; } out += '<li>'+ul[1]+'</li>'; }
    else if (ol){ if (list !== 'ol'){ close(); out += '<ol>'; list = 'ol'; } out += '<li>'+ol[1]+'</li>'; }
    else if (hd){ close(); out += '<p><b>'+hd[1]+'</b></p>'; }
    else if (!l.trim()){ close(); }
    else { close(); out += '<p>'+l+'</p>'; }
  });
  close();
  return out;
}

async function renderChat(host){
  host = host || (CHAT_HOST && CHAT_HOST.isConnected ? CHAT_HOST : $('#s-chat'));
  CHAT_HOST = host;
  const pantry = await recByType('pantry_item');
  const haveN = pantry.filter(p => p.have).length, buyN = pantry.filter(p => !p.have && p.toBuy).length;
  let h = '<div class="chatbar"><button class="chip" type="button" data-act="pantry">'+esc(t('pt_chip', {n: haveN}))+'</button>' +
    '<button class="chip" type="button" data-act="shopping">'+esc(t('pt_shop_chip', {n: buyN}))+'</button>' +
    '<button class="chip add" type="button" data-act="chat-new">'+esc(t('ch_new'))+'</button></div>';
  if (!S.secrets.anthropic) h += '<div class="notice warn">'+esc(t('ai_nokey_p'))+' <button class="linkbtn" type="button" data-act="go-settings">'+esc(t('open_settings'))+'</button></div>';
  const msgs = await chatHistory();
  h += '<div id="chatLog" class="chatlog">';
  if (!msgs.length) h += '<p class="tiny" style="text-align:center;margin:18px 0">'+esc(t('ch_empty'))+'</p>';
  msgs.forEach(m => { h += chatBubble(m); });
  h += '</div>';
  h += '<div class="chips scrollx" id="chatQuick">' + ['ch_q1','ch_q2','ch_q3','ch_q4'].map(k => '<button class="chip" type="button" data-q="'+k+'">'+esc(t(k))+'</button>').join('') + '</div>';
  h += '<div class="chatin"><textarea id="chatText" rows="1" placeholder="'+esc(t('ch_ph'))+'"></textarea>' +
    '<button class="btn" type="button" id="chatSend" aria-label="'+esc(t('ch_send'))+'">'+icon('send')+'</button></div>';
  host.innerHTML = h;
  fillThumbs(host);
  const ta = chatQ('#chatText');
  if (S.chatSeed){ ta.value = S.chatSeed; S.chatSeed = null; }
  ta.addEventListener('input', () => { ta.style.height = 'auto'; ta.style.height = Math.min(160, ta.scrollHeight) + 'px'; });
  chatQ('#chatSend').addEventListener('click', () => sendChat(ta.value));
  chatQ('#chatQuick').addEventListener('click', e => { const b = e.target.closest('[data-q]'); if (b) sendChat(t(b.getAttribute('data-q'))); });
  const log = chatQ('#chatLog');
  setTimeout(chatScrollEnd, 30);
  return log;
}

function chatScreenContext(){
  let s;
  switch(S.screen){
    case 'today': s = 'Screen: Today, ' + numDate(localDateKey(), true); break;
    case 'log': s = 'Screen: Log, ' + numDate(S.logDate || localDateKey(), true); break;
    case 'review':
      if (S.reviewMode !== 'month'){
        const r1 = periodRange('week', S.reviewAnchor);
        s = 'Screen: Review, week ' + numDate(r1.from, true) + ' – ' + numDate(r1.to, true);
      } else {
        const r2 = periodRange('month', S.reviewAnchor);
        s = 'Screen: Review, month ' + new Intl.DateTimeFormat('en-GB', {month:'long', year:'numeric'}).format(dateFromKey(r2.from));
      }
      break;
    case 'recipes':
      s = 'Screen: Recipes, ' + (S.recipeTab === 'all' ? 'All recipes' : 'Suggestions');
      const q = (S.recipeFilter && S.recipeFilter.q || '').trim();
      if (q) s += ', search "' + q + '"';
      break;
    case 'recipe':
      const r = RECIPES.byId[S.recipeId];
      s = 'Screen: Recipe, ' + (r ? r.title : '');
      if (r){
        const v = recipeView(r, {axis: S.recipeAxis || undefined, servings: S.recipeServings || undefined});
        if (v.schema2 && v.axis !== (r.written || 'omnivore')){
          s += ', version ' + v.axis.charAt(0).toUpperCase() + v.axis.slice(1);
        }
        if (S.recipeServings != null && Number(S.recipeServings) !== Number(r.servings)){
          s += ', ' + S.recipeServings + ' servings';
        }
      }
      break;
    case 'profile': s = 'Screen: Profile'; break;
    case 'settings': s = 'Screen: Settings'; break;
    case 'chat': s = 'Screen: Chat'; break;
    default: s = 'Screen: ' + S.screen;
  }
  return s.length > 120 ? s.slice(0, 120) : s;
}

async function sendChat(text){
  text = String(text || '').trim();
  if (!text || S.chatBusy) return;
  if (!(await ensureAiReady())) return;
  S.chatBusy = true;
  const thread = S.meta.chatThread || null;
  const screenCtx = chatScreenContext();
  await recPut({type:'chat_message', thread, role:'user', text, ctx: screenCtx}, {silent:true});
  const ta = chatQ('#chatText'); if (ta){ ta.value = ''; ta.style.height = 'auto'; }
  const log = chatQ('#chatLog');
  const emptyHint = log && log.querySelector('p.tiny'); if (emptyHint) emptyHint.remove();
  log.insertAdjacentHTML('beforeend', chatBubble({role:'user', text}));
  log.insertAdjacentHTML('beforeend', '<div class="bubble ai" id="liveBubble"><span class="typing"><i></i><i></i><i></i></span></div>');
  chatScrollEnd();
  const live = chatQ('#liveBubble');
  let shown = '';
  const cards = [];
  try {
    const ctx = await buildContext({today:true, pantry:true, recipes:true});
    const system = 'You are the kitchen and nutrition companion inside NutriLog, a personal food diary. ' + langInstruction() +
      ' Help with what to cook from the ingredients at home, what is missing, substitutions, meal prep and nutrition questions. Prefer recipes from the person\'s archive (show them with show_recipe). Never suggest anything from the hard exclusions. ' + recipeLangInstruction().replace('Write recipes', 'When you save a recipe with save_recipe, write it') + ' Keep answers short and practical; use lists for ingredients and steps. When the person mentions having, buying or running out of ingredients, call update_pantry. Each message ends with a bracketed line saying which screen the person was on when they sent it; \'this recipe\', \'today\' or \'this week\' refer to it.\n\n' + ctx;
    const hist = (await chatHistory()).filter(m => m.role === 'user' || m.role === 'assistant').slice(-20);
    let messages = [];
    hist.forEach(m => {
      const txt = (m.text || '').trim() || '…';
      const content = m.role === 'user' && m.ctx ? txt + '\n\n[' + m.ctx + ']' : txt;
      const last = messages[messages.length - 1];
      if (last && last.role === m.role) last.content += '\n\n' + content;
      else messages.push({role: m.role, content});
    });
    /* the API needs the conversation to start with the person */
    while (messages.length && messages[0].role !== 'user') messages.shift();
    for (let round = 0; round < 4; round++){
      const msg = await claudeStream({
        model: S.prefs.models.chat, max_tokens: 2500,
        system: [{type:'text', text: system, cache_control:{type:'ephemeral'}}],
        tools: CHAT_TOOLS, messages
      }, (delta) => { shown += delta; live.innerHTML = mdLite(shown); });
      const tools = msg.content.filter(b => b.type === 'tool_use');
      if (msg.stop_reason !== 'tool_use' || !tools.length) break;
      messages.push({role:'assistant', content: msg.content
        .filter(b => b.type === 'tool_use' || (b.type === 'text' && (b.text || '').trim()))
        .map(b => b.type === 'text' ? {type:'text', text: b.text} : {type:'tool_use', id: b.id, name: b.name, input: b.input})});
      const results = [];
      for (const tu of tools){
        const res = await runChatTool(tu, cards);
        results.push({type:'tool_result', tool_use_id: tu.id, content: res});
      }
      messages.push({role:'user', content: results});
      shown += shown && !shown.endsWith('\n') ? '\n\n' : '';
    }
    await recPut({type:'chat_message', thread, role:'assistant', text: shown.trim() || '…', cards}, {silent:true});
    live.outerHTML = chatBubble({role:'assistant', text: shown.trim() || '…', cards});
    fillThumbs($('#chatLog'));
    /* pantry counts may have changed through a tool call */
    const pantry = await recByType('pantry_item');
    const chips = $$('.chatbar .chip');
    if (chips.length >= 2){
      chips[0].textContent = t('pt_chip', {n: pantry.filter(p => p.have).length});
      chips[1].textContent = t('pt_shop_chip', {n: pantry.filter(p => !p.have && p.toBuy).length});
    }
  } catch(err){
    live.outerHTML = '<div class="notice bad">'+esc(t('err_prefix'))+'<div class="verbatim">'+esc(String(err.message||err))+'</div></div>';
  }
  S.chatBusy = false;
  chatScrollEnd();
}

async function runChatTool(tu, cards){
  const log = $('#chatLog');
  const note = (txt) => { log.insertAdjacentHTML('beforeend', '<div class="cnote tiny">'+esc(txt)+'</div>'); recPut({type:'chat_message', thread: S.meta.chatThread || null, role:'note', text: txt}, {silent:true}); };
  try {
    if (tu.name === 'update_pantry'){
      const inp = tu.input || {};
      const items = await recByType('pantry_item');
      const find = n => items.find(p => fold(p.name) === fold(n));
      const done = [];
      for (const n of (inp.have || [])){ const p = find(n); if (p){ p.have = true; p.toBuy = false; await recPut(p); } else await recPut({type:'pantry_item', name: n, have: true, toBuy: false}); done.push('+' + n); }
      for (const n of (inp.ran_out || [])){ const p = find(n); if (p){ p.have = false; p.toBuy = true; await recPut(p); } else await recPut({type:'pantry_item', name: n, have: false, toBuy: true}); done.push('−' + n); }
      for (const n of (inp.remove || [])){ const p = find(n); if (p) await recDelete(p.id); done.push('×' + n); }
      note(t('ch_pantry_done', {list: done.join(', ')}));
      return 'Pantry updated: ' + done.join(', ');
    }
    if (tu.name === 'save_recipe'){
      const r = recipeFromAi(tu.input || {}, 'claude');
      await saveRecipe(r);
      cards.push(r.id);
      note(t('ch_recipe_saved', {t: r.title}));
      return 'Saved with id ' + r.id;
    }
    if (tu.name === 'show_recipe'){
      const id = (tu.input || {}).recipe_id;
      if (RECIPES.byId[id]){ cards.push(id); return 'Shown to the person as a card.'; }
      return 'No recipe with that id.';
    }
  } catch(err){ return 'Error: ' + String(err.message || err); }
  return 'Unknown tool';
}

async function openPantry(shopping){
  const items = (await recByType('pantry_item')).sort((a,b) => a.name.localeCompare(b.name, locale()));
  const list = shopping ? items.filter(p => !p.have && p.toBuy) : items;
  let b = '<p class="tiny" style="margin-bottom:10px">'+esc(t(shopping ? 'pt_shop_note' : 'pt_note'))+'</p>' +
    '<div class="inline"><div class="field"><input id="ptNew" type="text" placeholder="'+esc(t('pt_add_ph'))+'"></div>' +
    '<button class="btn none" type="button" id="ptAdd">'+esc(t('p_add'))+'</button></div><div id="ptList">';
  if (!list.length) b += '<p class="muted">'+esc(t(shopping ? 'pt_shop_empty' : 'pt_empty'))+'</p>';
  list.forEach(p => {
    b += '<div class="ptrow"><span class="it">'+esc(p.name)+'</span>' +
      '<button class="chip" type="button" data-pt="'+esc(p.id)+'" data-v="have" aria-pressed="'+(!!p.have)+'">'+esc(t('pt_have'))+'</button>' +
      '<button class="chip" type="button" data-pt="'+esc(p.id)+'" data-v="buy" aria-pressed="'+(!p.have && !!p.toBuy)+'">'+esc(t('pt_buy'))+'</button>' +
      '<button class="iconbtn sm" type="button" data-pt="'+esc(p.id)+'" data-v="del" aria-label="'+esc(t('p_remove'))+'">'+icon('trash')+'</button></div>';
  });
  b += '</div>';
  const sheet = openSheet(esc(t(shopping ? 'pt_shop_h' : 'pt_h')), b,
    shopping && list.length ? '<button class="btn quiet" type="button" id="ptCopy">'+esc(t('pt_copy'))+'</button><button class="btn" type="button" id="ptBought">'+esc(t('pt_bought_all'))+'</button>' : null, {tall:true});
  const add = async () => {
    const v = $('#ptNew').value.trim();
    if (!v) return;
    for (const n of v.split(',').map(x => x.trim()).filter(Boolean)){
      const ex = items.find(p => fold(p.name) === fold(n));
      if (ex){ ex.have = !shopping; ex.toBuy = !!shopping; await recPut(ex); }
      else await recPut({type:'pantry_item', name: n, have: !shopping, toBuy: !!shopping});
    }
    openPantry(shopping);
  };
  $('#ptAdd').addEventListener('click', add);
  $('#ptNew').addEventListener('keydown', e => { if (e.key === 'Enter') add(); });
  sheet.addEventListener('click', async e => {
    const b2 = e.target.closest('[data-pt]');
    if (!b2) return;
    const p = items.find(x => x.id === b2.getAttribute('data-pt'));
    const v = b2.getAttribute('data-v');
    if (v === 'del') await recDelete(p.id);
    else if (v === 'have'){ p.have = true; p.toBuy = false; await recPut(p); }
    else if (v === 'buy'){ p.have = false; p.toBuy = true; await recPut(p); }
    openPantry(shopping);
  });
  const cp = $('#ptCopy');
  if (cp) cp.addEventListener('click', async () => {
    const txt = list.map(p => '- ' + p.name).join('\n');
    try { await navigator.clipboard.writeText(txt); toast(t('copied')); } catch(e){ toast(txt, 6000); }
  });
  const bo = $('#ptBought');
  if (bo) bo.addEventListener('click', async () => {
    for (const p of list){ p.have = true; p.toBuy = false; await recPut(p); }
    openPantry(true);
  });
}

/* ---- review.js ---- */
/* ============================================================
   Weekly and monthly review. Everything is computed on the phone from
   the diary; Claude only writes the optional commentary.
   Honest by design: a nutrient is judged only when enough of what you
   ate has a known value for it (coverage), otherwise it says so.
   ============================================================ */

function periodRange(mode, anchor){
  const a = dateFromKey(anchor || localDateKey());
  if (mode === 'month'){
    const from = new Date(a.getFullYear(), a.getMonth(), 1, 12);
    const to = new Date(a.getFullYear(), a.getMonth() + 1, 0, 12);
    return {from: localDateKey(from), to: localDateKey(to), key: 'month:' + localDateKey(from).slice(0,7)};
  }
  const dow = (a.getDay() + 6) % 7; /* Monday first */
  const from = new Date(a); from.setDate(a.getDate() - dow);
  const to = new Date(from); to.setDate(from.getDate() + 6);
  return {from: localDateKey(from), to: localDateKey(to), key: 'week:' + localDateKey(from)};
}

function periodLabel(mode, r){
  const f = dateFromKey(r.from), tt = dateFromKey(r.to);
  if (mode === 'month') return new Intl.DateTimeFormat(locale(), {month:'long', year:'numeric'}).format(f);
  const o = {day:'numeric', month:'numeric'};
  return numDate(f) + ' – ' + numDate(tt);
}

async function periodData(mode, anchor){
  const r = periodRange(mode, anchor);
  const entries = await recByTypeDate('food_entry', r.from, r.to);
  const intakes = S.prefs.review.includeSupplements ? await recByTypeDate('supplement_intake', r.from, r.to) : [];
  const days = {};
  entries.forEach(e => {
    if (!days[e.date]) days[e.date] = {total:{}, known:{}, kcal:0};
    const d = days[e.date];
    const n = e.nutrients || {};
    nutAdd(d.total, n);
    const kc = n.kcal || 0;
    d.kcal += kc;
    NUT_KEYS.forEach(k => { if (n[k] != null) d.known[k] = (d.known[k] || 0) + kc; });
  });
  const logged = Object.keys(days).sort();
  const nDays = logged.length;
  const sum = {}, known = {};
  let kcalAll = 0;
  logged.forEach(dk => { nutAdd(sum, days[dk].total); kcalAll += days[dk].kcal; NUT_KEYS.forEach(k => { known[k] = (known[k]||0) + (days[dk].known[k]||0); }); });
  /* supplements count only on logged days, so they do not inflate averages */
  const suppSum = {};
  intakes.filter(i => days[i.date]).forEach(i => nutAdd(suppSum, i.nutrients));
  const avg = {}, cov = {};
  NUT_KEYS.forEach(k => {
    const s = (sum[k] || 0) + (suppSum[k] || 0);
    avg[k] = nDays ? s / nDays : null;
    cov[k] = kcalAll ? (known[k] || 0) / kcalAll : 0;
    if (suppSum[k]) cov[k] = Math.max(cov[k], 0.99);
  });
  avg.o3ld = nDays ? (((sum.epa||0) + (sum.dha||0) + (suppSum.epa||0) + (suppSum.dha||0)) * 1000) / nDays : null;
  cov.o3ld = Math.min(cov.epa || 0, cov.dha || 0);
  if (suppSum.epa || suppSum.dha) cov.o3ld = 0.99;
  const totalDays = Math.round((dateFromKey(r.to) - dateFromKey(r.from)) / 86400000) + 1;
  return {range: r, entries, intakes, days, logged, nDays, totalDays, avg, cov, suppSum};
}

function nutrientStatus(k, avg, cov, ref){
  const R = ref[k];
  if (!R || R.kind === 'info') return {st:'info'};
  if (avg == null) return {st:'nodata'};
  if (R.kind === 'range'){
    if (R.low == null) return {st:'info'};
    return {st: avg < R.low * 0.9 ? 'low' : avg > R.high * 1.1 ? 'high' : 'ok', pct: avg / ((R.low + R.high)/2)};
  }
  if (cov < 0.6 && R.kind === 'min') return {st:'nodata', pct: avg / R.v};
  const pct = avg / R.v;
  if (R.kind === 'min') return {st: pct < 0.5 ? 'low2' : pct < 0.8 ? 'low' : pct < 1 ? 'close' : 'ok', pct};
  if (R.kind === 'max') return {st: pct > 1 ? 'high' : pct > 0.9 ? 'near' : 'ok', pct};
  return {st:'info'};
}

const REVIEW_KEYS = ['fib','prot','sfa','na','o3ld','ala','k','ca','mg','fe','zn','se','iod','vita','vitd','vite','vitk','vitc','b1','b2','b3','b6','fol','b12','choline','p','cu','mn','sug','alc','caff'];

function contributors(P, k, limit){
  const by = {};
  P.entries.forEach(e => {
    const n = e.nutrients || {};
    const v = k === 'o3ld' ? ((n.epa||0)+(n.dha||0))*1000 : n[k];
    if (!v) return;
    by[entryName(e)] = (by[entryName(e)] || 0) + v;
  });
  return Object.keys(by).map(name => ({name, v: by[name]})).sort((a,b) => b.v - a.v).slice(0, limit || 5);
}

let REVIEW_LAST = null;

function flagRow(r, ref){
  const R = ref[r.k];
  const target = R.v || R.low;
  return '<div class="flag '+(r.st === 'high' ? 'hi' : r.st === 'low2' ? 'lo2' : 'lo')+'"><span class="k">'+esc(nutLabel(r.k))+'</span>' +
    '<span class="v num">'+esc(fmtAmt(r.avg))+' / '+esc(fmtAmt(target))+' '+esc(nutUnit(r.k))+' <b>'+esc(Math.round((r.pct||0)*100))+' %</b></span></div>';
}

function dailyChart(P, g){
  const days = [];
  for (let k = P.range.from; k <= P.range.to; k = addDays(k, 1)) days.push(k);
  const vals = days.map(k => P.days[k] ? P.days[k].total.kcal || 0 : null);
  const max = Math.max(g ? g.high * 1.15 : 0, ...vals.filter(v => v != null), 1);
  const pct = x => (x * 100).toFixed(2) + '%';
  let s = '<div class="daychart" role="img" aria-label="'+esc(t('rv_chart'))+'"><div class="dc-plot">';
  if (g){
    const P1 = pct(1 - g.high / max);
    const P2 = pct((g.high - g.low) / max);
    s += '<div class="dc-band" style="top:'+P1+';height:'+P2+'"></div>';
  }
  s += '<div class="dc-cols">';
  for (let i = 0; i < days.length; i++){
    const v = vals[i];
    s += '<div class="dc-col">';
    if (v != null){
      const colour = g ? (v < g.low ? 'var(--ochre)' : v > g.high ? 'var(--garnet)' : 'var(--teal)') : 'var(--teal)';
      s += '<i class="dc-bar" style="height:'+pct(Math.min(v / max, 1))+';background:'+colour+'"></i>';
    }
    s += '</div>';
  }
  s += '</div></div>';
  s += '<div class="dc-labels">';
  if (days.length <= 7){
    for (const k of days) s += '<span>'+esc(new Intl.DateTimeFormat(locale(), {weekday:'short'}).format(dateFromKey(k)))+'</span>';
  } else {
    const last = days[days.length - 1];
    const marked = [1, 5, 10, 15, 20, 25, Number(last.slice(8))];
    for (const k of days){
      const d = Number(k.slice(8));
      s += '<span>' + (marked.includes(d) ? d : '') + '</span>';
    }
  }
  s += '</div></div>';
  return s;
}

async function reviewWithClaude(){
  if (!REVIEW_LAST) return;
  if (!(await ensureAiReady())) return;
  const {P, rows, ref} = REVIEW_LAST;
  const btn = $('#rvAi'); if (btn){ btn.disabled = true; btn.textContent = t('ai_working'); }
  const g = computeTargets(S.profile);
  const lines = [];
  lines.push('Days logged: ' + P.nDays + ' of ' + P.totalDays + '. Supplements included: ' + (S.prefs.review.includeSupplements ? 'yes' : 'no') + '.');
  if (g) lines.push('Average energy ' + Math.round(P.avg.kcal) + ' kcal (target ' + g.low + ' to ' + g.high + '); protein ' + Math.round(P.avg.prot) + ' g (' + g.macros.p.low + ' to ' + g.macros.p.high + '); fat ' + Math.round(P.avg.fat) + ' g; carbohydrate ' + Math.round(P.avg.carb) + ' g.');
  lines.push('Per nutrient (average per logged day / reference / status / data coverage):');
  rows.forEach(r => {
    const R = ref[r.k];
    const name = NUT[r.k] ? NUT[r.k].en : NUT_DERIVED[r.k].en;
    lines.push('- ' + name + ': ' + (r.avg == null ? '?' : fmtAmt(r.avg)) + ' ' + nutUnit(r.k) + ' / ' + (R ? (R.v || R.low || '-') : '-') + ' / ' + r.st + ' / ' + Math.round((r.cov||0)*100) + '%');
  });
  const top = {};
  P.entries.forEach(e => { const n = entryName(e); top[n] = (top[n] || 0) + 1; });
  lines.push('Most logged items: ' + Object.keys(top).sort((a,b) => top[b] - top[a]).slice(0, 15).map(n => n + ' (' + top[n] + 'x)').join(', '));
  const supp = Object.keys(P.suppSum).length ? 'Supplement contribution per period: ' + Object.keys(P.suppSum).map(k => nutLabel(k) + ' ' + fmtAmt(P.suppSum[k])).join(', ') : 'No supplements logged.';
  lines.push(supp);
  try {
    const text = await aiReview((S.reviewMode === 'month' ? 'month ' : 'week ') + periodLabel(S.reviewMode, P.range), lines.join('\n'));
    await recPut({type:'summary', periodKey: P.range.key, date: P.range.from, mode: S.reviewMode, text, model: S.prefs.models.analysis});
    renderReview();
  } catch(err){
    toast(t('err_prefix') + ': ' + String(err.message || err), 7000);
    if (btn){ btn.disabled = false; btn.textContent = t('rv_ai_btn'); }
  }
}

/* ---- backup.js ---- */
/* ============================================================
   Export format, backup and restore.
   One shape, versioned (schema 2). Secrets are deliberately left out:
   a token that backs itself up into the repository it writes to is a
   bad idea, and an export file gets shared by accident.
   The archive recipes are not in the backup: they live in the archive
   (Google Drive and the data repository). Your own and Claude recipes are.
   ============================================================ */

const EXPORT_KV_KEYS = ['prefs'];

async function buildPayload(){
  /* prefs.modules is device-local: never exported */
  const kv = (await dbAll('kv')).filter(r => EXPORT_KV_KEYS.indexOf(r.key) >= 0).map(r => {
    if (r.key !== 'prefs' || !r.value) return r;
    const v = Object.assign({}, r.value); delete v.modules; return {key: r.key, value: v};
  });
  const records = await dbAll('records');
  const recipes = (await dbAll('recipes')).filter(r => (r.origin === 'claude' || r.origin === 'own') && !r.deleted).map(r => { const c = Object.assign({}, r); delete c._search; return c; });
  return {
    app: 'nutrilog',
    schema: SCHEMA,
    appVersion: VERSION,
    exportedAt: nowIso(),
    format: 'docs/DATA_FORMAT.md in the nutrilog repository',
    recordTypes: RECORD_TYPES,
    nutrients: NUTRIENTS.map(n => ({key: n.k, infoods: n.tag, unit: n.unit, en: n.en})),
    data: { kv, records, recipes }
  };
}

function payloadIsEmpty(p){
  if (p.schema === 1) return !(p.data.kv || []).some(r => r.key === 'profile' && r.value);
  return !(p.data.records || []).some(r => !r.deleted) && !(p.data.recipes || []).length;
}

function validatePayload(obj){
  if (!obj || obj.app !== 'nutrilog' || !obj.data || !Array.isArray(obj.data.kv)) return {ok:false, why:'file'};
  if (typeof obj.schema !== 'number') return {ok:false, why:'file'};
  if (obj.schema > SCHEMA) return {ok:false, why:'schema', n:obj.schema};
  return {ok:true};
}

/* A restored file never changes which modules this device has on. */
function keepDeviceModules(rec){
  if (!rec || rec.key !== 'prefs' || !rec.value) return rec;
  const v = Object.assign({}, rec.value); delete v.modules;
  if (S.prefs && S.prefs.modules) v.modules = deepCopy(S.prefs.modules);
  return {key: rec.key, value: v};
}

async function applyPayload(obj){
  if (obj.schema === 1){
    /* a v0.1 backup: profile and weight history become records */
    await dbClear('records');
    for (const rec of obj.data.kv) if (rec.key === 'prefs') await dbPut('kv', keepDeviceModules(rec));
    const prof = (obj.data.kv.find(r => r.key === 'profile') || {}).value;
    if (prof){
      const r = profileFromV1(prof);
      await recPut(r, {silent:true});
      await kvSet('profile', prof);
    }
    for (const h of (obj.data.profileHistory || [])){
      if (h.weight && h.savedAt) await recPut({type:'body_weight', date: localDateKey(new Date(h.savedAt)), kg: Number(h.weight), source:'profile'}, {silent:true});
    }
  } else {
    await dbClear('records');
    for (const rec of obj.data.kv) await dbPut('kv', keepDeviceModules(rec));
    await dbPutMany('records', obj.data.records || []);
    const own = (await dbAll('recipes')).filter(r => r.origin === 'claude' || r.origin === 'own');
    for (const r of own) await dbDel('recipes', r.id);
    await dbPutMany('recipes', obj.data.recipes || []);
  }
  await loadState();
  await loadRecipes();
  applyTheme(); applyLang();
}

async function writeLocalSnapshot(){
  const payload = await buildPayload();
  if (payloadIsEmpty(payload)) return;
  await dbPut('snapshots', {date: localDateKey(), createdAt: nowIso(), payload});
  const all = await dbAll('snapshots');
  all.sort((a,b) => a.date < b.date ? 1 : -1);
  for (const s of all.slice(7)) await dbDel('snapshots', s.date);
}

async function exportManually(){
  const payload = await buildPayload();
  const text = JSON.stringify(payload, null, 2);
  const name = 'nutrilog-' + localDateKey() + '.json';
  const file = new File([text], name, {type:'application/json'});
  try {
    if (navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'NutriLog'});
      return;
    }
  } catch(e){
    if (e && e.name === 'AbortError') return;
  }
  const url = URL.createObjectURL(new Blob([text], {type:'application/json'}));
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 4000);
}

const GITHUB_API = 'https://api.github.com';
const BACKUP_LATEST = 'latest.json';
const BACKUP_SNAPDIR = 'snapshots/';

function parseRepo(){
  const raw = (S.prefs.backup.repo || '').trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/$/,'');
  const bits = raw.split('/');
  if (bits.length !== 2 || !bits[0] || !bits[1]) return null;
  return {owner: bits[0], repo: bits[1], full: bits[0]+'/'+bits[1]};
}

async function ghFetch(path, init){
  const res = await fetch(GITHUB_API + path, Object.assign({}, init, {
    headers: Object.assign({
      'Authorization': 'Bearer ' + S.secrets.github,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28'
    }, (init && init.headers) || {})
  }));
  let body = null;
  const txt = await res.text();
  try { body = txt ? JSON.parse(txt) : null; } catch(e){ body = {raw: txt}; }
  return {res, body, txt};
}

function ghErrorText(r){
  const msg = (r.body && (r.body.message || r.body.raw)) || r.txt || '';
  return r.res.status + ' ' + r.res.statusText + (msg ? ': ' + String(msg).slice(0,400) : '');
}

const BACKUP_TARGETS = {
  github: {
    id: 'github',
    label: 'GitHub',
    configured(){ return !!(S.secrets.github && parseRepo()); },
    describe(){ const r = parseRepo(); return r ? 'GitHub: ' + r.full : t('b_target_none'); },
    async getFile(path){
      const r = parseRepo();
      const q = '?ref=' + encodeURIComponent(S.prefs.backup.branch || 'main');
      const out = await ghFetch('/repos/'+r.owner+'/'+r.repo+'/contents/'+path+q);
      if (out.res.status === 404) return null;
      if (!out.res.ok) throw new Error(ghErrorText(out));
      return {sha: out.body.sha, text: out.body.content ? b64decode(out.body.content) : ''};
    },
    async putFile(path, text, message){
      const r = parseRepo();
      const url = '/repos/'+r.owner+'/'+r.repo+'/contents/'+path;
      const send = async (sha) => ghFetch(url, {
        method:'PUT',
        headers:{'content-type':'application/json'},
        body: JSON.stringify({
          message: message,
          content: b64encode(text),
          branch: S.prefs.backup.branch || 'main',
          sha: sha || undefined
        })
      });
      let existing = null;
      try { existing = await this.getFile(path); } catch(e){ existing = null; }
      let out = await send(existing ? existing.sha : null);
      /* 409 and 422 mean the file moved under us. Re-read and try once more,
         rather than giving up or overwriting blind. */
      if (out.res.status === 409 || out.res.status === 422){
        const again = await this.getFile(path);
        out = await send(again ? again.sha : null);
      }
      if (!out.res.ok) throw new Error(ghErrorText(out));
      return true;
    },
    async deleteFile(path){
      const r = parseRepo();
      const cur = await this.getFile(path);
      if (!cur) return true;
      const out = await ghFetch('/repos/'+r.owner+'/'+r.repo+'/contents/'+path, {
        method:'DELETE',
        headers:{'content-type':'application/json'},
        body: JSON.stringify({message:'NutriLog: remove write test', sha: cur.sha, branch: S.prefs.backup.branch || 'main'})
      });
      if (!out.res.ok) throw new Error(ghErrorText(out));
      return true;
    }
  }
};

function backupTarget(){ return BACKUP_TARGETS[S.prefs.backup.target] || BACKUP_TARGETS.github; }
function backupConfigured(){ return false; }  /* GitHub backup removed (brief settings-screens); export, import and snapshots stay */

let backupTimer = null;
let backupAttempt = 0;

function scheduleBackup(reason){
  if (!backupConfigured()) { renderBackupBar(); return; }
  if (backupTimer) clearTimeout(backupTimer);
  S.meta.backup.state = 'pending';
  renderBackupBar(); renderBackupPanel();
  backupTimer = setTimeout(() => { backupTimer = null; runBackup(reason); }, 45000);
}

async function runBackup(reason, opts){
  opts = opts || {};
  if (!backupConfigured()){ renderBackupBar(); return {ok:false, why:'unconfigured'}; }
  const payload = await buildPayload();
  if (payloadIsEmpty(payload)){
    S.meta.backup.state = 'empty'; await saveMeta();
    renderBackupBar(); renderBackupPanel();
    return {ok:false, why:'empty'};
  }
  const hash = hashString(JSON.stringify(payload.data));
  if (hash === S.meta.backup.lastHash && S.meta.backup.lastVerifiedAt && !opts.force){
    S.meta.backup.lastVerifiedAt = new Date().toISOString();
    S.meta.backup.state = 'idle';
    await saveMeta(); renderBackupBar(); renderBackupPanel();
    return {ok:true, same:true};
  }
  if (!navigator.onLine){
    S.meta.backup.state = 'offline'; await saveMeta();
    renderBackupBar(); renderBackupPanel();
    return {ok:false, why:'offline'};
  }

  S.meta.backup.state = 'running';
  renderBackupBar(); renderBackupPanel();
  const text = JSON.stringify(payload, null, 2);
  const today = localDateKey();
  try {
    await backupTarget().putFile(BACKUP_LATEST, text, 'NutriLog backup ' + new Date().toISOString() + ' (' + (reason||'') + ')');
    if (S.meta.backup.lastSnapshotDate !== today){
      await backupTarget().putFile(BACKUP_SNAPDIR + today + '.json', text, 'NutriLog snapshot ' + today);
      S.meta.backup.lastSnapshotDate = today;
    }
    const now = new Date().toISOString();
    S.meta.backup.lastUploadAt = now;
    S.meta.backup.lastVerifiedAt = now;
    S.meta.backup.lastHash = hash;
    S.meta.backup.lastError = null;
    S.meta.backup.lastErrorAt = null;
    S.meta.backup.state = 'idle';
    backupAttempt = 0;
    await saveMeta(); renderBackupBar(); renderBackupPanel();
    return {ok:true};
  } catch(err){
    S.meta.backup.state = 'error';
    S.meta.backup.lastError = String(err && err.message ? err.message : err);
    S.meta.backup.lastErrorAt = new Date().toISOString();
    await saveMeta(); renderBackupBar(); renderBackupPanel();
    backupAttempt++;
    const wait = [120000, 600000, 1800000][Math.min(backupAttempt-1, 2)];
    if (backupTimer) clearTimeout(backupTimer);
    backupTimer = setTimeout(() => { backupTimer = null; runBackup('retry'); }, wait);
    return {ok:false, why:'error', error: S.meta.backup.lastError};
  }
}

function backupHoursStale(){
  if (!S.meta.backup.lastVerifiedAt) return Infinity;
  return (Date.now() - new Date(S.meta.backup.lastVerifiedAt).getTime()) / 3600000;
}

function backupLine(){
  if (syncFresh()) return '';
  if (!backupConfigured() && !S.profile) return '<p id="backupLine">' + esc(t('b_line_nobackup_new')) + '</p>';
  if (!backupConfigured() && S.profile) return '<p id="backupLine">' + esc(t('b_line_nobackup_data')) + ' <button class="btn quiet" type="button" data-act="export">' + esc(t('bar_export')) + '</button></p>';
  if (backupHoursStale() > 48 && isFinite(backupHoursStale())){
    const h = Math.floor(backupHoursStale());
    return '<p id="backupLine">' + esc(t('b_line_stale', {h: h})) + ' <button class="btn quiet" type="button" data-act="backup-now">' + esc(t('b_run_now')) + '</button><button class="btn quiet" type="button" data-act="export">' + esc(t('bar_export')) + '</button></p>';
  }
  return '';
}

/* ---- sync.js ---- */
// Sync engine — pulls and pushes records through the sync server

const SYNC_URL = 'https://jrajmont--01a0d84f9098771d83cd77326fa78d80.web.val.run';
const SYNC_BATCH = 200;
const SYNC_DELAY_MS = 5000;
let syncTimer = null;
let syncRunning = false;
let syncRunQueued = null;
let syncPushing = false;
let syncPushAgain = false;

/* ---- syncBase ---- */
function syncBase() {
  var url = (S.prefs.sync && S.prefs.sync.url) ? S.prefs.sync.url.trim() : SYNC_URL;
  if (!url) url = SYNC_URL;
  while (url.length > 0 && url[url.length - 1] === '/') url = url.slice(0, -1);
  return url;
}

/* ---- syncKeyFromInput ---- */
function syncKeyFromInput(text) {
  var t = (text || '').trim();
  var idx = t.indexOf('#join=');
  if (idx >= 0) t = t.slice(idx + 6).trim();
  return t;
}

/* ---- syncFetch ---- */
async function syncFetch(method, path, body, key, opts) {
  var url = syncBase() + path;
  var init = {
    method: method,
    headers: {}
  };
  var k = (opts && opts.noAuth) ? '' : (key || S.secrets.sync);
  if (k) init.headers.Authorization = 'Bearer ' + k;
  if (opts && opts.keepalive) init.keepalive = true;
  if (body !== undefined) {
    init.headers['Content-Type'] = 'application/json';
    init.body = JSON.stringify(body);
  }
  var res = await fetch(url, init);
  if (res.status === 401) {
    var err = new Error('unauthorized');
    err.status = 401;
    throw err;
  }
  if (!res.ok) {
    var err2 = new Error('HTTP ' + res.status);
    err2.status = res.status;
    throw err2;
  }
  return await res.json();
}

/* ---- syncMe ---- */
async function syncMe(key) {
  var data = await syncFetch('GET', '/v1/me', undefined, key);
  return data.user;
}

/* ---- syncApplyItem ---- */
async function syncApplyItem(item) {
  if (item.store !== 'records' && item.store !== 'recipes') return false;
  var local = await dbGet(item.store, item.id);
  if (item.store === 'recipes' && local && (local.origin === 'catalog' || local.origin === 'starter' || local.origin === 'archive')) return false;
  if (local && isoMs(item.updatedAt) <= isoMs(local.updatedAt)) return false;
  var obj = Object.assign({}, item.body);
  obj.id = item.id;
  obj.updatedAt = item.updatedAt;
  obj.deleted = item.deleted === true;
  await dbPut(item.store, obj);
  return true;
}

/* ---- syncPull ---- */
async function syncPull(key) {
  var count = 0;
  for (var i = 0; i < 100; i++) {
    var data = await syncFetch('GET', '/v1/pull?after=' + (S.meta.sync.cursor || 0), undefined, key);
    if (S.secrets.sync !== key) return 0;
    if (data.items) {
      for (var j = 0; j < data.items.length; j++) {
        if (await syncApplyItem(data.items[j])) count++;
      }
    }
    if (typeof data.seq === 'number') {
      S.meta.sync.cursor = data.seq;
      await saveMeta();
    }
    if (data.more !== true) break;
  }
  if (count > 0) {
    S.profile = await recGet('profile');
    await loadRecipes();
    if (!S.sheetOpen) renderScreen(S.screen);
  }
  return count;
}

/* ---- syncPushable ---- */
function syncPushable(store, rec) {
  if (store === 'recipes') return rec.origin === 'own' || rec.origin === 'claude';
  if (store === 'records') return RECORD_TYPES[rec.type] && RECORD_TYPES[rec.type].shared;
  return false;
}

/* ---- syncDue ---- */
function syncDue(rec, since, ids) {
  if (!since) return true;
  var recMs = isoMs(rec.updatedAt);
  var sinceMs = isoMs(since);
  if (recMs > sinceMs) return true;
  if (recMs === sinceMs && !(ids || []).some(function(id) { return id === rec.id; })) return true;
  return false;
}

/* ---- syncPending ---- */
async function syncPending() {
  if (!S.meta.sync.lastPushAt) return true;
  var records = await dbAll('records');
  for (var i = 0; i < records.length; i++) {
    if (syncPushable('records', records[i]) && syncDue(records[i], S.meta.sync.lastPushAt, S.meta.sync.lastPushIds)) return true;
  }
  var recipes = await dbAll('recipes');
  for (var i = 0; i < recipes.length; i++) {
    if (syncPushable('recipes', recipes[i]) && syncDue(recipes[i], S.meta.sync.lastPushAt, S.meta.sync.lastPushIds)) return true;
  }
  return false;
}

/* ---- syncPush ---- */
async function syncPush(opts) {
  if (syncPushing) { syncPushAgain = true; return 0; }
  syncPushing = true;
  var count = 0;
  try {
    var since = S.meta.sync.lastPushAt;
    var items = [];
    var records = await dbAll('records');
    for (var i = 0; i < records.length; i++) {
      var rec = records[i];
      if (syncPushable('records', rec)) {
        if (syncDue(rec, since, S.meta.sync.lastPushIds)) {
          var body = {};
          for (var k in rec) {
            if (k !== '_search') body[k] = rec[k];
          }
          items.push({
            store: 'records',
            id: rec.id,
            updatedAt: rec.updatedAt,
            deleted: rec.deleted === true,
            body: body
          });
        }
      }
    }
    var recipes = await dbAll('recipes');
    for (var i = 0; i < recipes.length; i++) {
      var rec = recipes[i];
      if (syncPushable('recipes', rec)) {
        if (syncDue(rec, since, S.meta.sync.lastPushIds)) {
          var body = {};
          for (var k in rec) {
            if (k !== '_search') body[k] = rec[k];
          }
          items.push({
            store: 'recipes',
            id: rec.id,
            updatedAt: rec.updatedAt,
            deleted: rec.deleted === true,
            body: body
          });
        }
      }
    }
    items.sort(function(a, b) { return isoMs(a.updatedAt) - isoMs(b.updatedAt); });
    for (var start = 0; start < items.length; start += SYNC_BATCH) {
      var batch = items.slice(start, start + SYNC_BATCH);
      await syncFetch('POST', '/v1/push', { items: batch }, undefined, opts);
      var newPushAt = batch[batch.length - 1].updatedAt;
      if (S.meta.sync.lastPushAt === newPushAt) {
        S.meta.sync.lastPushIds = S.meta.sync.lastPushIds || [];
        for (var j = 0; j < batch.length; j++) {
          if (batch[j].updatedAt === newPushAt) {
            S.meta.sync.lastPushIds.push(batch[j].id);
          }
        }
      } else {
        S.meta.sync.lastPushAt = newPushAt;
        S.meta.sync.lastPushIds = [];
        for (var j = 0; j < batch.length; j++) {
          if (batch[j].updatedAt === newPushAt) {
            S.meta.sync.lastPushIds.push(batch[j].id);
          }
        }
      }
      await saveMeta();
      count += batch.length;
    }
  } finally {
    syncPushing = false;
  }
  if (syncPushAgain) {
    syncPushAgain = false;
    count += await syncPush(opts);
  }
  return count;
}

/* ---- syncFresh ---- */
function syncFresh() {
  if (!S.secrets.sync) return false;
  if (!S.meta.sync.lastOkAt) return false;
  return Date.now() - isoMs(S.meta.sync.lastOkAt) < 24 * 3600 * 1000;
}

/* ---- syncShow ---- */
function syncShow() {
  if (typeof renderSyncCard === 'function') renderSyncCard();
  renderBackupBar();
}

/* ---- syncRun ---- */
async function syncRun(reason, push) {
  if (syncRunning) {
    syncRunQueued = { reason: reason, push: !!push || !!(syncRunQueued && syncRunQueued.push) };
    return false;
  }
  syncRunning = true;
  var ok = false;
  try {
    ok = await syncRunOnce(reason, push);
  } finally {
    syncRunning = false;
  }
  if (syncRunQueued) {
    var q = syncRunQueued;
    syncRunQueued = null;
    await syncRun(q.reason, q.push);
  }
  return ok;
}

/* ---- syncRunOnce ---- */
async function syncRunOnce(reason, push) {
  var st = S.meta.sync;
  if (!S.secrets.sync || st.state === 'revoked') return false;
  if (navigator.onLine === false) {
    st.state = 'offline';
    await saveMeta();
    syncShow();
    return false;
  }
  var key = S.secrets.sync;
  try {
    await syncPull(key);
    if (S.secrets.sync !== key) return false;
    if (await syncPending()) await syncPush();
    if (S.secrets.sync !== key) return false;
    if (typeof catalogRun === 'function') await catalogRun(reason === 'now');
    if (S.secrets.sync !== key) return false;
    st.state = 'ok';
    st.lastOkAt = nowIso();
    st.lastError = '';
  } catch (err) {
    if (S.secrets.sync !== key) return false;
    if (err.status === 401) {
      st.state = 'revoked';
      clearTimeout(syncTimer);
      syncTimer = null;
    } else {
      st.state = 'error';
      st.lastError = String(err.message);
    }
  } finally {
    if (S.secrets.sync !== key) return false;
    await saveMeta();
    syncShow();
  }
  return st.state === 'ok';
}

async function syncAfterRestore() {
  if (!S.secrets.sync) return false;
  S.meta.sync.cursor = 0;
  S.meta.sync.lastPushAt = null;
  S.meta.sync.lastPushIds = [];
  await saveMeta();
  return await syncRun('restore', true);
}

/* ---- scheduleSync ---- */
function scheduleSync() {
  if (!S.secrets.sync || S.meta.sync.state === 'revoked') return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(function() {
    syncTimer = null;
    syncRun('change', true);
  }, SYNC_DELAY_MS);
}

/* ---- syncJoin ---- */
async function syncJoin(key, user) {
  if (S.secrets.sync && S.secrets.sync !== key) {
    S.secrets.sync = key;
    await dbClear('records');
    var recipes = await dbAll('recipes');
    for (var i = 0; i < recipes.length; i++) {
      if (recipes[i].origin === 'own' || recipes[i].origin === 'claude') {
        await dbDel('recipes', recipes[i].id);
      }
    }
    resetSessionState();
    await loadRecipes();
    renderScreen(S.screen);
  }
  S.secrets.sync = key;
  await secretSet('sync', key);
  S.meta.sync = {
    cursor: 0,
    lastPushAt: null,
    lastOkAt: null,
    state: 'ok',
    lastError: '',
    name: (user && user.name) || ''
  };
  await saveMeta();
  return await syncRun('join', true);
}

/* ---- syncLeave ---- */
async function syncLeave() {
  clearTimeout(syncTimer);
  S.secrets.sync = '';
  await secretSet('sync', '');
  S.meta.sync = {
    cursor: 0,
    lastPushAt: null,
    lastOkAt: null,
    state: 'off',
    lastError: '',
    name: ''
  };
  resetSessionState();
  await loadRecipes();
  renderScreen(S.screen);
  await saveMeta();
  syncShow();
}

/* ---- syncFlush ---- */
async function syncFlush() {
  if (syncTimer === null) return;
  clearTimeout(syncTimer);
  syncTimer = null;
  if (S.secrets.sync && S.meta.sync.state !== 'revoked' && navigator.onLine !== false) {
    syncPush({ keepalive: true }).catch(function(){});
  }
}

/* ---- catalog.js ---- */
/* ---- catalog ---- */

const CATALOG_MAX_AGE_MS = 6 * 3600 * 1000;

function catalogDue() {
  return !S.meta.catalog.lastOkAt || Date.now() - isoMs(S.meta.catalog.lastOkAt) >= CATALOG_MAX_AGE_MS;
}

async function catalogRun(force) {
  if (force || catalogDue()) {
    return await catalogPull();
  }
  return false;
}

async function catalogPull() {
  var first = !S.meta.catalog.cursor;
  if (navigator.onLine === false) {
    if (first) { S.catalogFailed = true; catalogShow(); }
    return false;
  }
  /* open catalog (brief open-catalog): no key when there is none or it was revoked */
  var noAuth = !S.secrets.sync || S.meta.sync.state === 'revoked';
  S.catalogBusy = first; S.catalogFailed = false; if (first) catalogShow();

  try {
    var cursor = S.meta.catalog.cursor;

    while (true) {
      var j = await syncFetch('GET', '/v1/catalog?after=' + cursor, undefined, undefined, {noAuth: noAuth});

      for (var i = 0; i < j.items.length; i++) {
        var item = j.items[i];
        if (item.deleted) {
          var r = await dbGet('recipes', item.id);
          if (r && r.origin === 'catalog') {
            await dbDel('recipes', item.id);
          }
        } else {
          var existing = await dbGet('recipes', item.id);
          if (!existing || existing.origin === 'catalog') {
            var rec = Object.assign({}, item.body);
            rec.id = item.id;
            rec.origin = 'catalog';
            await dbPut('recipes', rec);
          }
        }
      }

      S.meta.catalog.cursor = j.seq;
      await saveMeta();

      if (!j.more) break;
      cursor = j.seq;
    }

    S.meta.catalog.lastOkAt = nowIso();
    var all = await dbAll('recipes');
    S.meta.catalog.count = 0;
    for (var k = 0; k < all.length; k++) {
      if (all[k].origin === 'catalog') S.meta.catalog.count++;
    }
    S.meta.catalog.lastError = '';
    if (S.meta.catalog.count > 0 && !S.meta.catalog.starterOff) { S.meta.catalog.starterOff = true; S.prefs.archive.showStarter = false; await savePrefs(); }
    await saveMeta();
    if (typeof loadRecipes === 'function') await loadRecipes();
    S.catalogBusy = false; catalogShow();
    return true;
  } catch (err) {
    if (err.status === 401) {
      S.catalogBusy = false; if (first) { S.catalogFailed = true; } catalogShow();
      throw err;
    }
    S.meta.catalog.lastError = String(err.message);
    await saveMeta();
    S.catalogBusy = false; if (first) { S.catalogFailed = true; } catalogShow();
    return false;
  }
}
/* Recipes shows the first-download line while it runs and after it failed (brief open-catalog). */
function catalogShow() { if (S.screen === 'recipes' && typeof renderRecipes === 'function') renderRecipes(); }

/* ---- submit.js ---- */
/* ---- submit: send recipes to the shared catalog & list submissions ---- */

const SUBMIT = {list: [], prev: null};

function submitCheck(link, text, online) {
  var l = link.trim();
  var x = text.trim();
  var linkOk = l.startsWith('http://') || l.startsWith('https://');
  var err = '';
  if (!online) err = 'rs_offline';
  else if (l && !linkOk) err = 'rs_bad_link';
  else if (x.length > 20000) err = 'rs_too_long';
  var ok = !err && (linkOk || x.length >= 80);
  return {ok, err};
}

async function submitSend(link, text) {
  var l = link.trim();
  var x = text.trim();
  var body = {
    url: l || null,
    text: x || null
  };
  var status;
  try {
    var res = await fetch(syncBase() + '/v1/submissions', {
      method: 'POST',
      headers: {
        Authorization: 'Bearer ' + S.secrets.sync,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    });
    status = res.status;
    if (status >= 200 && status <= 299) {
      var j = await res.json();
      SUBMIT.list.unshift({
        id: j.submission.id,
        createdAt: j.submission.createdAt,
        status: 'pending',
        url: body.url,
        textStart: body.text ? body.text.slice(0, 60) : null,
        title: null,
        recipeId: null,
        reason: null
      });
      return {ok: true, submission: j.submission};
    }
    if (status === 401) {
      S.meta.sync.state = 'revoked';
      await saveMeta();
      syncShow();
      return {ok: false, err: 'sy_revoked'};
    }
    if (status === 429) {
      var j429 = await res.json();
      return {ok: false, err: 'rs_limit', limit: j429.limit};
    }
    return {ok: false, err: 'rs_err', msg: 'HTTP ' + status};
  } catch (e) {
    return {ok: false, err: 'rs_err', msg: e.message};
  }
}

async function submissionsFetch() {
  try {
    var j = await syncFetch('GET', '/v1/submissions');
    var items = (j.items || []).slice(0, 50);
    if (SUBMIT.prev !== null) {
      var anyNew = false;
      for (var i = 0; i < items.length; i++) {
        if ((items[i].status === 'published' || items[i].status === 'merged') &&
            SUBMIT.prev[items[i].id] === 'pending') {
          anyNew = true;
          break;
        }
      }
      if (anyNew) await catalogRun(true);
    }
    SUBMIT.prev = {};
    for (var k = 0; k < items.length; k++) {
      SUBMIT.prev[items[k].id] = items[k].status;
    }
    SUBMIT.list = items;
    return items;
  } catch (e) {
    if (e.status === 401) {
      S.meta.sync.state = 'revoked';
      await saveMeta();
      syncShow();
      return null;
    }
    return null;
  }
}

function submissionLabel(item) {
  if (item.title) return item.title;
  if (item.url) return new URL(item.url).host;
  return (item.textStart || '') + '…';
}

function submissionStatus(item) {
  switch (item.status) {
    case 'pending':
      return t('rs_st_pending');
    case 'published':
      return t('rs_st_published');
    case 'merged':
      return t('rs_st_merged', {title: item.title});
    case 'duplicate':
      return t('rs_st_duplicate', {title: item.title});
    case 'rejected':
      var R = 'rs_r_other';
      if (item.reason === 'not_recipe') R = 'rs_r_not_recipe';
      else if (item.reason === 'unreadable_link') R = 'rs_r_unreadable';
      else if (item.reason === 'invalid') R = 'rs_r_invalid';
      return t('rs_st_rejected', {reason: t(R)});
    default:
      return t('rs_st_pending');
  }
}

function profileMissing(d){
  const miss = [];
  if (!moduleOn('goals')) return miss;
  const P = d.person, G = d.goals;
  if (!P.age) miss.push(t('p_age'));
  if (!P.weightKg) miss.push(t('p_weight'));
  const inRange = (v,a,b) => Number(v) >= a && Number(v) <= b;
  if (P.age && !inRange(P.age,10,100)) miss.push(t('p_age')+' (10 '+t('range_to')+' 100)');
  if (P.heightCm && !inRange(P.heightCm,100,250)) miss.push(t('p_height')+' (100 '+t('range_to')+' 250)');
  if (P.weightKg && !inRange(P.weightKg,30,300)) miss.push(t('p_weight')+' (30 '+t('range_to')+' 300)');
  if (P.bodyFatPct != null && P.bodyFatPct !== '' && !inRange(P.bodyFatPct,3,60)) miss.push(t('p_bf')+' (3 '+t('range_to')+' 60)');
  if (G.macroSplit.preset === 'custom'){
    const sum = Number(G.macroSplit.proteinPct)+Number(G.macroSplit.fatPct)+Number(G.macroSplit.carbPct);
    if (sum !== 100) miss.push(t('ms_sum_err'));
  }
  if (P.activityDetail && P.activityDetail.on === true){
    var adS = P.activityDetail.sessions;
    if (adS != null && adS !== '' && !(Number(adS) >= 0 && Number(adS) <= 14)) miss.push(t('ad_sessions')+' (0 '+t('range_to')+' 14)');
    var adM = P.activityDetail.minutes;
    if (adM != null && adM !== '' && !(Number(adM) >= 10 && Number(adM) <= 240)) miss.push(t('ad_minutes')+' (10 '+t('range_to')+' 240)');
  }
  return miss;
}

async function saveProfile(){
  const d = S.draft;
  const miss = profileMissing(d);
  if (miss.length){ toast(t('p_missing', {list: miss.join(', ')}), 5000); return; }
  const rec = deepCopy(d);
  ['age','heightCm','weightKg','bodyFatPct','activityLevel'].forEach(k => { rec.person[k] = rec.person[k] === '' || rec.person[k] == null ? null : Number(rec.person[k]); });
  if (rec.person.periods !== 'yes' && rec.person.periods !== 'no' && rec.person.periods !== 'skip') { rec.person.periods = 'skip'; }
  if (rec.person.activityDetail){
    var ad = rec.person.activityDetail;
    ad.on = ad.on === true;
    ad.base = Number(ad.base);
    if (ad.base < 1 || ad.base > 4) ad.base = 1;
    if (ad.sessions === '' || ad.sessions == null) ad.sessions = 0; else ad.sessions = Number(ad.sessions);
    if (ad.minutes === '' || ad.minutes == null) ad.minutes = 60; else ad.minutes = Number(ad.minutes);
  }
  ['proteinPct','fatPct','carbPct'].forEach(k => { rec.goals.macroSplit[k] = Number(rec.goals.macroSplit[k]); });
  SLOTS.forEach(s => { rec.goals.slots[s] = Number(rec.goals.slots[s]) || 0; });
  rec.kitchen.timeWeekday = Number(rec.kitchen.timeWeekday); rec.kitchen.timeWeekend = Number(rec.kitchen.timeWeekend);
  rec.kitchen.mealPrep.cookDaysPerWeek = Number(rec.kitchen.mealPrep.cookDaysPerWeek) || 0;
  rec.kitchen.mealPrep.batchServings = Number(rec.kitchen.mealPrep.batchServings) || 1;
  const prevWeight = S.profile && S.profile.person ? S.profile.person.weightKg : null;
  const prevAge = S.profile && S.profile.person ? S.profile.person.age : null;
  if (rec.person.age !== prevAge || !rec.person.ageRecordedOn) rec.person.ageRecordedOn = localDateKey();
  await recPut(rec);
  S.profile = rec;
  if (rec.person.weightKg !== prevWeight){
    const today = localDateKey();
    const w = (await recByTypeDate('body_weight', today, today))[0];
    if (w){ w.kg = rec.person.weightKg; await recPut(w); }
    else await recPut({type:'body_weight', date: today, kg: rec.person.weightKg, source:'profile'});
  }
  await writeLocalSnapshot();
  toast(t('p_saved'));
  S.draft = null;
  if (S.afterStart){ S.afterStart = false; S.recipeTab = 'all'; go('recipes'); }
  else go('today');
}

function testOut(id, cls, msg, verbatim){
  const el = document.getElementById(id);
  if (!el) return;
  el.innerHTML = '<div class="notice '+cls+'">'+esc(msg)+(verbatim ? '<div class="verbatim">'+esc(verbatim)+'</div>' : '')+'</div>';
}

async function testAnthropic(){
  const fld = $('#k-anthropic');
  const key = String((fld ? fld.value : S.secrets.anthropic) || '');
  if (!key.trim()){ testOut('r-anthropic','warn', t('test_need_key')); return; }
  S.secrets.anthropic = key.trim(); await secretSet('anthropic', S.secrets.anthropic);
  testOut('r-anthropic','', t('test_running'));
  try {
    const body = await API.anthropic('/v1/models?limit=100', {method:'GET'});
    const ids = (body.data || []).map(m => m.id);
    let msg = t('anthropic_ok', {n: ids.length});
    const want = [S.prefs.models.chat, S.prefs.models.vision, S.prefs.models.analysis].filter((v,i,a) => a.indexOf(v) === i);
    const missing = want.filter(m => ids.indexOf(m) < 0 && !ids.some(id => id.indexOf(m) === 0));
    msg += ' ' + (missing.length ? t('m_check_bad', {list: missing.join(', ')}) : t('m_check_ok'));
    testOut('r-anthropic', missing.length ? 'warn' : 'good', msg);
  } catch(err){
    testOut('r-anthropic','bad', t('err_prefix'), String(err.message || err));
  }
}

function pagesRepoGuess(){
  const host = location.hostname;
  if (!/\.github\.io$/i.test(host)) return null;
  const user = host.replace(/\.github\.io$/i,'');
  const seg = location.pathname.split('/').filter(Boolean)[0];
  return {owner: user, repo: seg || host};
}

async function testGithub(){
  const fldK = $('#k-github'), fldR = $('#k-repo'), fldB = $('#k-branch');
  const key = String((fldK ? fldK.value : S.secrets.github) || '');
  if (fldR) S.prefs.backup.repo = String(fldR.value || '').trim();
  if (fldB && String(fldB.value || '').trim()) S.prefs.backup.branch = String(fldB.value).trim();
  S.secrets.github = key.trim();
  await secretSet('github', S.secrets.github);
  await savePrefs();
  const r = parseRepo();
  if (!S.secrets.github || !r){ testOut('r-github','warn', t('test_need_repo')); return; }
  testOut('r-github','', t('test_running'));
  const lines = [];
  let worst = 'good';
  try {
    const info = await ghFetch('/repos/'+r.owner+'/'+r.repo);
    if (!info.res.ok) throw new Error(ghErrorText(info));
    if (info.body.private) lines.push(t('repo_private_ok'));
    else { lines.push(t('repo_public_warn')); worst = 'bad'; }
    const pages = pagesRepoGuess();
    if (pages && pages.owner.toLowerCase() === r.owner.toLowerCase() && pages.repo.toLowerCase() === r.repo.toLowerCase()){
      lines.push(t('repo_is_pages_warn')); worst = 'bad';
    }
    await backupTarget().putFile('nutrilog-write-test.txt', 'NutriLog write test ' + new Date().toISOString() + '\n', 'NutriLog: write test');
    lines.push(t('write_ok'));
    try { await backupTarget().deleteFile('nutrilog-write-test.txt'); }
    catch(e){ lines.push(t('delete_fail')); if (worst === 'good') worst = 'warn'; }
    const existing = await backupTarget().getFile(BACKUP_LATEST);
    if (existing && !S.profile) lines.push(t('b_restore_cloud') + ': ' + BACKUP_LATEST);
    testOut('r-github', worst, lines.join(' '));
  } catch(err){
    testOut('r-github','bad', t('write_fail'), String(err.message || err));
  }
  renderBackupBar();
}

/* ---------- Diagnostics (from v0.1) ---------- */

function diagRows(){
  const standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches)
    || (window.matchMedia && matchMedia('(display-mode: fullscreen)').matches)
    || navigator.standalone === true;
  let sw;
  if (!('serviceWorker' in navigator)) sw = t('dg_sw_no');
  else if (navigator.serviceWorker.controller) sw = t('dg_sw_on');
  else if (S.swRegistered === true) sw = t('dg_sw_reg');
  else if (S.swRegistered === false) sw = t('dg_sw_fail');
  else sw = t('d_unknown');
  const yn = (v) => v ? t('dg_yes') : t('dg_no');
  const cam = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  return [
    [t('dg_mode'), standalone ? t('dg_mode_app') : t('dg_mode_tab'), standalone ? 'ok' : 'warn'],
    [t('dg_sw'), sw, (sw === t('dg_sw_on') || sw === t('dg_sw_reg')) ? 'ok' : 'warn'],
    [t('d_persist'), S.meta.persistGranted === null ? t('d_unknown') : (S.meta.persistGranted ? t('d_persist_yes') : t('d_persist_no')), S.meta.persistGranted ? 'ok' : 'warn'],
    [t('dg_barcode'), yn('BarcodeDetector' in window), ('BarcodeDetector' in window) ? 'ok' : 'warn'],
    [t('dg_camera'), yn(cam), cam ? 'ok' : 'warn'],
    [t('dg_share'), yn(!!navigator.share), navigator.share ? 'ok' : 'warn'],
    [t('dg_fooddb'), FOODDB.ready ? t('dg_fooddb_ok', {n: FOODDB.foods.length}) : t('dg_fooddb_no'), FOODDB.ready ? 'ok' : 'warn'],
    [t('dg_engine'), navigator.userAgent, '']
  ];
}

function renderDiagnostics(){
  const host = $('#diagPanel');
  if (!host) return;
  const rows = diagRows();
  const standalone = rows[0][2] === 'ok';
  host.innerHTML = rows.map(r =>
      r[0] === t('dg_engine')
        ? '<div style="margin-top:8px"><span class="k">'+esc(r[0])+'</span><div class="verbatim">'+esc(r[1])+'</div></div>'
        : '<div class="kv"><span class="k">'+esc(r[0])+'</span><span class="v">'+esc(r[1])+'</span></div>'
    ).join('') +
    (standalone ? '' : '<div class="notice warn" style="margin-top:10px">'+esc(t('dg_note_tab'))+'</div>');
}

async function copyDiagnostics(){
  const lines = ['NutriLog ' + VERSION + ' / schema ' + SCHEMA].concat(diagRows().map(r => r[0] + ': ' + r[1]));
  const txt = lines.join('\n');
  try {
    await navigator.clipboard.writeText(txt);
    toast(t('dg_copied'));
  } catch(e) {
    openSheet(esc(t('dg_h')), '<div class="verbatim" style="user-select:text">'+esc(txt)+'</div><p class="tiny" style="margin-top:10px">'+esc(t('dg_copyfail'))+'</p>');
  }
}

function renderBackupPanel(){
  const host = $('#backupPanel');
  if (!host) return;
  const b = S.meta.backup;
  const stale = backupHoursStale() > 48;
  host.innerHTML =
    '<div class="kv"><span class="k">'+esc(t('b_target'))+'</span><span class="v">'+esc(backupConfigured() ? backupTarget().describe() : t('b_target_none'))+'</span></div>' +
    '<div class="kv"><span class="k">'+esc(t('b_last'))+'</span><span class="v">'+
      (b.lastVerifiedAt ? esc(fmtDateTime(b.lastVerifiedAt)+' ('+ago(b.lastVerifiedAt)+')') : '<span class="pill '+(stale?'err':'wait')+'">'+esc(t('b_never'))+'</span>') +
    '</span></div>' +
    '<div class="kv"><span class="k">'+esc(t('b_next'))+'</span><span class="v"><span class="pill '+(b.state==='error'?'err':b.state==='idle'?'ok':'wait')+'">'+esc(t('b_state_'+b.state))+'</span></span></div>' +
    '<div class="kv"><span class="k">'+esc(t('d_size'))+'</span><span class="v num" id="szUsed">'+esc(t('loading'))+'</span></div>' +
    '<div class="kv"><span class="k">'+esc(t('d_persist'))+'</span><span class="v" id="szPersist">'+esc(t('d_unknown'))+'</span></div>' +
    (b.lastError ? '<div class="notice bad" style="margin-top:10px"><b>'+esc(t('b_last_error'))+'</b> '+esc(fmtDateTime(b.lastErrorAt))+'<div class="verbatim">'+esc(b.lastError)+'</div></div>' : '');
  fillStorageInfo();
}

async function fillStorageInfo(){
  const used = $('#szUsed'), per = $('#szPersist');
  if (!used) return;
  try {
    const est = await navigator.storage.estimate();
    used.textContent = (est.usage/1024 < 1024) ? fmtNum(est.usage/1024,1) + ' kB' : fmtNum(est.usage/1048576,2) + ' MB';
  } catch(e){ used.textContent = t('d_unknown'); }
  if (per){
    let ok = S.meta.persistGranted;
    try { if (navigator.storage && navigator.storage.persisted) ok = await navigator.storage.persisted(); } catch(e){}
    per.textContent = ok === null ? t('d_unknown') : (ok ? t('d_persist_yes') : t('d_persist_no'));
  }
}

async function fillSnapshots(){
  const host = $('#snapList');
  if (!host) return;
  const all = await dbAll('snapshots');
  all.sort((a,b) => a.date < b.date ? 1 : -1);
  if (!all.length){ host.innerHTML = '<p class="muted">'+esc(t('b_snapshot_none'))+'</p>'; return; }
  host.innerHTML = all.map(s =>
    '<div class="kv"><span class="k num">'+esc(s.date)+'</span>' +
    '<span class="v"><button class="btn quiet" type="button" style="min-height:36px;padding:6px 14px" data-act="snap-restore" data-date="'+esc(s.date)+'">'+esc(t('b_snapshot_restore'))+'</button></span></div>').join('');
}

function settingsRowOn(cat){

function settingsListHtml(){
  return SETTINGS_GROUPS.map(([head, cats]) => '<p class="eyebrow">'+esc(t(head))+'</p><div class="card" style="padding-top:6px;padding-bottom:6px">' +
