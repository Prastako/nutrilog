    alc: g('alcohol_100g') != null ? g('alcohol_100g')*0.789 : null
  };
  const name = p.product_name_cs || p.product_name || p.product_name_en || '';
  const portions = [];
  if (p.serving_quantity && Number(p.serving_quantity) > 0)
    portions.push({label: p.serving_size ? String(p.serving_size) : (S.lang === 'cs' ? '1 porce' : '1 serving'), g: Number(p.serving_quantity)});
  return {
    ref: 'off:' + p.code, kind: 'off', en: name, cs: null, brand: (p.brands || '').split(',')[0].trim(),
    barcode: p.code, per100: nutRound(per100), portions, cat: -2,
    ingredients: p.ingredients_text_cs || p.ingredients_text || '',
    allergens: (p.allergens_tags || []).map(a => a.replace(/^en:/,'')),
    image: p.image_front_small_url || '', nutriscore: p.nutriscore_grade || '', nova: p.nova_group || null
  };
}

async function offByBarcode(code){
  const url = 'https://world.openfoodfacts.org/api/v2/product/' + encodeURIComponent(code) + '.json?fields=' + OFF_FIELDS;
  const res = await fetch(url);
  if (res.status === 404) return null;
  if (!res.ok) throw new Error('Open Food Facts ' + res.status);
  const j = await res.json();
  if (!j || j.status === 0 || !j.product) return null;
  return offToFood(j.product);
}

async function offSearch(q){
  const url = 'https://world.openfoodfacts.org/cgi/search.pl?search_simple=1&action=process&json=1&page_size=25&lc=cs&search_terms=' +
    encodeURIComponent(q) + '&fields=' + OFF_FIELDS;
  const res = await fetch(url);
  if (!res.ok) throw new Error('Open Food Facts ' + res.status);
  const j = await res.json();
  return (j.products || []).filter(p => p.product_name || p.product_name_cs).map(offToFood)
    .filter(f => f.per100.kcal != null);
}

/* Keep a product you logged as your own food, so it works offline next time. */
async function saveOffAsCustom(food){
  const existing = (await recByType('food')).find(r => r.barcode && r.barcode === food.barcode);
  if (existing) return customFoodView(existing);
  const rec = await recPut({
    type: 'food', name: food.en, brand: food.brand, barcode: food.barcode,
    per100: food.per100, portions: food.portions, basis: 'label', source: 'openfoodfacts',
    ingredients: food.ingredients || '', allergens: food.allergens || []
  });
  return customFoodView(rec);
}

/* Nutrients for an amount of a food. */
function nutrientsFor(food, grams){
  return nutRound(nutScale(food.per100 || {}, grams / 100));
}

/* A foods-rich-in list for the review: which database foods give the most
   of a nutrient per 100 kcal, ignoring anything you excluded. */
async function foodsRichIn(k, limit){
  await loadFoodDb();
  const excl = exclusionTerms().length > 0;
  const scored = [];
  if (!foodsRichIn.common){
    /* everyday foods only: the head word must be one a Czech shopper would type */
    foodsRichIn.common = new Set(CS_EN.map(x => x[1]).filter(w => ['raw','cooked','boiled','roasted','fried','grilled','steamed','dried','frozen','canned','smoked','pickled','nonfat','lowfat','reduced','whole','powder','sauce','soup','broth','ice','sweet','hot','white','blue','french','toasted','sour','greek','ground','breast','thigh','wing','drumstick','shoulder','belly','ribs','chop','tenderloin','heart','kidney','tongue','snap','oyster'].indexOf(w) < 0));
  }
  const OBSCURE = /isolate|concentrate|spirulina|grouse|game meat|seaweed|dehydrated|freeze-dried|powder|flour|bran|germ|meal,|by-products|infant|formula|substitute|imitation|fortified|restaurant|fast food/;
  FOODDB.foods.forEach(f => {
    if ([6,14,19,22,23,4,7].indexOf(f.cat) >= 0) return;
    const head = f._head.split(' ')[0];
    if (!foodsRichIn.common.has(head) && !foodsRichIn.common.has(head.replace(/s$/,'')) && !foodsRichIn.common.has(head + 's')) return;
    if (OBSCURE.test(f.en.toLowerCase())) return;
    let v;
    if (k === 'o3ld') v = (f.per100.epa == null && f.per100.dha == null) ? null : ((f.per100.epa||0) + (f.per100.dha||0)) * 1000;
    else v = f.per100[k];
    const kc = f.per100.kcal;
    if (v == null || !kc || kc < 15) return;
    if (/\bdried\b|\bpowder\b|\bdehydrated\b|\bfreeze-dried\b|\bspices?\b/.test(f.en) && k !== 'fib') return;
    if (excl && exclusionHits(f.en + ' ' + (f.cs||'')).length) return;
    scored.push({food:f, perKcal: v / kc * 100, per100: v});
  });
  scored.sort((a,b) => b.perKcal - a.perKcal);
  /* one per head word, so the list is not ten kinds of liver */
  const seen = {}, out = [];
  for (const s of scored){
    const h = s.food._head;
    if (seen[h]) continue;
    seen[h] = 1; out.push(s);
    if (out.length >= (limit || 8)) break;
  }
  return out;
}

/* ---- recipeschema.js ---- */
// src/recipeschema.js

var ALLERGEN_KEYS = [
  'gluten', 'crustacean', 'egg', 'fish', 'peanut', 'soy', 'milk', 'treenut',
  'celery', 'mustard', 'sesame', 'sulphite', 'lupin', 'mollusc'
];

function upgradeRecipe(r) {
  var out = deepCopy(r) || {};
  out.schema = 2;
  if (!Array.isArray(out.ingredients)) out.ingredients = [];
  if (!Array.isArray(out.steps)) out.steps = [];
  if (!out.written) out.written = "omnivore";

  for (var i = 0; i < out.ingredients.length; i++) {
    var ing = out.ingredients[i];
    if (!ing.slot) ing.slot = "i" + i;
    if (!ing.role) ing.role = "other";
    if (!ing.scale) ing.scale = "linear";
  }

  for (var j = 0; j < out.steps.length; j++) {
    if (!out.steps[j].uses) out.steps[j].uses = [];
  }

  if (!out.storage) out.storage = {};
  if (out.storage.freezerMonths === undefined) out.storage.freezerMonths = null;
  if (out.storage.batchServings === undefined) out.storage.batchServings = null;
  if (out.storage.fresh === undefined) out.storage.fresh = [];

  if (!out.variants) out.variants = {};
  if (!out.flags) out.flags = {};

  return out;
}

function roundAmount(v) {
  if (Math.abs(v) < 10) return Math.round(v * 10) / 10;
  return Math.round(v);
}

function formatQty(v) {
  return String(roundAmount(v));
}

function applyOverrides(ingredients, steps, overrides) {
  var ings = deepCopy(ingredients);
  for (var o = 0; o < overrides.length; o++) {
    var ov = overrides[o];
    var idx = -1;
    for (var k = 0; k < ings.length; k++) {
      if (ings[k].slot === ov.slot) { idx = k; break; }
    }

    if (ov.op === "replace" && idx >= 0) {
      var ng = deepCopy(ings[idx]);
      ng.item = ov.item;
      ng.qty = ov.qty;
      ng.unit = ov.unit;
      ng.grams = ov.grams;
      ng.foodRef = ov.foodRef;
      ng.allergens = ov.allergens;
      ng.prep = ov.prep;
      ng.note = ov.note;
      ings[idx] = ng;
    } else if (ov.op === "remove" && idx >= 0) {
      ings.splice(idx, 1);
    } else if (ov.op === "add" && idx < 0) {
      ings.push({
        slot: ov.slot,
        role: ov.role || "other",
        scale: ov.scale || "linear",
        item: ov.item,
        qty: ov.qty,
        unit: ov.unit,
        grams: ov.grams,
        foodRef: ov.foodRef,
        allergens: ov.allergens,
        prep: ov.prep,
        note: ov.note
      });
      if (ov.per !== undefined) ings[ings.length - 1].per = ov.per;
    } else if (ov.op === "amount" && idx >= 0) {
      var c = deepCopy(ings[idx]);
      if (typeof ov.qty === 'number') c.qty = ov.qty;
      if (ov.unit !== undefined) c.unit = ov.unit;
      if (typeof ov.grams === 'number') c.grams = ov.grams;
      ings[idx] = c;
    }

    if (ov.steps) {
      for (var si in ov.steps) {
        if (steps[si]) steps[si].text = ov.steps[si];
      }
    }
  }
  return ings;
}

function ingredientName(ing) {
  if (ing.name) return ing.name;
  var item = ing.item;
  if (item.indexOf(', ') < 0) {
    return item.charAt(0).toUpperCase() + item.slice(1);
  }
  var segments = item.split(', ');
  var head = segments[0].toLowerCase();
  var DROP = ['beverages', 'spices', 'soup', 'herbs', 'seasoning', 'sweets', 'snacks',
    'baked products', 'cereals', 'vegetables', 'fruit', 'fruits', 'legumes', 'dairy',
    'restaurant', 'fast foods', 'meals', 'babyfood', 'infant formula'];
  var SUFFIX = ['sauce', 'oil', 'cheese', 'beans', 'nuts', 'seeds', 'peppers', 'mushrooms',
    'lentils', 'noodles', 'flour', 'vinegar', 'milk', 'yogurt', 'cream', 'butter', 'sugar',
    'rice', 'pasta', 'bread', 'crackers', 'juice', 'tea', 'coffee', 'stock', 'broth'];
  var MEAT = ['beef', 'pork', 'chicken', 'lamb', 'turkey', 'veal', 'duck', 'goose',
    'game meat', 'fish', 'salmon', 'tuna', 'cod', 'shrimp', 'crustaceans', 'mollusks'];

  var suffixIdx = SUFFIX.indexOf(head);
  var dropIdx = DROP.indexOf(head);
  var meatIdx = MEAT.indexOf(head);

  var cleanup = function(s) {
    var words = ['ready-to-serve', 'ready to serve', 'raw', 'dry', 'dried', 'canned',
      'fresh', 'frozen', 'cooked', 'ground', 'whole', 'drained'];
    var again = true;
    while (again) {
      again = false;
      for (var w = 0; w < words.length; w++) {
        var tail = ' ' + words[w];
        if (s.length > tail.length && s.slice(s.length - tail.length) === tail) {
          s = s.slice(0, s.length - tail.length);
          again = true;
        }
      }
    }
    return s;
  };

  var result;
  if (dropIdx >= 0) {
    result = segments[1] ? cleanup(segments[1]) : segments[0];
  } else if (suffixIdx >= 0) {
    result = cleanup(segments[1] || segments[0]) + ' ' + segments[0];
  } else if (meatIdx >= 0) {
    result = segments[0] + ', ' + cleanup(segments[1] || segments[0]);
  } else {
    result = cleanup(segments[0]);
  }
  return result.charAt(0).toUpperCase() + result.slice(1);
}

function resolveRecipe(recipe, opts) {
  opts = opts || {};
  var r = upgradeRecipe(recipe);
  var axis = opts.axis || r.written;
  var flags = opts.flags || [];
  var servings = opts.servings;
  var personal = opts.personal || [];
  var session = opts.session || [];
  var foods = opts.foods;

  var ingredients = deepCopy(r.ingredients);
  var steps = deepCopy(r.steps);

  // Variant overrides
  if (axis !== r.written && r.variants[axis]) {
    ingredients = applyOverrides(ingredients, steps, r.variants[axis]);
  }

  // Flag overrides in sorted order: gluten-free first, lactose-free second, rest alphabetical
  var sortedFlags = flags.filter(function(f) { return r.flags[f]; }).slice().sort(function(a, b) {
    if (a === 'gluten-free') return -1;
    if (b === 'gluten-free') return 1;
    if (a === 'lactose-free') return -1;
    if (b === 'lactose-free') return 1;
    return a < b ? -1 : a > b ? 1 : 0;
  });
  for (var fi = 0; fi < sortedFlags.length; fi++) {
    ingredients = applyOverrides(ingredients, steps, r.flags[sortedFlags[fi]]);
  }

  // Servings scaling
  var base = r.servings || 1;
  var srv = servings || base;
  var factor = srv / base;

  if (factor !== 1) {
    for (var i = 0; i < ingredients.length; i++) {
      var ing = ingredients[i];
      if (ing.scale === "linear") {
        ing.qty = roundAmount(ing.qty * factor);
        ing.grams = roundAmount(ing.grams * factor);
      } else if (ing.scale === "step") {
        var per = ing.per || 1;
        var oldQty = ing.qty;
        ing.qty = Math.ceil(srv / per);
        if (oldQty) ing.grams = roundAmount(ing.grams / oldQty * ing.qty);
      }
    }
  }

  // Personal overrides (after scaling, never scaled)
  if (personal.length) {
    ingredients = applyOverrides(ingredients, steps, personal);
  }

  // Session overrides (after personal, never scaled)
  if (session.length) {
    ingredients = applyOverrides(ingredients, steps, session);
  }

  // Render step text
  var ingMap = {};
  for (var m = 0; m < ingredients.length; m++) {
    ingMap[ingredients[m].slot] = ingredients[m];
  }

  var renderedSteps = [];
  for (var s = 0; s < steps.length; s++) {
    var step = deepCopy(steps[s]);
    step.text = step.text.replace(/\{([A-Za-z0-9_-]+)\}/g, function(_, slot) {
      var ig = ingMap[slot];
      if (!ig) return '';
      var nm = ingredientName(ig);
      if (ig.scale === 'fixed' || ig.role === 'season' || ig.qty == null || ig.qty === 0) {
        return nm;
      }
      return nm + ' (' + fmtQty(ig.qty) + ' ' + ig.unit + ')';
    });
    renderedSteps.push(step);
  }

  // Allergens
  var allergenSet = {};
  var hasUnknown = false;
  for (var a = 0; a < ingredients.length; a++) {
    var ing2 = ingredients[a];
    if (Array.isArray(ing2.allergens)) {
      for (var ak = 0; ak < ALLERGEN_KEYS.length; ak++) {
        if (ing2.allergens.indexOf(ALLERGEN_KEYS[ak]) >= 0) {
          allergenSet[ALLERGEN_KEYS[ak]] = true;
        }
      }
    } else {
      hasUnknown = true;
    }
  }
  var allergens = [];
  for (var ai = 0; ai < ALLERGEN_KEYS.length; ai++) {
    if (allergenSet[ALLERGEN_KEYS[ai]]) allergens.push(ALLERGEN_KEYS[ai]);
  }
  if (hasUnknown) allergens.push("unknown");

  // Nutrition
  var hasData = false;
  var total = {};
  var dataGrams = 0;
  var allGrams = 0;

  if (foods) {
    for (var n = 0; n < ingredients.length; n++) {
      var ig3 = ingredients[n];
      if (ig3.grams > 0) {
        allGrams += ig3.grams;
        var fd = foods[ig3.foodRef];
        if (fd && fd.per100) {
          hasData = true;
          dataGrams += ig3.grams;
          nutAdd(total, fd.per100, ig3.grams / 100);
        }
      }
    }
  }

  var nutrition;
  if (!hasData) {
    nutrition = {
      perServing: r.nutrition && r.nutrition.perServing ? r.nutrition.perServing : null,
      basis: "stored",
      coverage: 0,
      stated: r.nutrition && r.nutrition.stated ? r.nutrition.stated : null
    };
  } else {
    var coverage = allGrams > 0 ? Math.round(dataGrams / allGrams * 1000) / 1000 : 0;
    nutrition = {
      perServing: nutRound(nutScale(total, 1 / srv)),
      basis: coverage >= 1 ? "computed" : "estimated",
      coverage: coverage,
      stated: r.nutrition && r.nutrition.stated ? r.nutrition.stated : null
    };
  }

  return {
    ingredients: ingredients,
    steps: renderedSteps,
    allergens: allergens,
    nutrition: nutrition,
    servings: srv,
    adjusted: personal.length > 0 || session.length > 0
  };
}

/* ---- recipeavail.js ---- */
// recipeavail.js — recipe availability per profile, categories, and food lookup

/* ------------------------------------------------------------------ */
/* profileAxisFlags                                                     */
/* ------------------------------------------------------------------ */

var FULL_MEAL = { prot: 25, fib: 7, kcalMin: 400, kcalMax: 800 };

function profileAxisFlags(profile) {
  var F = profile && profile.food || {};

  // Axis
  var pat = F.pattern;
  if (pat === "pescatarian" || pat === "vegetarian" || pat === "vegan") {
    var axis = pat;
  } else {
    axis = "omnivore";
  }

  // Flags — use a set to deduplicate
  var seen = {};
  var flags = [];

  // --- gluten-free ---
  if (!seen["gluten-free"]) {
    var hasGluten = false;
    var conditions = F.conditions;
    var prefs = F.prefs;
    if (conditions && conditions.indexOf("coeliac") !== -1) hasGluten = true;
    if (prefs && prefs.indexOf("avoidgluten") !== -1) hasGluten = true;
    if (hasGluten) {
      flags.push("gluten-free");
      seen["gluten-free"] = true;
    }
  }

  // --- lactose-free ---
  if (!seen["lactose-free"]) {
    var hasLactose = false;
    var conditions2 = F.conditions;
    var prefs2 = F.prefs;
    if (conditions2 && conditions2.indexOf("lactose") !== -1) hasLactose = true;
    if (prefs2 && prefs2.indexOf("lactosefreeproducts") !== -1) hasLactose = true;
    if (hasLactose) {
      flags.push("lactose-free");
      seen["lactose-free"] = true;
    }
  }

  // --- no:<key> from exclusions ---
  var noFlags = [];
  var exclusions = F.exclusions;
  if (exclusions) {
    for (var i = 0; i < exclusions.length; i++) {
      var ex = exclusions[i];
      if (ex.type !== "allergy") continue;

      // Map id to allergen key
      var id = ex.id;
      if (id === "crustaceans") id = "crustacean";
      else if (id === "nuts") id = "treenut";
      else if (id === "sulphites") id = "sulphite";
      else if (id === "molluscs") id = "mollusc";
      // other ids unchanged

      // Check if mapped id is in ALLERGEN_KEYS
      if (ALLERGEN_KEYS && ALLERGEN_KEYS.indexOf(id) !== -1) {
        var flag = "no:" + id;
        if (!seen[flag]) {
          noFlags.push(flag);
          seen[flag] = true;
        }
      }
    }
  }

  // no:egg from patternOpts.noEggs
  var patternOpts = F.patternOpts;
  if (patternOpts && patternOpts.noEggs && !seen["no:egg"]) {
    noFlags.push("no:egg");
    seen["no:egg"] = true;
  }

  // no:milk from patternOpts.noMilk
  if (patternOpts && patternOpts.noMilk && !seen["no:milk"]) {
    noFlags.push("no:milk");
    seen["no:milk"] = true;
  }

  // Sort noFlags alphabetically and append
  noFlags.sort();
  for (var j = 0; j < noFlags.length; j++) {
    flags.push(noFlags[j]);
  }

  return { axis: axis, flags: flags };
}

/* ------------------------------------------------------------------ */
/* recipeAvailability                                                   */
/* ------------------------------------------------------------------ */

function recipeAvailability(recipe, profile, foods) {
  var af = profileAxisFlags(profile);
  var profileAxis = af.axis;
  var flags = af.flags;

  // Check axis support
  var upgraded = upgradeRecipe(recipe);
  var axisRank = { omnivore: 3, pescatarian: 2, vegetarian: 1, vegan: 0 };
  var profileRank = axisRank[profileAxis] != null ? axisRank[profileAxis] : 0;
  var candidates = [upgraded.written];
  if (upgraded.variants) {
    var vk = Object.keys(upgraded.variants);
    for (var vi = 0; vi < vk.length; vi++) {
      candidates.push(vk[vi]);
    }
  }
  var bestRank = -1;
  var axis = profileAxis;
  for (var ci = 0; ci < candidates.length; ci++) {
    var cRank = axisRank[candidates[ci]] != null ? axisRank[candidates[ci]] : -1;
    if (cRank >= 0 && cRank <= profileRank && cRank > bestRank) {
      bestRank = cRank;
      axis = candidates[ci];
    }
  }
  if (bestRank < 0) {
    return { axis: profileAxis, profileAxis: profileAxis, flags: flags, available: false, reason: "axis" };
  }

  // Resolve recipe
  var resolved = resolveRecipe(recipe, { axis: axis, flags: flags, foods: foods });
  var ingredients = resolved.ingredients;

  // Check each flag in order (rule 1 order)
  for (var i = 0; i < flags.length; i++) {
    var flag = flags[i];

    if (flag === "gluten-free") {
      for (var k = 0; k < ingredients.length; k++) {
        var alls = ingredients[k].allergens;
        if (alls && alls.indexOf("gluten") !== -1) {
          return { axis: axis, profileAxis: profileAxis, flags: flags, available: false, reason: "allergen:gluten" };
        }
      }
    } else if (flag === "lactose-free") {
      for (var l = 0; l < ingredients.length; l++) {
        var alls2 = ingredients[l].allergens;
        if (alls2 && alls2.indexOf("milk") !== -1) {
          var note = ingredients[l].note || "";
          if (note.toLowerCase().indexOf("lactose-free") === -1) {
            return { axis: axis, profileAxis: profileAxis, flags: flags, available: false, reason: "allergen:milk" };
          }
        }
      }
    } else if (flag.indexOf("no:") === 0) {
      var key = flag.substring(3);
      for (var m = 0; m < ingredients.length; m++) {
        var alls3 = ingredients[m].allergens;
        if (alls3 && alls3.indexOf(key) !== -1) {
          return { axis: axis, profileAxis: profileAxis, flags: flags, available: false, reason: "allergen:" + key };
        }
      }
    }
  }

  return { axis: axis, profileAxis: profileAxis, flags: flags, available: true, reason: null };
}

/* ------------------------------------------------------------------ */
/* recipeCategories                                                     */
/* ------------------------------------------------------------------ */

function recipeCategories(recipe) {
  var cats = [];
  var tags = recipe.tags || [];
  var storage = recipe.storage || {};
  var time = recipe.time || {};

  // meal-prep: tags has "prep:meal-prep" or storage.fridgeDays >= 3
  if (tags.indexOf("prep:meal-prep") !== -1 || (storage.fridgeDays !== undefined && storage.fridgeDays >= 3)) {
    cats.push("meal-prep");
  }

  // quick: time.totalMin present and <= 30
  if (time.totalMin !== undefined && time.totalMin <= 30) {
    cats.push("quick");
  }

  // breakfast
  if (tags.indexOf("meal:breakfast") !== -1) {
    cats.push("breakfast");
  }

  // snack
  if (tags.indexOf("meal:snack") !== -1) {
    cats.push("snack");
  }

  return cats;
}

/* ------------------------------------------------------------------ */
/* isFullMeal                                                           */
/* ------------------------------------------------------------------ */

function isFullMeal(perServing) {
  if (!perServing) return false;
  return (
    perServing.prot !== null &&
    perServing.prot !== undefined &&
    perServing.fib !== null &&
    perServing.fib !== undefined &&
    perServing.kcal !== null &&
    perServing.kcal !== undefined &&
    perServing.prot >= FULL_MEAL.prot &&
    perServing.fib >= FULL_MEAL.fib &&
    perServing.kcal >= FULL_MEAL.kcalMin &&
    perServing.kcal <= FULL_MEAL.kcalMax
  );
}

/* ------------------------------------------------------------------ */
/* recipeFoods                                                          */
/* ------------------------------------------------------------------ */

async function recipeFoods(recipe) {
  var upgraded = upgradeRecipe(recipe);
  var seen = {};
  var result = {};

  // Collect all foodRefs from ingredients
  var refs = [];
  var ingredients = upgraded.ingredients;
  for (var i = 0; i < ingredients.length; i++) {
    if (ingredients[i].foodRef) {
      refs.push(ingredients[i].foodRef);
    }
  }

  // Collect foodRefs from variants
  var variants = upgraded.variants;
  if (variants) {
    var axisKeys = Object.keys(variants);
    for (var v = 0; v < axisKeys.length; v++) {
      var list = variants[axisKeys[v]];
      if (list) {
        for (var u = 0; u < list.length; u++) {
          if (list[u].foodRef) {
            refs.push(list[u].foodRef);
          }
        }
      }
    }
  }

  // Collect foodRefs from flags
  var flagLists = upgraded.flags;
  if (flagLists) {
    var flagKeys = Object.keys(flagLists);
    for (var f = 0; f < flagKeys.length; f++) {
      var fList = flagLists[flagKeys[f]];
      if (fList) {
        for (var w = 0; w < fList.length; w++) {
          if (fList[w].foodRef) {
            refs.push(fList[w].foodRef);
          }
        }
      }
    }
  }

  // Look up each unique ref once
  for (var r = 0; r < refs.length; r++) {
    var ref = refs[r];
    if (seen[ref]) continue;
    seen[ref] = true;
    var food = await getFoodByRef(ref);
    if (food) {
      result[ref] = food;
    }
  }

  return result;
}

async function saveRecipeOverlay(recipeId, label, overrides) {
  var existing = (await recByType("recipe_overlay")).filter(function(r) { return r.recipeId === recipeId; });
  var rec = {
    type: "recipe_overlay",
    recipeId,
    label: label || "",
    overrides: overrides || [],
  };
  if (existing.length > 0) {
    rec.id = existing[0].id;
    rec.createdAt = existing[0].createdAt;
  }
  return recPut(rec);
}

function nextCookedSuggestion(records, today, recipes, foods) {
  var from = addDays(today, -5);
  var candidates = [];
  for (var i = 0; i < records.length; i++) {
    var r = records[i];
    if (r.type !== "cooking_session" || r.deleted || !r.finishedAt) continue;
    if (Number(r.loggedServings) >= Number(r.servings)) continue;
    var day = r.finishedAt.slice(0, 10);
    if (day >= from && day <= today) candidates.push(r);
  }
  if (candidates.length === 0) return null;
  candidates.sort(function(a, b) { return b.finishedAt.localeCompare(a.finishedAt); });
  var s = candidates[0];
  var perServing = null;
  if (recipes && recipes[s.recipeId]) {
    perServing = resolveRecipe(
      recipes[s.recipeId],
      { axis: s.axis, flags: s.flags, servings: s.servings, session: s.session, foods: foods }
    ).nutrition.perServing;
  }
  return { session: s, perServing: perServing };
}

async function logCookedServing(suggestion, recipe, slot, date) {
  var entry = {
    type: "food_entry",
    date: date || localDateKey(),
    time: localTime(),
    slot: slot || guessSlot(),
    name: recipe.title,
    source: { kind: "recipe", ref: "recipe:" + suggestion.session.recipeId },
    amount: { qty: 1, unit: "serving", grams: null, label: "1 " + t("rc_serv_short") },
    nutrients: nutRound(suggestion.perServing || {}),
    basis: "estimate",
  };
  var saved = await recPut(entry);
  suggestion.session.loggedServings = Number(suggestion.session.loggedServings) + 1;
  await recPut(suggestion.session);
  return saved;
}

/* ============================================================
   Claude. Every call goes through API.anthropic or claudeStream, so the
   endpoint can move to a server proxy later without touching anything
   else. The key lives only on this phone (IndexedDB "secrets").
   ============================================================ */

const API = {
  anthropicBase: 'https://api.anthropic.com',
  headers(){
    return {
      'x-api-key': S.secrets.anthropic,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
      'content-type': 'application/json'
    };
  },
  async anthropic(path, init){
    const headers = Object.assign(API.headers(), (init && init.headers) || {});
    const res = await fetch(API.anthropicBase + path, Object.assign({}, init || {}, {headers}));
    const txt = await res.text();
    let body = null;
    try { body = txt ? JSON.parse(txt) : null; } catch(e){ body = {raw: txt}; }
    if (body && body.usage) trackUsage(body.model, body.usage);
    else { S.meta.usage.calls++; saveMeta(); }
    if (!res.ok){
      const msg = (body && body.error && body.error.message) || (body && body.raw) || txt || '';
      throw new Error(res.status + ' ' + res.statusText + (msg ? ': ' + String(msg).slice(0,400) : ''));
    }
    return body;
  }
};

function priceFor(model){
  const p = S.prefs.prices[model];
  if (p) return {in: Number(p.in)||0, out: Number(p.out)||0};
  const m = String(model||'');
  if (m.indexOf('opus') >= 0) return {in:5, out:25};
  if (m.indexOf('haiku') >= 0) return {in:1, out:5};
  if (m.indexOf('fable') >= 0) return {in:10, out:50};
  return {in:2, out:10};
}

function monthKey(){ return localDateKey().slice(0,7); }

function trackUsage(model, usage){
  const u = S.meta.usage;
  const inn = (usage.input_tokens || 0), out = (usage.output_tokens || 0);
  const cw = usage.cache_creation_input_tokens || 0, cr = usage.cache_read_input_tokens || 0;
  const pr = priceFor(model);
  const cost = (inn/1e6)*pr.in + (cw/1e6)*pr.in*1.25 + (cr/1e6)*pr.in*0.1 + (out/1e6)*pr.out;
  u.calls++;
  u.inTok += inn + cw + cr;
  u.outTok += out;
  const mid = model || 'unknown';
  if (!u.byModel[mid]) u.byModel[mid] = {in:0, out:0};
  u.byModel[mid].in += inn + cw + cr;
  u.byModel[mid].out += out;
  if (!u.byMonth) u.byMonth = {};
  const mk = monthKey();
  if (!u.byMonth[mk]) u.byMonth[mk] = {calls:0, cost:0};
  u.byMonth[mk].calls++;
  u.byMonth[mk].cost += cost;
  saveMeta();
}

function monthCost(){
  const b = (S.meta.usage.byMonth || {})[monthKey()];
  return b ? b.cost : 0;
}

/* Streaming call. onText gets each piece of text as it arrives.
   Returns the finished message with content blocks, like the plain API. */
async function claudeStream(body, onText){
  const payload = Object.assign({}, body, {stream: true});
  const res = await fetch(API.anthropicBase + '/v1/messages', {method:'POST', headers: API.headers(), body: JSON.stringify(payload)});
  if (!res.ok){
    const txt = await res.text();
    let msg = txt;
    try { const j = JSON.parse(txt); msg = (j.error && j.error.message) || txt; } catch(e){}
    S.meta.usage.calls++; saveMeta();
    throw new Error(res.status + ' ' + res.statusText + ': ' + String(msg).slice(0,400));
  }
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  const msg = {content: [], usage: {}, stop_reason: null, model: body.model};
  const handle = (ev, data) => {
    if (ev === 'message_start'){ msg.model = data.message.model; msg.usage = Object.assign({}, data.message.usage || {}); }
    else if (ev === 'content_block_start'){
      const b = Object.assign({}, data.content_block);
      if (b.type === 'tool_use'){ b._json = ''; b.input = {}; }
      if (b.type === 'text') b.text = b.text || '';
      msg.content[data.index] = b;
    }
    else if (ev === 'content_block_delta'){
      const b = msg.content[data.index];
      if (!b) return;
      if (data.delta.type === 'text_delta'){ b.text += data.delta.text; if (onText) onText(data.delta.text); }
      else if (data.delta.type === 'input_json_delta'){ b._json += data.delta.partial_json; }
    }
    else if (ev === 'content_block_stop'){
      const b = msg.content[data.index];
      if (b && b.type === 'tool_use'){ try { b.input = b._json ? JSON.parse(b._json) : {}; } catch(e){ b.input = {}; } delete b._json; }
    }
    else if (ev === 'message_delta'){
      if (data.delta && data.delta.stop_reason) msg.stop_reason = data.delta.stop_reason;
      if (data.usage) Object.assign(msg.usage, data.usage);
    }
    else if (ev === 'error'){ throw new Error((data.error && data.error.message) || 'stream error'); }
  };
  for (;;){
    const {value, done} = await reader.read();
    if (done) break;
    buf += dec.decode(value, {stream:true});
    let cut;
    while ((cut = buf.indexOf('\n\n')) >= 0){
      const chunk = buf.slice(0, cut); buf = buf.slice(cut + 2);
      let ev = '', data = '';
      chunk.split('\n').forEach(line => {
        if (line.startsWith('event:')) ev = line.slice(6).trim();
        else if (line.startsWith('data:')) data += line.slice(5).trim();
      });
      if (!data) continue;
      let parsed; try { parsed = JSON.parse(data); } catch(e){ continue; }
      handle(ev || parsed.type, parsed);
    }
  }
  msg.content = msg.content.filter(Boolean);
  trackUsage(msg.model, msg.usage);
  return msg;
}

/* ---------- Image helper ---------- */

function fileToDownscaledJpeg(file, maxSide, quality){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, (maxSide || 1568) / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', quality || 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('image')); };
    img.src = url;
  });
}

const sheetCleanups = [];

function openSheet(titleHtml, bodyHtml, footHtml, opts){
  runSheetCleanups();
  const root = $('#sheetRoot');
  root.innerHTML =
    '<div class="sheetbg" role="dialog" aria-modal="true">' +
      '<div class="sheet'+(opts && opts.tall ? ' tall' : '')+(opts && opts.full ? ' full' : '')+'">' +
        '<div class="sheethead"><h2>'+titleHtml+'</h2>' +
        '<button class="iconbtn" type="button" data-sheet-close="1" aria-label="'+esc(t('close'))+'">'+icon('close')+'</button></div>' +
        '<div class="sheetbody">' + bodyHtml + '</div>' +
        (footHtml ? '<div class="btnrow sheetfoot">'+footHtml+'</div>' : '') +
      '</div>' +
    '</div>';
  root.querySelector('.sheetbg').addEventListener('click', e => {
    if (e.target.classList.contains('sheetbg')) closeSheet();
  });
  root.querySelectorAll('[data-sheet-close]').forEach(b => b.addEventListener('click', closeSheet));
  if (!S.sheetOpen){ try { history.pushState({screen: S.screen, sheet: true}, '', location.hash); } catch(e){} }
  S.sheetOpen = true;
  return root.querySelector('.sheet');
}
function runSheetCleanups(){
  while (sheetCleanups.length){ try { sheetCleanups.pop()(); } catch(e){} }
}
/* Closing a sheet steps back over the history entry the sheet added, so
   the Android back gesture closes sheets first. The screen underneath is
   redrawn afterwards to show whatever the sheet changed. */
function sheetCloseMs(){
  if (document.body.classList.contains('quickmode')) return 0;
  const v = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--t-base'));
  return isFinite(v) ? v : 260;
}
function closeSheet(fromPop){
  const bg = $('#sheetRoot').querySelector('.sheetbg');
  if (bg && bg.classList.contains('closing')) return;
  runSheetCleanups();
  const wasOpen = S.sheetOpen;
  S.sheetOpen = false;
  if (wasOpen && !fromPop){
    try { if (history.state && history.state.sheet){ S.swallowPop = true; history.back(); } } catch(e){}
  }
  const f = S.afterSheet; S.afterSheet = null;
  const finish = () => {
    if (bg && bg.parentNode) bg.remove();
    else if (!bg) $('#sheetRoot').innerHTML = '';
    if (f) f();
    else if (fromPop || !S.swallowPop) refreshScreenSoon();
  };
  const ms = sheetCloseMs();
  if (!bg || ms <= 0) finish();
  else { bg.classList.add('closing'); setTimeout(finish, ms); }
}
function refreshScreenSoon(){
  clearTimeout(refreshScreenSoon._t);
  refreshScreenSoon._t = setTimeout(() => { if (S.sheetOpen) return; if ($('#sheetRoot').querySelector('.sheetbg.closing')) { refreshScreenSoon(); return; } renderScreen(S.screen); }, 30);
}

function confirmSheet(title, bodyHtml, confirmLabel, danger){
  return new Promise(resolve => {
    let done = false;
    const sheet = openSheet(esc(title), bodyHtml,
      '<button class="btn quiet" type="button" data-c="0">'+esc(t('cancel'))+'</button>' +
      '<button class="btn '+(danger?'danger':'')+'" type="button" data-c="1">'+esc(confirmLabel)+'</button>');
    sheetCleanups.push(() => { if (!done){ done = true; resolve(false); } });
    sheet.querySelector('[data-c="0"]').addEventListener('click', () => { done = true; closeSheet(); resolve(false); });
    sheet.querySelector('[data-c="1"]').addEventListener('click', () => { done = true; closeSheet(); resolve(true); });
  });
}

function guessSlot(d){
  const x = d || new Date();
  const m = x.getHours()*60 + x.getMinutes();
  if (m < 10*60+30) return 'breakfast';
  if (m < 14*60+30) return 'lunch';
  if (m < 17*60+30) return 'snack';
  return 'dinner';
}

function slotChips(sel){

function macroLine(n){
  if (!n) return '';
  return t('mac_p') + ' ' + fmtNum(n.prot) + ' · ' + t('mac_f') + ' ' + fmtNum(n.fat) + ' · ' + t('mac_c') + ' ' + fmtNum(n.carb) + ' g';
}

/* A compact table of all known nutrients, grouped. */
function nutrientTable(n, opts){
  n = n || {};
  opts = opts || {};
  const row = x => {
    let v = n[x.k], unit = x.unit;
    if ((x.k === 'epa' || x.k === 'dha' || x.k === 'ala') && v < 1){ v = v * 1000; unit = 'mg'; }
    return '<div class="kv"><span class="k">'+esc(L(x))+'</span><span class="v num">'+esc(fmtAmt(v))+' '+esc(unit)+'</span></div>';
  };
  const known = NUTRIENTS.filter(x => x.grp !== 'hidden' && n[x.k] != null && isFinite(n[x.k]));
  if (!known.length) return '<div class="ntable"><p class="tiny">'+esc(t('nt_none'))+'</p></div>';
  const main = ['kcal','prot','fat','carb','fib','sug','sfa','na'];
  let h = '<div class="ntable">' + known.filter(x => main.indexOf(x.k) >= 0).map(row).join('');
  const rest = known.filter(x => main.indexOf(x.k) < 0);
  if (rest.length) h += (opts.compact ? '<details><summary class="linkbtn">'+esc(t('nt_more', {n: rest.length}))+'</summary>' : '') +
    rest.map(row).join('') + (opts.compact ? '</details>' : '');
  return h + '</div>';
}

function fitBadge(score){
  const s = Math.round(Number(score) || 0);
  const cls = s >= 4 ? 'ok' : s === 3 ? 'wait' : 'err';
  return '<span class="fit '+cls+'">'+s+'/5</span>';
}

const METER_LAST = {};
let meterSeq = 0;
let meterObs = null;

function growMeters(root){
  for (const el of (root || document).querySelectorAll('.rfill[data-w], .rend[data-w]')){
    void el.offsetWidth;
    const w = el.getAttribute('data-w') + '%';
    if (el.classList.contains('rend')) el.style.left = w;
    else el.style.width = w;
    el.removeAttribute('data-w');
  }
}

function ensureMeterObserver(){
  if (meterObs || typeof MutationObserver === 'undefined' || !document.body) return;
  meterObs = new MutationObserver(() => growMeters(document));
  meterObs.observe(document.body, {childList: true, subtree: true});
}

/* Horizontal bar with a target range drawn in. */
function rangeBar(value, low, high, kind){
  ensureMeterObserver();
  const max = Math.max(high || low || 1, value || 0) * 1.15 || 1;
  const pct = v => clamp((v / max) * 100, 0, 100);
  let cls = 'ok';
  /* progress through a day: neutral until it passes the top of the range */
  if (kind === 'progress'){ cls = high != null && value > high*1.1 ? 'bad' : high != null && value > high ? 'warn' : 'ok'; }
  else if (kind === 'max'){ cls = value > (low||0) ? 'bad' : value > (low||0)*0.9 ? 'warn' : 'ok'; }
  else if (low != null){ cls = value < low*0.5 ? 'bad' : value < low ? 'warn' : (high != null && value > high*1.1 ? 'warn' : 'ok'); }
  const key = S.screen + ':' + (meterSeq++);
  const target = pct(value||0);
  const from = (key in METER_LAST) ? METER_LAST[key] : 0;
  METER_LAST[key] = target;
  return '<div class="rbar"><div class="rzone" style="left:'+pct(low||0)+'%;width:'+Math.max(1, pct(high||low||0) - pct(low||0))+'%"></div>' +
    '<div class="rfill '+cls+'" style="width:'+from+'%" data-w="'+target+'"></div><span class="rend" style="left:'+from+'%" data-w="'+target+'"></span></div>';
}

/* ============================================================
   Recipes: archive, starter recipes, Claude recipes, your own.
   A recipe record has the same envelope as the workout exercise
   archive (id, type, sources, tags, extraction), so the two archives
   can later live side by side and be read by one platform.
   ============================================================ */

const RECIPES = { list: [], byId: {}, loaded: false, notes: {} };

async function loadRecipes(){
  const all = await dbAll('recipes');
  RECIPES.list = all.filter(r => !r.deleted);
  RECIPES.byId = {};
  RECIPES.list.forEach(r => { RECIPES.byId[r.id] = r; r._search = fold([r.title, r.titleEn, r.titleCs, (r.ingredients||[]).map(i => i.item).join(' '), (r.tags||[]).join(' ')].join(' ')); });
  const notes = await recByType('recipe_note');
  RECIPES.notes = {};
  notes.forEach(n => { RECIPES.notes[n.recipeId] = n; });
  RECIPES.loaded = true;
}

function visibleRecipes(){
  return RECIPES.list.filter(r => r.origin !== 'starter' || S.prefs.archive.showStarter);
}

function recipeNote(id){ return RECIPES.notes[id] || null; }

async function saveRecipeNote(id, patch){
  let n = RECIPES.notes[id];
  if (!n) n = {id: 'rn-' + id, type: 'recipe_note', recipeId: id, favorite: false, rating: null, notes: '', cookedDates: []};
  Object.assign(n, patch);
  await recPut(n);
  RECIPES.notes[id] = n;
  return n;
}

/* Normalise a recipe from Claude (tool output) into a record. */
function recipeFromAi(r, origin){
  const id = 'rcp-' + ulid();
  const tags = (r.tags || []).map(x => String(x).toLowerCase().trim()).filter(Boolean);
  return {
    id, type: 'recipe', schema: 1, origin: origin || 'claude', lang: RECIPE_LANG,
    title: r.title || r.titleEn || '?', titleEn: r.title || r.titleEn || '', titleCs: r.titleCs || '', summary: r.summary || '',
    servings: Number(r.servings) || 1,
    time: {prepMin: (r.time||{}).prepMin || null, cookMin: (r.time||{}).cookMin || null, totalMin: (r.time||{}).totalMin || null},
    difficulty: r.difficulty || null,
    ingredients: (r.ingredients || []).map(i => ({group: i.group || null, item: i.item, qty: i.qty == null ? null : Number(i.qty), unit: i.unit || null,
      grams: i.grams == null ? null : Number(i.grams), prep: i.prep || null, optional: !!i.optional})),
    steps: (r.steps || []).map(s => ({text: s.text, minutes: s.minutes == null ? null : Number(s.minutes), timerSec: s.timerSec == null ? null : Number(s.timerSec)})),
    tips: (r.tips || []).map(x => typeof x === 'string' ? {text: x} : x),
    variations: (r.variations || []).map(v => ({label: v.label, text: v.text})),
    storage: r.storage || null,
    nutrition: {perServing: nutRound(r.nutritionPerServing || {}), basis: 'estimated', confidence: 'medium'},
    tags,
    sources: [{platform: 'claude', model: S.prefs.models.chat, createdAt: nowIso()}],
    extraction: null,
    thumb: null,
    createdAt: nowIso(), updatedAt: nowIso()
  };
}

async function saveRecipe(rec){
  rec.updatedAt = nowIso();
  await dbPut('recipes', rec);
  if (rec.origin === 'claude' || rec.origin === 'own') markDirty('recipe saved');
  await loadRecipes();
  return rec;
}

/* Starter recipes ship with the app so suggestions work before the
   archive exists. They are marked and can be hidden in settings. */
async function ensureStarterRecipes(){
  const have = await kvGet('starterVersion', null);
  if (have === VERSION) return;
  try {
    const res = await fetch('data/recipes-starter.json?v=' + encodeURIComponent(VERSION));

    const j = await res.json();
    const recs = (j.recipes || []).map(r => Object.assign({}, r, {origin: 'starter'}));
    await dbPutMany('recipes', recs);

  } catch(e){ /* offline on first run: try next time */ }

/* ---------- Archive sync ----------
   The archive index lives in your private GitHub data repository at
   <path>/index.json (the same repository as the backup). The overnight
   extraction writes it there and to Google Drive. */

async function ghRaw(path){
  const r = parseRepo();
  if (!r || !S.secrets.github) throw new Error(t('arch_need_repo'));
  const q = '?ref=' + encodeURIComponent(S.prefs.backup.branch || 'main');
  const res = await fetch(GITHUB_API + '/repos/'+r.owner+'/'+r.repo+'/contents/'+path+q, {
    headers: {'Authorization':'Bearer ' + S.secrets.github, 'Accept':'application/vnd.github.raw+json', 'X-GitHub-Api-Version':'2022-11-28'}
  });
  if (res.status === 404) return null;
  if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
  return res;
}

async function importRecipeIndex(j, label){
  if (!j || !Array.isArray(j.recipes)) throw new Error(t('arch_bad_file'));
  const incoming = j.recipes.filter(r => r && r.id && r.title);
  const ids = {};
  incoming.forEach(r => { ids[r.id] = 1; r.origin = r.origin && r.origin !== 'starter' ? r.origin : 'archive'; if (!r.type) r.type = 'recipe'; });
  /* archive records that disappeared from the index are removed; your own
     and Claude recipes are never touched by a sync */
  const current = await dbAll('recipes');
  const gone = current.filter(r => r.origin === 'archive' && !ids[r.id]).map(r => r.id);
  for (const id of gone) await dbDel('recipes', id);
  await dbPutMany('recipes', incoming);
  S.meta.archive.lastSyncAt = nowIso();
  S.meta.archive.count = incoming.length;
  S.meta.archive.lastError = null;
  S.meta.archive.source = label;
  await saveMeta();
  await loadRecipes();
  return {count: incoming.length, removed: gone.length};
}

async function syncArchive(opts){
  opts = opts || {};
  try {
    const path = (S.prefs.archive.path || 'archive/recipes').replace(/\/+$/,'');
    const res = await ghRaw(path + '/index.json');
    if (!res){ if (!opts.quiet) toast(t('arch_none_yet'), 5000); return null; }
    const txt = await res.text();
    const h = hashString(txt);
    if (h === S.meta.archive.lastSha && !opts.force){
      S.meta.archive.lastSyncAt = nowIso(); await saveMeta();
      if (!opts.quiet) toast(t('arch_same'));
      return {same: true};
    }
    const out = await importRecipeIndex(JSON.parse(txt), 'github');
    S.meta.archive.lastSha = h; await saveMeta();
    if (!opts.quiet) toast(t('arch_synced', {n: out.count}));
    return out;
  } catch(err){
    S.meta.archive.lastError = String(err.message || err);
    await saveMeta();
    if (!opts.quiet) toast(t('err_prefix') + ': ' + S.meta.archive.lastError, 6000);
    return null;
  }
}

/* Thumbnails: fetched once from the data repository, kept in the media store. */
const thumbUrls = {};
async function recipeThumbUrl(rec){
  if (!rec || !rec.thumb) return null;
  if (rec.thumb.startsWith('data:')) return rec.thumb;
  if (thumbUrls[rec.id]) return thumbUrls[rec.id];
  const key = 'thumb:' + rec.id;
  let m = await dbGet('media', key);
  if (!m && rec.origin === 'archive' && S.secrets.github && parseRepo()){
    try {
      const path = (S.prefs.archive.path || 'archive/recipes').replace(/\/+$/,'') + '/' + rec.thumb;
      const res = await ghRaw(path);
      if (res){ const blob = await res.blob(); m = {id: key, blob, at: nowIso()}; await dbPut('media', m); }
    } catch(e){ return null; }
  }
  if (!m && rec.thumb.startsWith('data:')) return rec.thumb;
  if (!m) return null;
  thumbUrls[rec.id] = URL.createObjectURL(m.blob);
  return thumbUrls[rec.id];
}

function fillThumbs(root){
  $$('[data-thumb]', root).forEach(async el => {
    const rec = RECIPES.byId[el.getAttribute('data-thumb')];
    const url = await recipeThumbUrl(rec);
    if (url){ el.style.backgroundImage = 'url("'+url+'")'; el.classList.add('has'); }
  });
}

/* ---------- Helpers ---------- */

function recipeKcal(r){ return r && r.nutrition && r.nutrition.perServing ? r.nutrition.perServing.kcal : null; }
function recipeTime(r){ return r && r.time ? (r.time.totalMin || ((r.time.prepMin||0) + (r.time.cookMin||0)) || null) : null; }
function recipeText(r){ return [r.title, r.titleEn, (r.ingredients||[]).map(i => i.item + ' ' + (i.prep||'')).join(' ')].join(' '); }

function tagCanon(tag){ return tag === 'diet:high-fiber' ? 'diet:high-fibre' : tag; }
function recipeAuthor(r){ return r && r.author && r.author.name ? String(r.author.name) : ''; }
function tagLabel(tag){
  if (String(tag).indexOf('by:') === 0) return String(tag).slice(3);
  const [ns, val] = String(tag).split(':');
  const key = 'tag_' + ns + '_' + (val||'').replace(/[^a-z0-9]+/g,'_');
  const tr = t(key);
  if (tr !== key) return tr;
  const s = (val || ns).replace(/-/g,' ');
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function tagNs(tag){ return String(tag).split(':')[0]; }

const ORIGIN_LABEL = {archive:'orig_archive', starter:'orig_starter', claude:'orig_claude', own:'orig_own'};

/* ---------- Recipe view resolution ---------- */

function recipeView(r, opts){
  opts = opts || {};
  var schema2 = r.schema === 2;
  var af = profileAxisFlags(S.profile);
  var avail = recipeAvailability(r, S.profile);
  var axisNone = !!(r.written && avail.reason === 'axis');

  var versions;
  if (schema2){
    var allowed = ['omnivore', 'pescatarian', 'vegetarian', 'vegan'];
    var base = r.written || 'omnivore';
    var variantKeys = r.variants ? Object.keys(r.variants) : [];
    var raw = [base].concat(variantKeys);
    var uniqueSet = {};
    for (var _i = 0; _i < raw.length; _i++){ uniqueSet[raw[_i]] = true; }
    versions = [];
    for (var vi = 0; vi < allowed.length; vi++){
      if (uniqueSet[allowed[vi]]){ versions.push(allowed[vi]); }
    }
    for (var wi = 0; wi < raw.length; wi++){
      if (allowed.indexOf(raw[wi]) < 0 && uniqueSet[raw[wi]]){
        versions.push(raw[wi]);
        uniqueSet[raw[wi]] = false;
      }
    }
  } else {
    versions = [r.written || 'omnivore'];
  }

  var axis;
  if (opts.axis && versions.indexOf(opts.axis) >= 0){
    axis = opts.axis;
  } else if (avail.reason === 'axis'){
    axis = r.written || 'omnivore';
  } else {
    axis = avail.axis;
  }

  var servings = opts.servings || Number(r.servings) || 1;

  var ingredients, steps, flagsApplied;
  if (schema2){
    var res = resolveRecipe(r, {axis: axis, flags: af.flags, servings: servings});
    ingredients = res.ingredients.map(function(ing){
      var copy = Object.assign({}, ing);
      copy.name = ingredientName(ing);
      return copy;
    });
    steps = res.steps;
    flagsApplied = af.flags.filter(function(f){ return r.flags && r.flags[f]; });
  } else {
    var factor = servings / (Number(r.servings) || 1);
    ingredients = (r.ingredients || []).map(function(ing){
      var copy = Object.assign({}, ing);
      copy.name = ing.item;
      if (ing.qty != null){ copy.qty = ing.qty * factor; }
      return copy;
    });
    steps = (r.steps || []).map(function(s){ return Object.assign({}, s); });
    flagsApplied = [];
  }

  return {
    schema2: schema2,
    axis: axis,
    versions: versions,
    flagsApplied: flagsApplied,
    axisNone: axisNone,
    servings: servings,
    ingredients: ingredients,
    steps: steps
  };
}

function recipeExclusions(r, view){
  view = view || recipeView(r);
  if (!view.schema2){
    return exclusionHits(recipeText(r));
  }
  var af = profileAxisFlags(S.profile);
  var keys = [];
  for (var i = 0; i < af.flags.length; i++){
    var f = af.flags[i];
    if (f === 'gluten-free'){ keys.push('gluten'); }
    else if (f === 'lactose-free'){ keys.push('milk'); }
    else if (f.indexOf('no:') === 0){ keys.push(f.slice(3)); }
  }
  var hits = [];
  var labelSet = {};
  for (var j = 0; j < view.ingredients.length; j++){
    var ing = view.ingredients[j];
    if (Array.isArray(ing.allergens)){
      for (var k = 0; k < keys.length; k++){
        if (ing.allergens.indexOf(keys[k]) >= 0){
          if (!labelSet[ing.name]){
            labelSet[ing.name] = true;
            hits.push({label: ing.name, type: 'allergen', word: keys[k]});
          }
        }
      }
    }
  }
  var noAllergens = view.ingredients.filter(function(ing){ return !Array.isArray(ing.allergens); });
  if (noAllergens.length > 0){
    var text = noAllergens.map(function(ing){ return ing.name; }).join(' ');
    var raw = exclusionHits(text);
    for (var r = 0; r < raw.length; r++){
      if (raw[r].type !== 'pattern' && !labelSet[raw[r].label]){
        labelSet[raw[r].label] = true;
        hits.push(raw[r]);
      }
    }
  }
  return hits;
}

function ingAmount(ing, schema2){
  if (schema2 && (ing.scale === 'fixed' || ing.qty === 0 || ing.qty == null)){
    return t('rc_to_taste');

  return [fmtQty(ing.qty), ing.unit || ''].join(' ').trim();
}

/* Recipes are in English; a Czech search word also matches its English
   equivalents (kuře finds chicken). */
function recipeTextMatch(r, q){
  return fold(q).split(/[^a-z0-9]+/).filter(Boolean).every(w => expandToken(w).some(a => r._search.indexOf(a) >= 0));
}

function recipeMatchesFilter(r){
  const F = S.recipeFilter;
  if (F.q && !recipeTextMatch(r, F.q)) return false;
  for (const c of F.chips){
    if (c === 'fav'){ const n = recipeNote(r.id); if (!n || !n.favorite) return false; }
    else if (c === 'noexcl'){ if (recipeExclusions(r).length) return false; }
    else if (c === 'time:under-30'){ const tm = recipeTime(r); if (!(tm && tm <= 30)) return false; }
    else if ((r.tags||[]).map(tagCanon).indexOf(tagCanon(c)) < 0) return false;
  }
  for (const tg of F.tags){
    if (String(tg).indexOf('by:') === 0){ if (recipeAuthor(r) !== String(tg).slice(3)) return false; continue; }
    if ((r.tags||[]).map(tagCanon).indexOf(tagCanon(tg)) < 0) return false;
  }
  if (F.origin !== 'all' && r.origin !== F.origin) return false;
  return true;
}

/* ---------- Suggestions ---------- */

function seededRand(seed){
  let x = 0; for (let i = 0; i < seed.length; i++) x = (x * 31 + seed.charCodeAt(i)) >>> 0;
  return () => { x = (x * 1664525 + 1013904223) >>> 0; return x / 4294967296; };
}

async function suggestFor(slot, dateKey, n){
  const g = computeTargets(S.profile);
  const shares = slotShares();
  const d = await dayTotals(dateKey);
  const slotEaten = (d.bySlot[slot] && d.bySlot[slot].kcal) || 0;
  const slotTarget = g ? g.mid * shares[slot] : null;
  /* a meal that is mostly logged already gets ideas for next time at full size */
  const done = slotTarget != null && slotEaten >= slotTarget * 0.7;
  const target = g ? (done ? slotTarget : Math.max(150, slotTarget - slotEaten)) : null;
  const K = (S.profile && S.profile.kitchen) || {};
  const day = dateFromKey(dateKey).getDay();
  const limit = TIME_MAX_MIN[(day === 0 || day === 6) ? (K.timeWeekend||3) : (K.timeWeekday||2)];
  const eq = (K.equipment||[]).filter(x => x !== 'none');
  const likes = ((S.profile && S.profile.food && S.profile.food.cuisines) || []).map(id => {
    const c = CUISINES.find(x => x.id === id); return c ? c.en.toLowerCase().replace(/\s+/g,'-') : id; });
  const pantry = (await recByType('pantry_item')).filter(p => p.have).map(p => fold(p.name));
  const focus = (S.profile && S.profile.goals && S.profile.goals.focusNutrients) || [];
  const rnd = seededRand(dateKey + slot);
  const recent = {};
  Object.values(RECIPES.notes).forEach(nt => { const last = (nt.cookedDates||[]).slice(-1)[0]; if (last) recent[nt.recipeId] = last; });
  const out = [];
  visibleRecipes().forEach(r => {
    const rv = recipeView(r);
    if (rv.axisNone || recipeExclusions(r, rv).length) return;
    const tags = r.tags || [];
    const mealTags = tags.filter(x => tagNs(x) === 'meal');
    if (mealTags.length && mealTags.indexOf('meal:' + slot) < 0) return;
    const kc = recipeKcal(r);
    const reasons = [];
    let s = 0, serv = 1;
    if (kc && target){
      serv = clamp(Math.round(target / kc * 2) / 2, 0.5, 2);
      const diff = Math.abs(kc * serv - target) / target;
      s += 3 * (1 - Math.min(diff, 1));
      if (diff < 0.15) reasons.push(t('sg_r_fits'));
    }
    const ps = (r.nutrition||{}).perServing || {};
    if (kc && ps.prot){ const pd = ps.prot*4/kc; s += pd * 4; if (pd >= 0.25) reasons.push(t('sg_r_protein')); }
    const tm = recipeTime(r);
    if (tm && tm > limit){ s -= 2; } else if (tm) { s += 0.3; }
    const needEq = tags.filter(x => tagNs(x) === 'equip').map(x => x.split(':')[1]);
    if (eq.length && needEq.some(e => ['oven','airfryer','blender','pressure','micro'].indexOf(e) >= 0 && eq.indexOf(e) < 0)) s -= 3;
    if (tags.some(x => tagNs(x) === 'cuisine' && likes.indexOf(x.split(':')[1]) >= 0)) { s += 0.6; }
    if (pantry.length){
      const ings = (r.ingredients||[]).filter(i => !i.optional);
      const hit = ings.filter(i => pantry.some(p => p.length >= 3 && fold(i.item).indexOf(p) >= 0)).length;
      const frac = ings.length ? hit / ings.length : 0;
      s += frac * 2;
      if (frac >= 0.6) reasons.push(t('sg_r_pantry'));
    }
    focus.forEach(k => { const v = k === 'o3ld' ? ((ps.epa||0)+(ps.dha||0))*1000 : ps[k]; if (v && kc){ s += 0.4; } });
    if (tags.indexOf('prep:meal-prep') >= 0) s += 0.3;
    const note = recipeNote(r.id);
    if (note && note.favorite){ s += 0.8; reasons.push(t('sg_r_fav')); }
    if (recent[r.id] && recent[r.id] >= addDays(dateKey, -3)) s -= 2.5;
    if (r.origin === 'starter') s -= 0.4;
    s += rnd() * 1.2;
    out.push({r, s, serv, kcal: kc ? kc * serv : null, reasons});
  });
  out.sort((a,b) => b.s - a.s);
  return {target, done, eaten: slotEaten, items: out.slice(0, n || 3)};
}

function parseIngredientLine(line){
  const m = line.match(/^([\d.,/½¼¾]+)?\s*(g|kg|ml|l|dl|ks|lžíce|lžička|lzice|lzicka|tbsp|tsp|cup|hrnek|stroužek|pcs|pinch|špetka)?\.?\s+(.*)$/i);
  if (!m) return {item: line};
  let q = m[1] ? m[1].replace(',', '.').replace('½','.5').replace('¼','.25').replace('¾','.75') : null;
  if (q && q.indexOf('/') > 0){ const [a,b2] = q.split('/'); q = Number(a)/Number(b2); }
  return {qty: q != null ? Number(q) : null, unit: m[2] || null, item: m[3] || line};
}

  }).join('\n');
}

const ADD = { slot:null, date:null, mode:'search', food:null, grams:100 };

function openAddSheet(slot, date){
  ADD.slot = slot || guessSlot();
  ADD.date = date || S.logDate || localDateKey();
  ADD.food = null;
  const modes = ['search','scan','photo','describe','recipe','manual'].filter(m => moduleOn('assistant') || (m !== 'photo' && m !== 'describe'));
  const b = (quickOn() ? '' : '<div class="seg small" id="addModes">' + modes.map(m =>
      '<button type="button" data-mode="'+m+'" class="'+(m==='search'?'on':'')+'">'+esc(t('am_'+m))+'</button>').join('') + '</div>') +
    '<div id="addBody"></div>';
  const sheet = openSheet(esc(t('add_title', {slot: t('slot_'+ADD.slot).toLowerCase()})), b, null, {tall:true});
  if (!quickOn()) $('#addModes').addEventListener('click', e => {
    const bt = e.target.closest('[data-mode]');
    if (!bt) return;
    if (bt.getAttribute('data-mode') === 'photo'){ closeSheet(); openPhotoSheet({slot: ADD.slot, date: ADD.date}); return; }
    $$('#addModes button').forEach(x => x.classList.toggle('on', x === bt));
    runSheetCleanups();
    addMode(bt.getAttribute('data-mode'));
  });
  addMode('search');
  return sheet;
}

function addMode(mode){
  ADD.mode = mode;
  const body = $('#addBody');
  if (mode === 'search') addSearchUI(body);
  else if (mode === 'scan') addScanUI(body);
  else if (mode === 'describe') addDescribeUI(body);
  else if (mode === 'recipe') addRecipeUI(body);
  else if (mode === 'manual') addManualUI(body);
}

/* Amount and slot for one food, then save. */
function amountStep(food, grams){
  ADD.food = food;
  const body = $('#addBody') || openAddSheet(ADD.slot, ADD.date) && $('#addBody');
  const portions = (food.portions || []).slice(0, 5);
  let g = grams || (portions[0] && portions[0].g) || 100;
  const ex = exclusionHits(food.en + ' ' + (food.cs||'') + ' ' + (food.ingredients||''));
  let h = '<div class="card flat" style="margin-top:12px"><h3>'+esc(foodName(food))+'</h3>' +
    '<p class="tiny">'+esc(t('am_per100'))+': '+esc(fmtNum(food.per100.kcal))+' kcal · '+esc(macroLine(food.per100))+'</p>' +
    (food.nutriscore ? '<p class="tiny">Nutri-Score '+esc(food.nutriscore.toUpperCase())+(food.nova ? ' · NOVA '+esc(food.nova) : '')+'</p>' : '') +
    (food.kind === 'off' ? offCreditHtml() : '') + '</div>';
  if (ex.length) h += '<div class="notice bad"><b>'+esc(t('rc_excl_h'))+'</b> '+esc(ex.map(x=>x.label).join(', '))+'</div>';
  h += '<div class="chips" style="margin:10px 0">' +
    ['100 g'].concat(portions.map(p => p.label)).map((lab, i) =>
      '<button class="chip" type="button" data-g="'+(i === 0 ? 100 : portions[i-1].g)+'" aria-pressed="'+(Math.round(i === 0 ? 100 : portions[i-1].g) === Math.round(g))+'">'+esc(lab)+(i ? ' · '+fmtNum(portions[i-1].g)+' g' : '')+'</button>').join('') + '</div>';
  h += '<div class="inline"><div class="field"><label for="amG">'+esc(t('am_grams'))+'</label><input id="amG" type="number" inputmode="decimal" step="1" min="1" value="'+esc(Math.round(g))+'"></div>' +
    '<div class="field"><label for="amDate">'+esc(t('lg_date'))+'</label><input id="amDate" type="date" value="'+esc(ADD.date)+'"><span class="fhint" data-hint-for="amDate">'+esc((ADD.date) ? numDate(ADD.date, true) : '')+'</span></div></div>';
  h += '<div class="field"><span class="flabel">'+esc(t('lg_slot'))+'</span>'+slotChips(ADD.slot)+'</div>';
  h += '<div class="card flat" id="amPrev"></div>';
  h += '<div class="btnrow" style="margin:12px 0"><button class="btn" type="button" id="amSave">'+esc(t('save'))+'</button>' +
    '<button class="btn quiet" type="button" id="amBack">'+esc(t('back'))+'</button></div>';
  body.innerHTML = h;
  const upd = () => {
    const gg = Number($('#amG').value) || 0;
    const n = nutrientsFor(food, gg);
    $('#amPrev').innerHTML = '<div class="num"><b>'+esc(fmtNum(n.kcal))+'</b> kcal · '+esc(macroLine(n))+'</div>';
    $$('[data-g]', body).forEach(b => b.setAttribute('aria-pressed', String(Math.round(Number(b.getAttribute('data-g'))) === Math.round(gg))));
  };
  upd();
  $('#amG').addEventListener('input', upd);
  $$('[data-g]', body).forEach(b => b.addEventListener('click', () => { $('#amG').value = Math.round(Number(b.getAttribute('data-g'))); upd(); }));
  bindSlotChips(body, v => ADD.slot = v);
  $('#amBack').addEventListener('click', () => addMode(ADD.mode === 'scan' ? 'scan' : 'search'));
  $('#amSave').addEventListener('click', async () => {
    const gg = Number($('#amG').value) || 0;
    if (gg <= 0){ toast(t('am_need_g')); return; }
    let f = food;
    if (f.kind === 'off') f = await saveOffAsCustom(f);
    const portion = (f.portions||[]).find(p => Math.abs(p.g - gg) < 0.5);
    await recPut({type:'food_entry', date: $('#amDate').value || ADD.date, time: localTime(), slot: ADD.slot,
      name: foodName(f), source: {kind: f.kind === 'custom' ? 'custom' : f.kind, ref: f.ref},
      amount: {qty: gg, unit: 'g', grams: gg, label: portion ? portion.label + ' (' + fmtNum(gg) + ' g)' : fmtNum(gg) + ' g'},
      nutrients: nutrientsFor(f, gg), basis: f.kind === 'usda' ? 'database' : 'label'});
    closeSheet(); toast(t('lg_saved'));
  });
}

/* Barcode scanner. Chrome on Android has a built in barcode reader. */
async function addScanUI(body){
  body.innerHTML = '<div class="scanbox" style="margin-top:12px"><video id="scanVid" playsinline muted></video><div class="scanline"></div></div>' +
    '<p class="tiny" id="scanMsg" style="margin:8px 0">'+esc(t('sc_hint'))+'</p>' +
    '<div class="inline"><div class="field"><input id="scanCode" type="text" inputmode="numeric" placeholder="'+esc(t('sc_manual_ph'))+'"></div>' +
    '<button class="btn quiet none" type="button" id="scanGo">'+esc(t('sc_lookup'))+'</button></div><div id="scanRes"></div>';
  const lookup = async (code) => {
    code = String(code).replace(/\D/g,'');
    if (code.length < 6){ toast(t('sc_bad')); return; }
    $('#scanRes').innerHTML = '<p class="tiny">'+esc(t('loading'))+' '+esc(code)+'</p>';
    const mine = (await recByType('food')).find(r => r.barcode === code);
    if (mine){ amountStep(customFoodView(mine)); return; }
    try {
      const f = await offByBarcode(code);
      if (f && f.per100.kcal != null){ amountStep(f); return; }
      $('#scanRes').innerHTML = '<div class="notice warn">'+esc(t('sc_notfound', {c: code}))+'</div>' +
        '<div class="btnrow"><button class="btn" type="button" id="scanPhoto">'+esc(t('sc_photo_label'))+'</button></div>';
      $('#scanPhoto').addEventListener('click', () => { closeSheet(); openPhotoSheet({slot: ADD.slot, date: ADD.date, hint:'nutrition_label', barcode: code}); });
    } catch(err){
      $('#scanRes').innerHTML = '<div class="notice bad">'+esc(String(err.message||err))+'</div>';
    }
  };
  $('#scanGo').addEventListener('click', () => lookup($('#scanCode').value));
  if (!('BarcodeDetector' in window) || !(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){
    $('#scanMsg').textContent = t('sc_unsupported');
    $('.scanbox').classList.add('hide');
    return;
  }
  let stream = null, timer = null, stopped = false;
  const stop = () => { stopped = true; if (timer) clearInterval(timer); if (stream) stream.getTracks().forEach(tr => tr.stop()); };
  sheetCleanups.push(stop);
  try {
    const det = new BarcodeDetector({formats: ['ean_13','ean_8','upc_a','upc_e','code_128']});
    stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment'}, audio: false});
    if (stopped){ stop(); return; }
    const v = $('#scanVid');
    v.srcObject = stream; await v.play();
    timer = setInterval(async () => {
      if (stopped || v.readyState < 2) return;
      try {
        const codes = await det.detect(v);
        if (codes && codes.length){ const c = codes[0].rawValue; stop(); if (navigator.vibrate) navigator.vibrate(60); $('#scanCode').value = c; lookup(c); }
      } catch(e){}
    }, 300);
  } catch(err){
    $('#scanMsg').textContent = t('sc_nocam') + ' ' + String(err.message || err);
  }
}

async function editEntry(id){
  const e = await recGet(id);
  if (!e) return;
  let slot = e.slot;
  const hasGrams = e.amount && e.amount.grams;
  const food = e.source && e.source.ref ? await getFoodByRef(e.source.ref) : null;
  const isRecipe = e.source && e.source.kind === 'recipe';
  let b = '<p class="muted">'+esc(entryName(e))+'</p>';
  if (hasGrams) b += '<div class="field"><label for="eg">'+esc(t('am_grams'))+'</label><input id="eg" type="number" inputmode="decimal" value="'+esc(e.amount.grams)+'"></div>';
  else if (isRecipe) b += '<div class="field"><label for="es">'+esc(t('rc_servings_eaten'))+'</label><input id="es" type="number" inputmode="decimal" step="0.25" value="'+esc(e.amount.qty)+'"></div>';
  b += '<div class="field"><label for="ed">'+esc(t('lg_date'))+'</label><input id="ed" type="date" value="'+esc(e.date)+'"><span class="fhint" data-hint-for="ed">'+esc((e.date) ? numDate(e.date, true) : '')+'</span></div>';
  b += '<div class="field"><span class="flabel">'+esc(t('lg_slot'))+'</span>'+slotChips(slot)+'</div>';
  b += '<details><summary class="linkbtn">'+esc(t('lg_all_nutrients'))+'</summary>'+nutrientTable(e.nutrients)+'</details>';
  if (e.basis === 'estimate') b += '<p class="tiny" style="margin-top:8px">'+esc(t('lg_est_note'))+'</p>';
  const sheet = openSheet(esc(t('lg_edit')), b,
    '<button class="btn danger" type="button" id="eDel">'+icon('trash')+esc(t('p_remove'))+'</button>' +
    '<button class="btn quiet" type="button" id="eAgain">'+esc(t('lg_again'))+'</button>' +
    '<button class="btn" type="button" id="eSave">'+esc(t('save'))+'</button>');
  bindSlotChips(sheet, v => slot = v);
  $('#eDel').addEventListener('click', async () => { await recDelete(e.id); closeSheet(); toast(t('lg_deleted')); });
  $('#eAgain').addEventListener('click', async () => {
    const c = deepCopy(e); delete c.id; delete c.createdAt; c.date = localDateKey(); c.time = localTime(); c.slot = guessSlot();
    await recPut(c); closeSheet(); toast(t('lg_saved'));
  });
  $('#eSave').addEventListener('click', async () => {
    e.slot = slot;
    e.date = $('#ed').value || e.date;
    if (hasGrams){
      const g = Number($('#eg').value) || e.amount.grams;
      if (g !== e.amount.grams){
        e.nutrients = food ? nutrientsFor(food, g) : nutRound(nutScale(e.nutrients, g / e.amount.grams));
        e.amount = Object.assign({}, e.amount, {qty: g, grams: g, label: fmtNum(g) + ' g'});
      }
    } else if (isRecipe){
      const n = Number($('#es').value) || e.amount.qty;
      if (n !== e.amount.qty){
        e.nutrients = nutRound(nutScale(e.nutrients, n / e.amount.qty));
        e.amount = Object.assign({}, e.amount, {qty: n, label: fmtQty(n) + ' ' + t('rc_serv_short')});
      }
    }
    await recPut(e); closeSheet(); toast(t('lg_saved'));
  });
}

  {key:'mg300', name:{cs:'Hořčík 300 mg', en:'Magnesium 300 mg'}, form:'tablet', per:{mg:300}, hidden:true},
  {key:'b12', name:{cs:'Vitamin B12 1000 µg', en:'Vitamin B12 1000 µg'}, form:'tablet', per:{b12:1000}},

  {key:'whey', name:{cs:'Syrovátkový protein', en:'Whey protein'}, form:'powder', unit:{cs:'odměrka 30 g', en:'30 g scoop'}, per:{kcal:120, prot:24, fat:1.5, carb:2.5}}
];

/* A supplement added from a preset and not renamed shows the preset name
   in the current language. */
function suppPreset(s){ return SUPP_PRESETS.find(p => p.name && (p.name.cs === s.name || p.name.en === s.name)) || null; }
function suppName(s){ const p = suppPreset(s); return p ? L(p.name) : s.name; }
function suppUnitLabel(s){
  const p = suppPreset(s);
  if (p && p.unit && (s.unitLabel === p.unit.cs || s.unitLabel === p.unit.en)) return L(p.unit);
  return s.unitLabel;
}
const SUPP_NUT_CHOICES = ['vitd','epa','dha','mg','b12','zn','vitc','fe','iod','ca','k','se','vita','vite','vitk','b1','b2','b3','b5','b6','biot','fol','cu','mn','kcal','prot','fat','carb','fib'];

function suppScheduledOn(s, dateKey){
  if (s.active === false) return false;
  const sch = s.schedule;
  if (sch && typeof sch.every === 'number' && sch.every >= 2){
    return cycleDue(sch.start, dateKey, sch.every);
  }
  const days = (sch && sch.days) || [0,1,2,3,4,5,6];
  return days.indexOf(dateFromKey(dateKey).getDay()) >= 0;
}

async function renderSuppChecklist(el, dateKey, showManage, withButton){
  if (!el) return;
  if (!moduleOn('supplements')){ el.innerHTML = ''; return; }
  const supps = (await recByType('supplement')).filter(s => s.active !== false);
  const intakes = await recByTypeDate('supplement_intake', dateKey, dateKey);
  if (!supps.length && !showManage && !withButton){ el.innerHTML = ''; return; }

  /* Upper level check: the day's planned doses plus intakes of supplements
     not planned for that day. */
  const dayTotals = {};
  const addN = (n, f) => { for (const k in (n || {})){ const v = Number(n[k]) * f; if (isFinite(v)) dayTotals[k] = (dayTotals[k] || 0) + v; } };
  supps.forEach(s => {
    if (suppScheduledOn(s, dateKey)) addN(s.perUnit, Number(s.defaultUnits) || 1);
    else intakes.filter(i => i.supplementId === s.id).forEach(i => addN(i.nutrients, 1));
  });
  const ulOver = suppUlOver(dayTotals);

  let h = '<div class="card"><div class="sheethead" style="align-items:center;margin-bottom:6px"><h3 style="flex:1">'+esc(t('sp_today'))+'</h3>' +
    '<button class="linkbtn" type="button" data-act="supp-manage">'+esc(t('sp_manage'))+'</button></div>';

  if (!supps.length) h += '<p class="tiny">'+esc(t('sp_none'))+'</p>';
  supps.forEach(s => {
    const taken = intakes.filter(i => i.supplementId === s.id);
    const sched = suppScheduledOn(s, dateKey);
    if (!sched && !taken.length) return;
    h += '<label class="ing supp"><input type="checkbox" data-supp="'+esc(s.id)+'" data-date="'+esc(dateKey)+'" '+(taken.length ? 'checked' : '')+'>' +
      '<span class="it">'+esc(suppName(s))+' <span class="tiny">'+esc(fmtQty(s.defaultUnits||1))+' × '+esc(suppUnitLabel(s) || t('sp_form_'+(s.form||'capsule')))+
      ((s.schedule && s.schedule.time) ? ' · '+esc(t('sp_time_'+s.schedule.time)) : '')+'</span></span></label>';
  });
  ulOver.forEach(o => {
    h += '<div class="notice warn">'+esc(t('sp_ul_over', {a: fmtAmt(o.amount), u: nutUnit(o.k), n: nutLabel(o.k), ul: fmtAmt(o.ul)}))+'</div>';
  });
  if (withButton) h += '<div class="btnrow" style="margin-top:12px"><button class="btn" type="button" data-act="supp-manage">'+esc(t('fab_supp'))+'</button></div>';
  h += '</div>';
  el.innerHTML = h;
}

async function toggleSuppIntake(suppId, dateKey, on){
  const s = await recGet(suppId);
  if (!s) return;
  const intakes = (await recByTypeDate('supplement_intake', dateKey, dateKey)).filter(i => i.supplementId === suppId);
  if (on && !intakes.length){
    const u = Number(s.defaultUnits) || 1;
    await recPut({type:'supplement_intake', date: dateKey, time: localTime(), supplementId: s.id, name: s.name, units: u,
      nutrients: nutRound(nutScale(s.perUnit || {}, u)), extra: (s.extra||[]).map(x => Object.assign({}, x, {amount: x.amount * u}))});
  } else if (!on){
    for (const i of intakes) await recDelete(i.id);
  }
}

  }
  h += '<div id="quickSupps"></div>';
  h += '<button class="btn quiet qm-full" type="button" data-qfull="1">' + esc(t('qm_full')) + '</button>';
  host.innerHTML = h;
  await renderSuppChecklist($('#quickSupps'), today);
  if (!S.sheetOpen && (!document.activeElement || document.activeElement === document.body)) {
    var firstSlot = $('#s-quick [data-slot="breakfast"]');
    if (firstSlot) firstSlot.focus();
  }
}

async function quickCopySlot(slot) {
  var today = localDateKey();
  var yest = await recByTypeDate('food_entry', addDays(today, -1), addDays(today, -1));
  for (var i = 0; i < yest.length; i++) {
    var entry = yest[i];
    if (entry.slot !== slot) continue;
    var c = deepCopy(entry);
    delete c.id;
    delete c.createdAt;
    c.date = today;
    await recPut(c);
  }
  await renderQuick();
}

function bindQuick() {
  var host = $('#s-quick');
  if (!host) return;
  host.addEventListener('click', async function (e) {
    var b = e.target.closest('[data-qdel]');
    if (b) {
      await recDelete(b.getAttribute('data-qdel'));
      toast(t('lg_deleted'));
      await renderQuick();
      return;
    }
    b = e.target.closest('[data-qsame]');
    if (b) {
      await quickCopySlot(b.getAttribute('data-qsame'));
      return;
    }
    if (e.target.closest('[data-qfull]')) {
      await setQuickMode(false);
    }
  });
}

   against your profile and what you ate today.

const PHOTO = { dataUrl: null, hint: 'auto', slot: null, date: null, barcode: null, result: null };

function openPhotoSheet(opts){

    '<div class="btnrow" style="margin:12px 0">' +
      '<label class="btn">'+icon('camera')+esc(t('ph_take'))+'<input type="file" accept="image/*" capture="environment" class="hide" id="phCam"></label>' +
      '<label class="btn quiet">'+esc(t('ph_upload'))+'<input type="file" accept="image/*" class="hide" id="phFile"></label></div>' +
    '<div id="phPrev"></div>' +

    PHOTO.hint = bt.getAttribute('data-hint');
    $$('#phHints [data-hint]').forEach(x => x.setAttribute('aria-pressed', x === bt ? 'true' : 'false'));
  });
  const onFile = async (inp) => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    try {
      PHOTO.dataUrl = await fileToDownscaledJpeg(f, 1568, 0.85);
      $('#phPrev').innerHTML = '<img class="phimg" src="'+PHOTO.dataUrl+'" alt="">';
      $('#phGo').disabled = false;
    } catch(e){ toast(t('ph_bad')); }
  };
  $('#phCam').addEventListener('change', e => onFile(e.target));
  $('#phFile').addEventListener('change', e => onFile(e.target));
  $('#phGo').addEventListener('click', runPhotoEval);
  return sheet;
}

async function runPhotoEval(){
  if (!PHOTO.dataUrl) return;
  if (!(await ensureAiReady())) return;
  const btn = $('#phGo');
  btn.disabled = true; btn.textContent = t('ai_working');
  $('#phOut').innerHTML = '<div class="notice">'+esc(t('ph_working'))+'</div>';
  try {
    const r = await aiEvaluatePhoto(PHOTO.dataUrl, PHOTO.hint, ($('#phNote')||{}).value || '');
    PHOTO.result = r;
    /* the local exclusion check runs too, independent of the model */
    const local = exclusionHits([r.name, r.description, (r.ingredientsSeen||[]).join(' ')].join(' '));
    const warn = (r.exclusionWarnings || []).slice();
    local.forEach(x => { if (!warn.some(w => fold(w).indexOf(fold(x.label)) >= 0)) warn.push(x.label + ' (' + t('ph_local_check') + ')'); });
    const thumb = await shrinkDataUrl(PHOTO.dataUrl, 360);
    const rec = await recPut({type:'photo_eval', date: PHOTO.date, hint: PHOTO.hint, result: r, warnings: warn});
    await dbPut('media', {id: 'photo:' + rec.id, dataUrl: thumb, at: nowIso()});
    renderPhotoResult(r, warn);
  } catch(err){
    $('#phOut').innerHTML = '<div class="notice bad">'+esc(t('err_prefix'))+'<div class="verbatim">'+esc(String(err.message||err))+'</div></div>';
  }
  btn.disabled = false; btn.textContent = t('ph_again');
}

function shrinkDataUrl(dataUrl, side){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const sc = Math.min(1, side / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', 0.7));
    };
    img.onerror = () => res(null);
    img.src = dataUrl;
  });
}
