    time: {prepMin: (r.time||{}).prepMin || null, cookMin: (r.time||{}).cookMin || null, totalMin: (r.time||{}).totalMin || null},
    difficulty: r.difficulty || null,
    ingredients: (r.ingredients || []).map(i => ({group: i.group || null, item: i.item, qty: i.qty == null ? null : Number(i.qty), unit: i.unit || null,
      grams: i.grams == null ? null : Number(i.grams), prep: i.prep || null, optional: !!i.optional})),
    steps: (r.steps || []).map(s => ({text: s.text, minutes: s.minutes == null ? null : Number(s.minutes)})),
    tips: (r.tips || []).map(x => typeof x === 'string' ? {text: x} : x),
    variations: (r.variations || []).map(v => ({label: v.label, text: v.text})),
    storage: r.storage || null,
    nutrition: {perServing: nutRound(r.nutritionPerServing || {}), basis: 'estimated', confidence: 'medium'},
    tags,
    sources: [{platform: 'claude', model: S.prefs.models.chat, createdAt: nowIso()}],
    extraction: null,
    thumb: null,
    createdAt: nowIso(), updatedAt: nowIso()
  };
}

async function saveRecipe(rec){
  rec.updatedAt = nowIso();
  await dbPut('recipes', rec);
  if (rec.origin === 'claude' || rec.origin === 'own') markDirty('recipe saved');
  await loadRecipes();
  return rec;
}

/* Starter recipes ship with the app so suggestions work before the
   archive exists. They are marked and can be hidden in settings. */
async function ensureStarterRecipes(){
  const have = await kvGet('starterVersion', null);
  if (have === VERSION) return;
  try {
    const res = await fetch('data/recipes-starter.json?v=' + encodeURIComponent(VERSION));
    if (!res.ok) return;
    const j = await res.json();
    const recs = (j.recipes || []).map(r => Object.assign({}, r, {origin: 'starter'}));
    await dbPutMany('recipes', recs);
    await kvSet('starterVersion', VERSION);
  } catch(e){ /* offline on first run: try next time */ }
}

/* ---------- Archive sync ----------
   The archive index lives in your private GitHub data repository at
   <path>/index.json (the same repository as the backup). The overnight
   extraction writes it there and to Google Drive. */

async function ghRaw(path){
  const r = parseRepo();
  if (!r || !S.secrets.github) throw new Error(t('arch_need_repo'));
  const q = '?ref=' + encodeURIComponent(S.prefs.backup.branch || 'main');
  const res = await fetch(GITHUB_API + '/repos/'+r.owner+'/'+r.repo+'/contents/'+path+q, {
    headers: {'Authorization':'Bearer ' + S.secrets.github, 'Accept':'application/vnd.github.raw+json', 'X-GitHub-Api-Version':'2022-11-28'}
  });
  if (res.status === 404) return null;
  if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
  return res;
}

async function importRecipeIndex(j, label){
  if (!j || !Array.isArray(j.recipes)) throw new Error(t('arch_bad_file'));
  const incoming = j.recipes.filter(r => r && r.id && r.title);
  const ids = {};
  incoming.forEach(r => { ids[r.id] = 1; r.origin = r.origin && r.origin !== 'starter' ? r.origin : 'archive'; if (!r.type) r.type = 'recipe'; });
  /* archive records that disappeared from the index are removed; your own
     and Claude recipes are never touched by a sync */
  const current = await dbAll('recipes');
  const gone = current.filter(r => r.origin === 'archive' && !ids[r.id]).map(r => r.id);
  for (const id of gone) await dbDel('recipes', id);
  await dbPutMany('recipes', incoming);
  S.meta.archive.lastSyncAt = nowIso();
  S.meta.archive.count = incoming.length;
  S.meta.archive.lastError = null;
  S.meta.archive.source = label;
  await saveMeta();
  await loadRecipes();
  return {count: incoming.length, removed: gone.length};
}

async function syncArchive(opts){
  opts = opts || {};
  try {
    const path = (S.prefs.archive.path || 'archive/recipes').replace(/\/+$/,'');
    const res = await ghRaw(path + '/index.json');
    if (!res){ if (!opts.quiet) toast(t('arch_none_yet'), 5000); return null; }
    const txt = await res.text();
    const h = hashString(txt);
    if (h === S.meta.archive.lastSha && !opts.force){
      S.meta.archive.lastSyncAt = nowIso(); await saveMeta();
      if (!opts.quiet) toast(t('arch_same'));
      return {same: true};
    }
    const out = await importRecipeIndex(JSON.parse(txt), 'github');
    S.meta.archive.lastSha = h; await saveMeta();
    if (!opts.quiet) toast(t('arch_synced', {n: out.count}));
    return out;
  } catch(err){
    S.meta.archive.lastError = String(err.message || err);
    await saveMeta();
    if (!opts.quiet) toast(t('err_prefix') + ': ' + S.meta.archive.lastError, 6000);
    return null;
  }
}

/* Thumbnails: fetched once from the data repository, kept in the media store. */
const thumbUrls = {};
async function recipeThumbUrl(rec){
  if (!rec || !rec.thumb) return null;
  if (rec.thumb.startsWith('data:')) return rec.thumb;
  if (thumbUrls[rec.id]) return thumbUrls[rec.id];
  const key = 'thumb:' + rec.id;
  let m = await dbGet('media', key);
  if (!m && rec.origin === 'archive' && S.secrets.github && parseRepo()){
    try {
      const path = (S.prefs.archive.path || 'archive/recipes').replace(/\/+$/,'') + '/' + rec.thumb;
      const res = await ghRaw(path);
      if (res){ const blob = await res.blob(); m = {id: key, blob, at: nowIso()}; await dbPut('media', m); }
    } catch(e){ return null; }
  }
  if (!m && rec.thumb.startsWith('data:')) return rec.thumb;
  if (!m) return null;
  thumbUrls[rec.id] = URL.createObjectURL(m.blob);
  return thumbUrls[rec.id];
}

function fillThumbs(root){
  $$('[data-thumb]', root).forEach(async el => {
    const rec = RECIPES.byId[el.getAttribute('data-thumb')];
    const url = await recipeThumbUrl(rec);
    if (url){ el.style.backgroundImage = 'url("'+url+'")'; el.classList.add('has'); }
  });
}

/* ---------- Helpers ---------- */

function recipeKcal(r){ return r && r.nutrition && r.nutrition.perServing ? r.nutrition.perServing.kcal : null; }
function recipeTime(r){ return r && r.time ? (r.time.totalMin || ((r.time.prepMin||0) + (r.time.cookMin||0)) || null) : null; }
function recipeText(r){ return [r.title, r.titleEn, (r.ingredients||[]).map(i => i.item + ' ' + (i.prep||'')).join(' ')].join(' '); }
function recipeExclusions(r){ return exclusionHits(recipeText(r)); }

function tagLabel(tag){
  const [ns, val] = String(tag).split(':');
  const key = 'tag_' + ns + '_' + (val||'').replace(/[^a-z0-9]+/g,'_');
  const tr = t(key);
  if (tr !== key) return tr;
  return (val || ns).replace(/-/g,' ');
}
function tagNs(tag){ return String(tag).split(':')[0]; }

const ORIGIN_LABEL = {archive:'orig_archive', starter:'orig_starter', claude:'orig_claude', own:'orig_own'};

function fmtQty(q){
  if (q == null || q === '') return '';
  const n = Number(q);
  if (!isFinite(n)) return String(q);
  const fr = [[0.25,'¼'],[0.5,'½'],[0.75,'¾'],[0.333,'⅓'],[0.667,'⅔']];
  const whole = Math.floor(n), rest = n - whole;
  for (const [v, s] of fr){ if (Math.abs(rest - v) < 0.04) return (whole ? whole : '') + s; }
  if (n >= 20) return fmtNum(Math.round(n));
  return fmtNum(n, 1);
}

function recipeCard(r, extra){
  const k = recipeKcal(r), tm = recipeTime(r), note = recipeNote(r.id);
  const prot = r.nutrition && r.nutrition.perServing ? r.nutrition.perServing.prot : null;
  const tags = (r.tags||[]).filter(x => ['meal','prep','diet','time'].indexOf(tagNs(x)) >= 0).slice(0,3);
  const ex = recipeExclusions(r);
  const initial = esc((r.title||'?').trim().charAt(0).toUpperCase());
  return '<button class="rcard" type="button" data-act="open-recipe" data-id="'+esc(r.id)+'">' +
    '<span class="rthumb" data-thumb="'+esc(r.id)+'"><span>'+initial+'</span></span>' +
    '<span class="rbody"><span class="rtitle">'+esc(r.title)+(note && note.favorite ? ' <span class="star">★</span>' : '')+'</span>' +
    '<span class="rmeta num">'+[tm ? tm+' min' : null, k != null ? fmtNum(k)+' kcal' : null, prot != null ? 'B '+fmtNum(prot)+' g' : null].filter(Boolean).map(esc).join(' · ')+'</span>' +
    (extra ? '<span class="rextra">'+extra+'</span>' : '') +
    '<span class="rtags">' + (ex.length ? '<span class="pill err">'+esc(t('rc_excluded'))+'</span>' : '') +
      tags.map(x => '<span class="pill">'+esc(tagLabel(x))+'</span>').join('') +
      (r.origin !== 'archive' ? '<span class="pill wait">'+esc(t(ORIGIN_LABEL[r.origin]||'orig_own'))+'</span>' : '') +
    '</span></span></button>';
}

/* Recipes are in English; a Czech search word also matches its English
   equivalents (kuře finds chicken). */
function recipeTextMatch(r, q){
  return fold(q).split(/[^a-z0-9]+/).filter(Boolean).every(w => expandToken(w).some(a => r._search.indexOf(a) >= 0));
}

function recipeMatchesFilter(r){
  const F = S.recipeFilter;
  if (F.q && !recipeTextMatch(r, F.q)) return false;
  for (const c of F.chips){
    if (c === 'fav'){ const n = recipeNote(r.id); if (!n || !n.favorite) return false; }
    else if (c === 'noexcl'){ if (recipeExclusions(r).length) return false; }
    else if (c === 'time:under-30'){ const tm = recipeTime(r); if (!(tm && tm <= 30)) return false; }
    else if ((r.tags||[]).indexOf(c) < 0) return false;
  }
  for (const tg of F.tags){ if ((r.tags||[]).indexOf(tg) < 0) return false; }
  if (F.origin !== 'all' && r.origin !== F.origin) return false;
  return true;
}

const QUICK_CHIPS = ['meal:breakfast','meal:lunch','meal:snack','meal:dinner','prep:meal-prep','time:under-30','diet:high-protein','fav'];

/* ---------- Suggestions ---------- */

function seededRand(seed){
  let x = 0; for (let i = 0; i < seed.length; i++) x = (x * 31 + seed.charCodeAt(i)) >>> 0;
  return () => { x = (x * 1664525 + 1013904223) >>> 0; return x / 4294967296; };
}

async function suggestFor(slot, dateKey, n){
  const g = computeTargets(S.profile);
  const shares = slotShares();
  const d = await dayTotals(dateKey);
  const slotEaten = (d.bySlot[slot] && d.bySlot[slot].kcal) || 0;
  const slotTarget = g ? g.mid * shares[slot] : null;
  /* a meal that is mostly logged already gets ideas for next time at full size */
  const done = slotTarget != null && slotEaten >= slotTarget * 0.7;
  const target = g ? (done ? slotTarget : Math.max(150, slotTarget - slotEaten)) : null;
  const K = (S.profile && S.profile.kitchen) || {};
  const day = dateFromKey(dateKey).getDay();
  const limit = TIME_MAX_MIN[(day === 0 || day === 6) ? (K.timeWeekend||3) : (K.timeWeekday||2)];
  const eq = (K.equipment||[]).filter(x => x !== 'none');
  const likes = ((S.profile && S.profile.food && S.profile.food.cuisines) || []).map(id => {
    const c = CUISINES.find(x => x.id === id); return c ? c.en.toLowerCase().replace(/\s+/g,'-') : id; });
  const pantry = (await recByType('pantry_item')).filter(p => p.have).map(p => fold(p.name));
  const focus = (S.profile && S.profile.goals && S.profile.goals.focusNutrients) || [];
  const rnd = seededRand(dateKey + slot);
  const recent = {};
  Object.values(RECIPES.notes).forEach(nt => { const last = (nt.cookedDates||[]).slice(-1)[0]; if (last) recent[nt.recipeId] = last; });
  const out = [];
  visibleRecipes().forEach(r => {
    if (recipeExclusions(r).length) return;
    const tags = r.tags || [];
    const mealTags = tags.filter(x => tagNs(x) === 'meal');
    if (mealTags.length && mealTags.indexOf('meal:' + slot) < 0) return;
    const kc = recipeKcal(r);
    const reasons = [];
    let s = 0, serv = 1;
    if (kc && target){
      serv = clamp(Math.round(target / kc * 2) / 2, 0.5, 2);
      const diff = Math.abs(kc * serv - target) / target;
      s += 3 * (1 - Math.min(diff, 1));
      if (diff < 0.15) reasons.push(t('sg_r_fits'));
    }
    const ps = (r.nutrition||{}).perServing || {};
    if (kc && ps.prot){ const pd = ps.prot*4/kc; s += pd * 4; if (pd >= 0.25) reasons.push(t('sg_r_protein')); }
    const tm = recipeTime(r);
    if (tm && tm > limit){ s -= 2; } else if (tm) { s += 0.3; }
    const needEq = tags.filter(x => tagNs(x) === 'equip').map(x => x.split(':')[1]);
    if (eq.length && needEq.some(e => ['oven','airfryer','blender','pressure','micro'].indexOf(e) >= 0 && eq.indexOf(e) < 0)) s -= 3;
    if (tags.some(x => tagNs(x) === 'cuisine' && likes.indexOf(x.split(':')[1]) >= 0)) { s += 0.6; }
    if (pantry.length){
      const ings = (r.ingredients||[]).filter(i => !i.optional);
      const hit = ings.filter(i => pantry.some(p => p.length >= 3 && fold(i.item).indexOf(p) >= 0)).length;
      const frac = ings.length ? hit / ings.length : 0;
      s += frac * 2;
      if (frac >= 0.6) reasons.push(t('sg_r_pantry'));
    }
    focus.forEach(k => { const v = k === 'o3ld' ? ((ps.epa||0)+(ps.dha||0))*1000 : ps[k]; if (v && kc){ s += 0.4; } });
    if (tags.indexOf('prep:meal-prep') >= 0) s += 0.3;
    const note = recipeNote(r.id);
    if (note && note.favorite){ s += 0.8; reasons.push(t('sg_r_fav')); }
    if (recent[r.id] && recent[r.id] >= addDays(dateKey, -3)) s -= 2.5;
    if (r.origin === 'starter') s -= 0.4;
    s += rnd() * 1.2;
    out.push({r, s, serv, kcal: kc ? kc * serv : null, reasons});
  });
  out.sort((a,b) => b.s - a.s);
  return {target, done, eaten: slotEaten, items: out.slice(0, n || 3)};
}

function parseIngredientLine(line){
  const m = line.match(/^([\d.,/½¼¾]+)?\s*(g|kg|ml|l|dl|ks|lžíce|lžička|lzice|lzicka|tbsp|tsp|cup|hrnek|stroužek|pcs|pinch|špetka)?\.?\s+(.*)$/i);
  if (!m) return {item: line};
  let q = m[1] ? m[1].replace(',', '.').replace('½','.5').replace('¼','.25').replace('¾','.75') : null;
  if (q && q.indexOf('/') > 0){ const [a,b2] = q.split('/'); q = Number(a)/Number(b2); }
  return {qty: q != null ? Number(q) : null, unit: m[2] || null, item: m[3] || line};
}

  }).join('\n');
}

async function copyPreviousDay(){
  const day = S.logDate || localDateKey();

const ADD = { slot:null, date:null, mode:'search', food:null, grams:100 };

function openAddSheet(slot, date){
  ADD.slot = slot || guessSlot();
  ADD.date = date || S.logDate || localDateKey();
  ADD.food = null;
  const modes = ['search','scan','photo','describe','recipe','manual'];
  const b = '<div class="seg small" id="addModes">' + modes.map(m =>
      '<button type="button" data-mode="'+m+'" class="'+(m==='search'?'on':'')+'">'+esc(t('am_'+m))+'</button>').join('') + '</div>' +
    '<div id="addBody"></div>';

function addMode(mode){

}

  h += '<div class="field"><span class="flabel">'+esc(t('lg_slot'))+'</span>'+slotChips(ADD.slot)+'</div>';

    '<button class="btn quiet" type="button" id="amBack">'+esc(t('back'))+'</button></div>';

  };

  $('#amG').addEventListener('input', upd);

      name: foodName(f), source: {kind: f.kind === 'custom' ? 'custom' : f.kind, ref: f.ref},

      nutrients: nutrientsFor(f, gg), basis: f.kind === 'usda' ? 'database' : 'label'});

/* Barcode scanner. Chrome on Android has a built in barcode reader. */
async function addScanUI(body){
  body.innerHTML = '<div class="scanbox" style="margin-top:12px"><video id="scanVid" playsinline muted></video><div class="scanline"></div></div>' +
    '<p class="tiny" id="scanMsg" style="margin:8px 0">'+esc(t('sc_hint'))+'</p>' +
    '<div class="inline"><div class="field"><input id="scanCode" type="text" inputmode="numeric" placeholder="'+esc(t('sc_manual_ph'))+'"></div>' +
    '<button class="btn quiet none" type="button" id="scanGo">'+esc(t('sc_lookup'))+'</button></div><div id="scanRes"></div>';
  const lookup = async (code) => {
    code = String(code).replace(/\D/g,'');
    if (code.length < 6){ toast(t('sc_bad')); return; }
    $('#scanRes').innerHTML = '<p class="tiny">'+esc(t('loading'))+' '+esc(code)+'</p>';
    const mine = (await recByType('food')).find(r => r.barcode === code);
    if (mine){ amountStep(customFoodView(mine)); return; }
    try {
      const f = await offByBarcode(code);
      if (f && f.per100.kcal != null){ amountStep(f); return; }
      $('#scanRes').innerHTML = '<div class="notice warn">'+esc(t('sc_notfound', {c: code}))+'</div>' +
        '<div class="btnrow"><button class="btn" type="button" id="scanPhoto">'+esc(t('sc_photo_label'))+'</button></div>';
      $('#scanPhoto').addEventListener('click', () => { closeSheet(); openPhotoSheet({slot: ADD.slot, date: ADD.date, hint:'nutrition_label', barcode: code}); });
    } catch(err){
      $('#scanRes').innerHTML = '<div class="notice bad">'+esc(String(err.message||err))+'</div>';
    }
  };
  $('#scanGo').addEventListener('click', () => lookup($('#scanCode').value));
  if (!('BarcodeDetector' in window) || !(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){
    $('#scanMsg').textContent = t('sc_unsupported');
    $('.scanbox').classList.add('hide');
    return;
  }
  let stream = null, timer = null, stopped = false;
  const stop = () => { stopped = true; if (timer) clearInterval(timer); if (stream) stream.getTracks().forEach(tr => tr.stop()); };
  sheetCleanups.push(stop);
  try {
    const det = new BarcodeDetector({formats: ['ean_13','ean_8','upc_a','upc_e','code_128']});
    stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment'}, audio: false});
    if (stopped){ stop(); return; }
    const v = $('#scanVid');
    v.srcObject = stream; await v.play();
    timer = setInterval(async () => {
      if (stopped || v.readyState < 2) return;
      try {
        const codes = await det.detect(v);
        if (codes && codes.length){ const c = codes[0].rawValue; stop(); if (navigator.vibrate) navigator.vibrate(60); $('#scanCode').value = c; lookup(c); }
      } catch(e){}
    }, 300);
  } catch(err){
    $('#scanMsg').textContent = t('sc_nocam') + ' ' + String(err.message || err);
  }
}

    const c = deepCopy(e); delete c.id; delete c.createdAt; c.date = localDateKey(); c.time = localTime(); c.slot = guessSlot();
    await recPut(c); closeSheet(); toast(t('lg_saved'));
  });
  $('#eSave').addEventListener('click', async () => {
    e.slot = slot;
    e.date = $('#ed').value || e.date;
    if (hasGrams){
      const g = Number($('#eg').value) || e.amount.grams;
      if (g !== e.amount.grams){
        e.nutrients = food ? nutrientsFor(food, g) : nutRound(nutScale(e.nutrients, g / e.amount.grams));
        e.amount = Object.assign({}, e.amount, {qty: g, grams: g, label: fmtNum(g) + ' g'});
      }
    } else if (isRecipe){
      const n = Number($('#es').value) || e.amount.qty;
      if (n !== e.amount.qty){
        e.nutrients = nutRound(nutScale(e.nutrients, n / e.amount.qty));
        e.amount = Object.assign({}, e.amount, {qty: n, label: fmtQty(n) + ' ' + t('rc_serv_short')});
      }
    }
    await recPut(e); closeSheet(); toast(t('lg_saved'));
  });
}

function suppScheduledOn(s, dateKey){
  const days = (s.schedule && s.schedule.days) || [0,1,2,3,4,5,6];
  return s.active !== false && days.indexOf(dateFromKey(dateKey).getDay()) >= 0;
}

async function renderSuppChecklist(el, dateKey, showManage){
  if (!el) return;
  const supps = (await recByType('supplement')).filter(s => s.active !== false);
  const intakes = await recByTypeDate('supplement_intake', dateKey, dateKey);
  if (!supps.length && !showManage){ el.innerHTML = ''; return; }
  let h = '<div class="card"><div class="sheethead" style="align-items:center;margin-bottom:6px"><h3 style="flex:1">'+esc(t('sp_today'))+'</h3>' +
    '<button class="linkbtn" type="button" data-act="supp-manage">'+esc(t('sp_manage'))+'</button></div>';
  if (!supps.length) h += '<p class="tiny">'+esc(t('sp_none'))+'</p>';
  supps.forEach(s => {
    const taken = intakes.filter(i => i.supplementId === s.id);
    const sched = suppScheduledOn(s, dateKey);
    if (!sched && !taken.length) return;
    h += '<label class="ing supp"><input type="checkbox" data-supp="'+esc(s.id)+'" data-date="'+esc(dateKey)+'" '+(taken.length ? 'checked' : '')+'>' +
      '<span class="it">'+esc(s.name)+' <span class="tiny">'+esc(fmtQty(s.defaultUnits||1))+' × '+esc(s.unitLabel || t('sp_form_'+(s.form||'capsule')))+

  });
  h += '</div>';
  el.innerHTML = h;
}

async function toggleSuppIntake(suppId, dateKey, on){
  const s = await recGet(suppId);
  if (!s) return;
  const intakes = (await recByTypeDate('supplement_intake', dateKey, dateKey)).filter(i => i.supplementId === suppId);
  if (on && !intakes.length){
    const u = Number(s.defaultUnits) || 1;
    await recPut({type:'supplement_intake', date: dateKey, time: localTime(), supplementId: s.id, name: s.name, units: u,
      nutrients: nutRound(nutScale(s.perUnit || {}, u)), extra: (s.extra||[]).map(x => Object.assign({}, x, {amount: x.amount * u}))});
  } else if (!on){
    for (const i of intakes) await recDelete(i.id);
  }
}

  });
  const onFile = async (inp) => {

      PHOTO.dataUrl = await fileToDownscaledJpeg(f, 1568, 0.85);

async function runPhotoEval(){
  if (!PHOTO.dataUrl) return;
  if (!(await ensureAiReady())) return;
  const btn = $('#phGo');
  btn.disabled = true; btn.textContent = t('ai_working');
  $('#phOut').innerHTML = '<div class="notice">'+esc(t('ph_working'))+'</div>';
  try {
    const r = await aiEvaluatePhoto(PHOTO.dataUrl, PHOTO.hint, ($('#phNote')||{}).value || '');
    PHOTO.result = r;
    /* the local exclusion check runs too, independent of the model */
    const local = exclusionHits([r.name, r.description, (r.ingredientsSeen||[]).join(' ')].join(' '));
    const warn = (r.exclusionWarnings || []).slice();
    local.forEach(x => { if (!warn.some(w => fold(w).indexOf(fold(x.label)) >= 0)) warn.push(x.label + ' (' + t('ph_local_check') + ')'); });
    const thumb = await shrinkDataUrl(PHOTO.dataUrl, 360);
    const rec = await recPut({type:'photo_eval', date: PHOTO.date, hint: PHOTO.hint, result: r, warnings: warn});
    await dbPut('media', {id: 'photo:' + rec.id, dataUrl: thumb, at: nowIso()});
    renderPhotoResult(r, warn);
  } catch(err){
    $('#phOut').innerHTML = '<div class="notice bad">'+esc(t('err_prefix'))+'<div class="verbatim">'+esc(String(err.message||err))+'</div></div>';
  }
  btn.disabled = false; btn.textContent = t('ph_again');
}

function shrinkDataUrl(dataUrl, side){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const sc = Math.min(1, side / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', 0.7));
    };
    img.onerror = () => res(null);
    img.src = dataUrl;
  });
}

  const pg = r.portionGrams || null;

    '<div class="inline"><div class="field"><label for="phG">'+esc(t('am_grams'))+'</label><input id="phG" type="number" inputmode="decimal" value="'+esc(pg ? Math.round(pg) : 100)+'"></div>' +
    '<div class="field"><label for="phD">'+esc(t('lg_date'))+'</label><input id="phD" type="date" value="'+esc(PHOTO.date)+'"></div></div>' +
    '<div class="field"><span class="flabel">'+esc(t('lg_slot'))+'</span>'+slotChips(PHOTO.slot)+'</div>' +
    '<div id="phN"></div>' +
    '<div class="btnrow" style="margin-top:10px"><button class="btn" type="button" id="phLog">'+esc(t('ph_log'))+'</button>' +
    (r.kind === 'nutrition_label' || r.kind === 'packaged_product' ? '<button class="btn quiet" type="button" id="phSave">'+esc(t('ph_save_food'))+'</button>' : '') +
    '<button class="btn quiet" type="button" id="phChat">'+icon('chat')+esc(t('rc_ask'))+'</button></div></div>';
  $('#phOut').innerHTML = h;
  setTimeout(() => { const o = $('#phOut'); if (o) o.scrollIntoView({behavior:'smooth', block:'start'}); }, 60);
  bindSlotChips($('#phOut'), v => PHOTO.slot = v);
  const per100 = r.per100g && r.per100g.kcal != null ? r.per100g : (pg && r.perPortion ? nutScale(r.perPortion, 100 / pg) : null);
  const nutFor = (g) => per100 ? nutRound(nutScale(per100, g/100)) : (r.perPortion || {});
  const upd = () => { const g = Number($('#phG').value) || 0; $('#phN').innerHTML = '<p class="num"><b>'+esc(fmtNum(nutFor(g).kcal))+'</b> kcal · '+esc(macroLine(nutFor(g)))+'</p>'; };
  upd();

/* ============================================================
   Chat with Claude about ingredients you have or miss, recipes,
   meal prep. Claude can update the pantry and save recipes through
   tools; everything it does is shown in the conversation.
   ============================================================ */

const CHAT_TOOLS = [
  {
    name: 'update_pantry',
    description: 'Update the list of ingredients the person has at home. Use when they say they have, bought, used up or ran out of something.',
    input_schema: {type:'object', properties:{
      have: {type:'array', items:{type:'string'}, description:'Ingredients now at home'},
      ran_out: {type:'array', items:{type:'string'}, description:'Ingredients used up; they go on the shopping list'},
      remove: {type:'array', items:{type:'string'}, description:'Remove from the list entirely'}
    }}
  },
  {
    name: 'save_recipe',
    description: 'Save a complete recipe to the person\'s recipe collection. Only when they ask to save or keep it.',
    input_schema: RECIPE_SCHEMA
  },
  {
    name: 'show_recipe',
    description: 'Show a recipe card from the archive so the person can open it. Use the archive id.',
    input_schema: {type:'object', properties:{ recipe_id:{type:'string'} }, required:['recipe_id']}
  }
];

async function chatHistory(){
  const all = await recByType('chat_message');
  const thread = S.meta.chatThread || null;
  return all.filter(m => (m.thread || null) === thread).sort((a,b) => a.createdAt < b.createdAt ? -1 : 1);
}

function chatBubble(m){
  if (m.role === 'note') return '<div class="cnote tiny">'+esc(m.text)+'</div>';
  const body = m.role === 'assistant' ? mdLite(m.text || '') : esc(m.text || '').replace(/\n/g,'<br>');
  let extra = '';
  (m.cards || []).forEach(id => { const r = RECIPES.byId[id]; if (r) extra += recipeCard(r); });
  return '<div class="bubble '+(m.role === 'user' ? 'me' : 'ai')+'">'+body+(extra ? '<div class="rlist" style="margin-top:8px">'+extra+'</div>' : '')+'</div>';
}

/* Tiny markdown: bold, bullet lists, numbered lists, headings. Enough for chat. */
function mdLite(src){
  const lines = esc(src).split('\n');
  let out = '', list = null;
  const close = () => { if (list){ out += '</'+list+'>'; list = null; } };
  lines.forEach(line => {
    let l = line.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    const ul = l.match(/^\s*[-•*]\s+(.*)$/), ol = l.match(/^\s*\d+[.)]\s+(.*)$/), hd = l.match(/^#{1,4}\s+(.*)$/);
    if (ul){ if (list !== 'ul'){ close(); out += '<ul>'; list = 'ul'; } out += '<li>'+ul[1]+'</li>'; }
    else if (ol){ if (list !== 'ol'){ close(); out += '<ol>'; list = 'ol'; } out += '<li>'+ol[1]+'</li>'; }
    else if (hd){ close(); out += '<p><b>'+hd[1]+'</b></p>'; }
    else if (!l.trim()){ close(); }
    else { close(); out += '<p>'+l+'</p>'; }
  });
  close();
  return out;
}

async function sendChat(text){
  text = String(text || '').trim();
  if (!text || S.chatBusy) return;
  if (!(await ensureAiReady())) return;
  S.chatBusy = true;
  const thread = S.meta.chatThread || null;
  await recPut({type:'chat_message', thread, role:'user', text}, {silent:true});
  const ta = $('#chatText'); if (ta){ ta.value = ''; ta.style.height = 'auto'; }
  const log = $('#chatLog');
  const emptyHint = log && log.querySelector('p.tiny'); if (emptyHint) emptyHint.remove();
  log.insertAdjacentHTML('beforeend', chatBubble({role:'user', text}));
  log.insertAdjacentHTML('beforeend', '<div class="bubble ai" id="liveBubble"><span class="typing"><i></i><i></i><i></i></span></div>');
  window.scrollTo(0, document.body.scrollHeight);
  const live = $('#liveBubble');
  let shown = '';
  const cards = [];
  try {
    const ctx = await buildContext({today:true, pantry:true, recipes:true});
    const system = 'You are the kitchen and nutrition companion inside NutriLog, a personal food diary. ' + langInstruction() +
      ' Help with what to cook from the ingredients at home, what is missing, substitutions, meal prep and nutrition questions. Prefer recipes from the person\'s archive (show them with show_recipe). Never suggest anything from the hard exclusions. ' + recipeLangInstruction().replace('Write recipes', 'When you save a recipe with save_recipe, write it') + ' Keep answers short and practical; use lists for ingredients and steps. When the person mentions having, buying or running out of ingredients, call update_pantry.\n\n' + ctx;
    const hist = (await chatHistory()).filter(m => m.role === 'user' || m.role === 'assistant').slice(-20);
    let messages = [];
    hist.forEach(m => {
      const txt = (m.text || '').trim() || '…';
      const last = messages[messages.length - 1];
      if (last && last.role === m.role) last.content += '\n\n' + txt;
      else messages.push({role: m.role, content: txt});
    });
    /* the API needs the conversation to start with the person */
    while (messages.length && messages[0].role !== 'user') messages.shift();
    for (let round = 0; round < 4; round++){
      const msg = await claudeStream({
        model: S.prefs.models.chat, max_tokens: 2500,
        system: [{type:'text', text: system, cache_control:{type:'ephemeral'}}],
        tools: CHAT_TOOLS, messages
      }, (delta) => { shown += delta; live.innerHTML = mdLite(shown); });
      const tools = msg.content.filter(b => b.type === 'tool_use');
      if (msg.stop_reason !== 'tool_use' || !tools.length) break;
      messages.push({role:'assistant', content: msg.content
        .filter(b => b.type === 'tool_use' || (b.type === 'text' && (b.text || '').trim()))
        .map(b => b.type === 'text' ? {type:'text', text: b.text} : {type:'tool_use', id: b.id, name: b.name, input: b.input})});
      const results = [];
      for (const tu of tools){
        const res = await runChatTool(tu, cards);
        results.push({type:'tool_result', tool_use_id: tu.id, content: res});
      }
      messages.push({role:'user', content: results});
      shown += shown && !shown.endsWith('\n') ? '\n\n' : '';
    }
    await recPut({type:'chat_message', thread, role:'assistant', text: shown.trim() || '…', cards}, {silent:true});
    live.outerHTML = chatBubble({role:'assistant', text: shown.trim() || '…', cards});
    fillThumbs($('#chatLog'));
    /* pantry counts may have changed through a tool call */
    const pantry = await recByType('pantry_item');
    const chips = $$('.chatbar .chip');
    if (chips.length >= 2){
      chips[0].textContent = t('pt_chip', {n: pantry.filter(p => p.have).length});
      chips[1].textContent = t('pt_shop_chip', {n: pantry.filter(p => !p.have && p.toBuy).length});
    }
  } catch(err){
    live.outerHTML = '<div class="notice bad">'+esc(t('err_prefix'))+'<div class="verbatim">'+esc(String(err.message||err))+'</div></div>';
  }
  S.chatBusy = false;
  window.scrollTo(0, document.body.scrollHeight);
}

async function runChatTool(tu, cards){
  const log = $('#chatLog');
  const note = (txt) => { log.insertAdjacentHTML('beforeend', '<div class="cnote tiny">'+esc(txt)+'</div>'); recPut({type:'chat_message', thread: S.meta.chatThread || null, role:'note', text: txt}, {silent:true}); };
  try {
    if (tu.name === 'update_pantry'){
      const inp = tu.input || {};
      const items = await recByType('pantry_item');
      const find = n => items.find(p => fold(p.name) === fold(n));
      const done = [];
      for (const n of (inp.have || [])){ const p = find(n); if (p){ p.have = true; p.toBuy = false; await recPut(p); } else await recPut({type:'pantry_item', name: n, have: true, toBuy: false}); done.push('+' + n); }
      for (const n of (inp.ran_out || [])){ const p = find(n); if (p){ p.have = false; p.toBuy = true; await recPut(p); } else await recPut({type:'pantry_item', name: n, have: false, toBuy: true}); done.push('−' + n); }
      for (const n of (inp.remove || [])){ const p = find(n); if (p) await recDelete(p.id); done.push('×' + n); }
      note(t('ch_pantry_done', {list: done.join(', ')}));
      return 'Pantry updated: ' + done.join(', ');
    }
    if (tu.name === 'save_recipe'){
      const r = recipeFromAi(tu.input || {}, 'claude');
      await saveRecipe(r);
      cards.push(r.id);
      note(t('ch_recipe_saved', {t: r.title}));
      return 'Saved with id ' + r.id;
    }
    if (tu.name === 'show_recipe'){
      const id = (tu.input || {}).recipe_id;
      if (RECIPES.byId[id]){ cards.push(id); return 'Shown to the person as a card.'; }
      return 'No recipe with that id.';
    }
  } catch(err){ return 'Error: ' + String(err.message || err); }
  return 'Unknown tool';
}

    b += '<div class="ptrow"><span class="it">'+esc(p.name)+'</span>' +

  });

  const sheet = openSheet(esc(t(shopping ? 'pt_shop_h' : 'pt_h')), b,

  const add = async () => {
    const v = $('#ptNew').value.trim();
    if (!v) return;
    for (const n of v.split(',').map(x => x.trim()).filter(Boolean)){
      const ex = items.find(p => fold(p.name) === fold(n));
      if (ex){ ex.have = !shopping; ex.toBuy = !!shopping; await recPut(ex); }
      else await recPut({type:'pantry_item', name: n, have: !shopping, toBuy: !!shopping});
    }
    openPantry(shopping);
  };
  $('#ptAdd').addEventListener('click', add);
  $('#ptNew').addEventListener('keydown', e => { if (e.key === 'Enter') add(); });

    const p = items.find(x => x.id === b2.getAttribute('data-pt'));

    if (v === 'del') await recDelete(p.id);

    openPantry(shopping);
  });
  const cp = $('#ptCopy');
  if (cp) cp.addEventListener('click', async () => {
    const txt = list.map(p => '- ' + p.name).join('\n');
    try { await navigator.clipboard.writeText(txt); toast(t('copied')); } catch(e){ toast(txt, 6000); }
  });
  const bo = $('#ptBought');
  if (bo) bo.addEventListener('click', async () => {
    for (const p of list){ p.have = true; p.toBuy = false; await recPut(p); }
    openPantry(true);
  });
}

/* ---- review.js ---- */
/* ============================================================
   Weekly and monthly review. Everything is computed on the phone from
   the diary; Claude only writes the optional commentary.
   Honest by design: a nutrient is judged only when enough of what you
   ate has a known value for it (coverage), otherwise it says so.
   ============================================================ */

function periodRange(mode, anchor){
  const a = dateFromKey(anchor || localDateKey());
  if (mode === 'month'){
    const from = new Date(a.getFullYear(), a.getMonth(), 1, 12);
    const to = new Date(a.getFullYear(), a.getMonth() + 1, 0, 12);
    return {from: localDateKey(from), to: localDateKey(to), key: 'month:' + localDateKey(from).slice(0,7)};
  }
  const dow = (a.getDay() + 6) % 7; /* Monday first */
  const from = new Date(a); from.setDate(a.getDate() - dow);
  const to = new Date(from); to.setDate(from.getDate() + 6);
  return {from: localDateKey(from), to: localDateKey(to), key: 'week:' + localDateKey(from)};
}

function periodLabel(mode, r){
  const f = dateFromKey(r.from), tt = dateFromKey(r.to);
  if (mode === 'month') return new Intl.DateTimeFormat(locale(), {month:'long', year:'numeric'}).format(f);
  const o = {day:'numeric', month:'numeric'};
  return new Intl.DateTimeFormat(locale(), o).format(f) + ' – ' + new Intl.DateTimeFormat(locale(), o).format(tt);
}

async function periodData(mode, anchor){
  const r = periodRange(mode, anchor);
  const entries = await recByTypeDate('food_entry', r.from, r.to);
  const intakes = S.prefs.review.includeSupplements ? await recByTypeDate('supplement_intake', r.from, r.to) : [];
  const days = {};
  entries.forEach(e => {
    if (!days[e.date]) days[e.date] = {total:{}, known:{}, kcal:0};
    const d = days[e.date];
    const n = e.nutrients || {};
    nutAdd(d.total, n);
    const kc = n.kcal || 0;
    d.kcal += kc;
    NUT_KEYS.forEach(k => { if (n[k] != null) d.known[k] = (d.known[k] || 0) + kc; });
  });
  const logged = Object.keys(days).sort();
  const nDays = logged.length;
  const sum = {}, known = {};
  let kcalAll = 0;
  logged.forEach(dk => { nutAdd(sum, days[dk].total); kcalAll += days[dk].kcal; NUT_KEYS.forEach(k => { known[k] = (known[k]||0) + (days[dk].known[k]||0); }); });
  /* supplements count only on logged days, so they do not inflate averages */
  const suppSum = {};
  intakes.filter(i => days[i.date]).forEach(i => nutAdd(suppSum, i.nutrients));
  const avg = {}, cov = {};
  NUT_KEYS.forEach(k => {
    const s = (sum[k] || 0) + (suppSum[k] || 0);
    avg[k] = nDays ? s / nDays : null;
    cov[k] = kcalAll ? (known[k] || 0) / kcalAll : 0;
    if (suppSum[k]) cov[k] = Math.max(cov[k], 0.99);
  });
  avg.o3ld = nDays ? (((sum.epa||0) + (sum.dha||0) + (suppSum.epa||0) + (suppSum.dha||0)) * 1000) / nDays : null;
  cov.o3ld = Math.min(cov.epa || 0, cov.dha || 0);
  if (suppSum.epa || suppSum.dha) cov.o3ld = 0.99;
  const totalDays = Math.round((dateFromKey(r.to) - dateFromKey(r.from)) / 86400000) + 1;
  return {range: r, entries, intakes, days, logged, nDays, totalDays, avg, cov, suppSum};
}

function nutrientStatus(k, avg, cov, ref){
  const R = ref[k];
  if (!R || R.kind === 'info') return {st:'info'};
  if (avg == null) return {st:'nodata'};
  if (R.kind === 'range'){
    if (R.low == null) return {st:'info'};
    return {st: avg < R.low * 0.9 ? 'low' : avg > R.high * 1.1 ? 'high' : 'ok', pct: avg / ((R.low + R.high)/2)};
  }
  if (cov < 0.6 && R.kind === 'min') return {st:'nodata', pct: avg / R.v};
  const pct = avg / R.v;
  if (R.kind === 'min') return {st: pct < 0.5 ? 'low2' : pct < 0.8 ? 'low' : pct < 1 ? 'close' : 'ok', pct};
  if (R.kind === 'max') return {st: pct > 1 ? 'high' : pct > 0.9 ? 'near' : 'ok', pct};
  return {st:'info'};
}

const REVIEW_KEYS = ['fib','prot','sfa','na','o3ld','ala','k','ca','mg','fe','zn','se','iod','vita','vitd','vite','vitk','vitc','b1','b2','b3','b6','fol','b12','choline','p','cu','mn','sug','alc','caff'];

function contributors(P, k, limit){
  const by = {};
  P.entries.forEach(e => {
    const n = e.nutrients || {};
    const v = k === 'o3ld' ? ((n.epa||0)+(n.dha||0))*1000 : n[k];
    if (!v) return;
    by[e.name] = (by[e.name] || 0) + v;
  });
  return Object.keys(by).map(name => ({name, v: by[name]})).sort((a,b) => b.v - a.v).slice(0, limit || 5);
}

async function renderReview(){
  const host = $('#s-review');
  const mode = S.reviewMode;
  const P = await periodData(mode, S.reviewAnchor);
  const ref = referenceValues();
  let h = '<div class="seg" role="tablist">' +
    '<button type="button" class="'+(mode==='week'?'on':'')+'" data-act="rmode" data-v="week">'+esc(t('rv_week'))+'</button>' +
    '<button type="button" class="'+(mode==='month'?'on':'')+'" data-act="rmode" data-v="month">'+esc(t('rv_month'))+'</button></div>';
  h += '<div class="daynav" style="margin-top:12px"><button class="iconbtn sm" type="button" data-act="rnav" data-d="-1">'+icon('back')+'</button>' +
    '<span class="num">'+esc(periodLabel(mode, P.range))+'</span><button class="iconbtn sm flip" type="button" data-act="rnav" data-d="1">'+icon('back')+'</button></div>';
  if (!P.nDays){
    h += '<div class="card flat"><p class="muted">'+esc(t('rv_empty'))+'</p></div>';
    host.innerHTML = h; return;
  }
  const g = computeTargets(S.profile);
  h += '<div class="card"><p class="eyebrow">'+esc(t('rv_logged', {n: P.nDays, m: P.totalDays}))+'</p>' +
    '<div class="kv"><span class="k">'+esc(t('rv_avg_kcal'))+'</span><span class="v num">'+esc(fmtNum(P.avg.kcal))+' kcal'+(g ? ' <span class="tiny">('+fmtNum(g.low)+'–'+fmtNum(g.high)+')</span>' : '')+'</span></div>' +
    (g ? rangeBar(P.avg.kcal, g.low, g.high) : '');
  if (g){
    [['p','prot','macro_p'],['f','fat','macro_f'],['c','carb','macro_c']].forEach(([m,k,lab]) => {
      h += '<div class="kv"><span class="k">'+esc(t(lab))+'</span><span class="v num">'+esc(fmtNum(P.avg[k]))+' g <span class="tiny">('+fmtNum(g.macros[m].low)+'–'+fmtNum(g.macros[m].high)+')</span></span></div>' + rangeBar(P.avg[k], g.macros[m].low, g.macros[m].high);
    });
  }
  if (P.nDays < Math.min(4, P.totalDays)) h += '<div class="notice warn" style="margin-top:10px">'+esc(t('rv_few_days'))+'</div>';
  h += dailyChart(P, g) + '</div>';

  /* flags */
  const rows = REVIEW_KEYS.map(k => Object.assign({k, avg: P.avg[k], cov: P.cov[k]}, nutrientStatus(k, P.avg[k], P.cov[k], ref)));
  const lacking = rows.filter(r => r.st === 'low2' || r.st === 'low');
  const high = rows.filter(r => r.st === 'high');
  const nodata = rows.filter(r => r.st === 'nodata');
  h += '<div class="card"><h3>'+esc(t('rv_flags'))+'</h3>';
  if (!lacking.length && !high.length) h += '<p class="muted">'+esc(t('rv_all_ok'))+'</p>';
  if (lacking.length) h += '<p class="eyebrow" style="margin-top:8px">'+esc(t('rv_lacking'))+'</p>' + lacking.map(r => flagRow(r, ref)).join('');
  if (high.length) h += '<p class="eyebrow" style="margin-top:12px">'+esc(t('rv_high'))+'</p>' + high.map(r => flagRow(r, ref)).join('');
  if (nodata.length) h += '<p class="tiny" style="margin-top:10px">'+esc(t('rv_nodata', {list: nodata.map(r => nutLabel(r.k)).join(', ')}))+'</p>';
  h += '</div>';

  /* what to add / reduce */
  h += '<div id="rvAdd"></div>';
  if (high.length){

function dailyChart(P, g){
  const days = [];
  for (let k = P.range.from; k <= P.range.to; k = addDays(k, 1)) days.push(k);
  const vals = days.map(k => P.days[k] ? P.days[k].total.kcal || 0 : null);
  const max = Math.max(g ? g.high * 1.15 : 0, ...vals.filter(v => v != null), 1);
  const W = 320, H = 90, bw = W / days.length;
  let s = '<svg class="daychart" viewBox="0 0 '+W+' '+(H+14)+'" role="img" aria-label="'+esc(t('rv_chart'))+'">';
  if (g) s += '<rect x="0" y="'+(H - g.high/max*H)+'" width="'+W+'" height="'+((g.high-g.low)/max*H)+'" fill="var(--teal-soft)"/>';
  vals.forEach((v, i) => {
    if (v == null) return;
    const hgt = v / max * H;
    const cls = g ? (v < g.low ? 'var(--ochre)' : v > g.high ? 'var(--garnet)' : 'var(--teal)') : 'var(--teal)';
    s += '<rect x="'+(i*bw + bw*0.18)+'" y="'+(H - hgt)+'" width="'+(bw*0.64)+'" height="'+hgt+'" rx="2" fill="'+cls+'"/>';
  });
  if (days.length <= 7) days.forEach((k, i) => { s += '<text x="'+(i*bw + bw/2)+'" y="'+(H+11)+'" text-anchor="middle" font-size="8.5" fill="var(--ink3)">'+esc(new Intl.DateTimeFormat(locale(), {weekday:'short'}).format(dateFromKey(k)))+'</text>'; });
  return s + '</svg>';
}

/* ---- backup.js ---- */
/* ============================================================
   Export format, backup and restore.
   One shape, versioned (schema 2). Secrets are deliberately left out:
   a token that backs itself up into the repository it writes to is a
   bad idea, and an export file gets shared by accident.
   The archive recipes are not in the backup: they live in the archive
   (Google Drive and the data repository). Your own and Claude recipes are.
   ============================================================ */

const EXPORT_KV_KEYS = ['prefs'];

async function buildPayload(){
  const kv = (await dbAll('kv')).filter(r => EXPORT_KV_KEYS.indexOf(r.key) >= 0);
  const records = await dbAll('records');
  const recipes = (await dbAll('recipes')).filter(r => r.origin === 'claude' || r.origin === 'own').map(r => { const c = Object.assign({}, r); delete c._search; return c; });
  return {
    app: 'nutrilog',
    schema: SCHEMA,
    appVersion: VERSION,
    exportedAt: nowIso(),
    format: 'docs/DATA_FORMAT.md in the nutrilog repository',
    recordTypes: RECORD_TYPES,
    nutrients: NUTRIENTS.map(n => ({key: n.k, infoods: n.tag, unit: n.unit, en: n.en})),
    data: { kv, records, recipes }
  };
}

function payloadIsEmpty(p){
  if (p.schema === 1) return !(p.data.kv || []).some(r => r.key === 'profile' && r.value);
  return !(p.data.records || []).some(r => !r.deleted) && !(p.data.recipes || []).length;
}

function validatePayload(obj){
  if (!obj || obj.app !== 'nutrilog' || !obj.data || !Array.isArray(obj.data.kv)) return {ok:false, why:'file'};
  if (typeof obj.schema !== 'number') return {ok:false, why:'file'};
  if (obj.schema > SCHEMA) return {ok:false, why:'schema', n:obj.schema};
  return {ok:true};
}

async function applyPayload(obj){
  if (obj.schema === 1){
    /* a v0.1 backup: profile and weight history become records */
    await dbClear('records');
    for (const rec of obj.data.kv) if (rec.key === 'prefs') await dbPut('kv', rec);
    const prof = (obj.data.kv.find(r => r.key === 'profile') || {}).value;
    if (prof){
      const r = profileFromV1(prof);
      await recPut(r, {silent:true});
      await kvSet('profile', prof);
    }
    for (const h of (obj.data.profileHistory || [])){
      if (h.weight && h.savedAt) await recPut({type:'body_weight', date: localDateKey(new Date(h.savedAt)), kg: Number(h.weight), source:'profile'}, {silent:true});
    }
  } else {
    await dbClear('records');
    for (const rec of obj.data.kv) await dbPut('kv', rec);
    await dbPutMany('records', obj.data.records || []);
    const own = (await dbAll('recipes')).filter(r => r.origin === 'claude' || r.origin === 'own');
    for (const r of own) await dbDel('recipes', r.id);
    await dbPutMany('recipes', obj.data.recipes || []);
  }
  await loadState();
  await loadRecipes();
  applyTheme(); applyLang();
}

async function writeLocalSnapshot(){
  const payload = await buildPayload();
  if (payloadIsEmpty(payload)) return;
  await dbPut('snapshots', {date: localDateKey(), createdAt: nowIso(), payload});
  const all = await dbAll('snapshots');
  all.sort((a,b) => a.date < b.date ? 1 : -1);
  for (const s of all.slice(7)) await dbDel('snapshots', s.date);
}

async function exportManually(){
  const payload = await buildPayload();
  const text = JSON.stringify(payload, null, 2);
  const name = 'nutrilog-' + localDateKey() + '.json';
  const file = new File([text], name, {type:'application/json'});
  try {
    if (navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'NutriLog'});
      return;
    }
  } catch(e){
    if (e && e.name === 'AbortError') return;
  }
  const url = URL.createObjectURL(new Blob([text], {type:'application/json'}));
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 4000);
}

const GITHUB_API = 'https://api.github.com';
const BACKUP_LATEST = 'latest.json';
const BACKUP_SNAPDIR = 'snapshots/';

function parseRepo(){
  const raw = (S.prefs.backup.repo || '').trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/$/,'');
  const bits = raw.split('/');
  if (bits.length !== 2 || !bits[0] || !bits[1]) return null;
  return {owner: bits[0], repo: bits[1], full: bits[0]+'/'+bits[1]};
}

async function ghFetch(path, init){
  const res = await fetch(GITHUB_API + path, Object.assign({}, init, {
    headers: Object.assign({
      'Authorization': 'Bearer ' + S.secrets.github,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28'
    }, (init && init.headers) || {})
  }));
  let body = null;
  const txt = await res.text();
  try { body = txt ? JSON.parse(txt) : null; } catch(e){ body = {raw: txt}; }
  return {res, body, txt};
}

function ghErrorText(r){
  const msg = (r.body && (r.body.message || r.body.raw)) || r.txt || '';
  return r.res.status + ' ' + r.res.statusText + (msg ? ': ' + String(msg).slice(0,400) : '');
}

const BACKUP_TARGETS = {
  github: {
    id: 'github',
    label: 'GitHub',
    configured(){ return !!(S.secrets.github && parseRepo()); },
    describe(){ const r = parseRepo(); return r ? 'GitHub: ' + r.full : t('b_target_none'); },
    async getFile(path){
      const r = parseRepo();
      const q = '?ref=' + encodeURIComponent(S.prefs.backup.branch || 'main');
      const out = await ghFetch('/repos/'+r.owner+'/'+r.repo+'/contents/'+path+q);
      if (out.res.status === 404) return null;
      if (!out.res.ok) throw new Error(ghErrorText(out));
      return {sha: out.body.sha, text: out.body.content ? b64decode(out.body.content) : ''};
    },
    async putFile(path, text, message){
      const r = parseRepo();
      const url = '/repos/'+r.owner+'/'+r.repo+'/contents/'+path;
      const send = async (sha) => ghFetch(url, {
        method:'PUT',
        headers:{'content-type':'application/json'},
        body: JSON.stringify({
          message: message,
          content: b64encode(text),
          branch: S.prefs.backup.branch || 'main',
          sha: sha || undefined
        })
      });
      let existing = null;
      try { existing = await this.getFile(path); } catch(e){ existing = null; }
      let out = await send(existing ? existing.sha : null);
      /* 409 and 422 mean the file moved under us. Re-read and try once more,
         rather than giving up or overwriting blind. */
      if (out.res.status === 409 || out.res.status === 422){
        const again = await this.getFile(path);
        out = await send(again ? again.sha : null);
      }
      if (!out.res.ok) throw new Error(ghErrorText(out));
      return true;
    },
    async deleteFile(path){
      const r = parseRepo();
      const cur = await this.getFile(path);
      if (!cur) return true;
      const out = await ghFetch('/repos/'+r.owner+'/'+r.repo+'/contents/'+path, {
        method:'DELETE',
        headers:{'content-type':'application/json'},
        body: JSON.stringify({message:'NutriLog: remove write test', sha: cur.sha, branch: S.prefs.backup.branch || 'main'})
      });
      if (!out.res.ok) throw new Error(ghErrorText(out));
      return true;
    }
  }
};

function backupTarget(){ return BACKUP_TARGETS[S.prefs.backup.target] || BACKUP_TARGETS.github; }
function backupConfigured(){ return backupTarget().configured(); }

let backupTimer = null;
let backupAttempt = 0;

function scheduleBackup(reason){
  if (!backupConfigured()) { renderBackupBar(); return; }
  if (backupTimer) clearTimeout(backupTimer);
  S.meta.backup.state = 'pending';
  renderBackupBar(); renderBackupPanel();
  backupTimer = setTimeout(() => { backupTimer = null; runBackup(reason); }, 45000);
}

async function runBackup(reason, opts){
  opts = opts || {};
  if (!backupConfigured()){ renderBackupBar(); return {ok:false, why:'unconfigured'}; }
  const payload = await buildPayload();
  if (payloadIsEmpty(payload)){
    S.meta.backup.state = 'empty'; await saveMeta();
    renderBackupBar(); renderBackupPanel();
    return {ok:false, why:'empty'};
  }
  const hash = hashString(JSON.stringify(payload.data));
  if (hash === S.meta.backup.lastHash && S.meta.backup.lastVerifiedAt && !opts.force){
    S.meta.backup.lastVerifiedAt = new Date().toISOString();
    S.meta.backup.state = 'idle';
    await saveMeta(); renderBackupBar(); renderBackupPanel();
    return {ok:true, same:true};
  }
  if (!navigator.onLine){
    S.meta.backup.state = 'offline'; await saveMeta();
    renderBackupBar(); renderBackupPanel();
    return {ok:false, why:'offline'};
  }

  S.meta.backup.state = 'running';
  renderBackupBar(); renderBackupPanel();
  const text = JSON.stringify(payload, null, 2);
  const today = localDateKey();
  try {
    await backupTarget().putFile(BACKUP_LATEST, text, 'NutriLog backup ' + new Date().toISOString() + ' (' + (reason||'') + ')');
    if (S.meta.backup.lastSnapshotDate !== today){
      await backupTarget().putFile(BACKUP_SNAPDIR + today + '.json', text, 'NutriLog snapshot ' + today);
      S.meta.backup.lastSnapshotDate = today;
    }
    const now = new Date().toISOString();
    S.meta.backup.lastUploadAt = now;
    S.meta.backup.lastVerifiedAt = now;
    S.meta.backup.lastHash = hash;
    S.meta.backup.lastError = null;
    S.meta.backup.lastErrorAt = null;
    S.meta.backup.state = 'idle';
    backupAttempt = 0;
    await saveMeta(); renderBackupBar(); renderBackupPanel();
    return {ok:true};
  } catch(err){
    S.meta.backup.state = 'error';
    S.meta.backup.lastError = String(err && err.message ? err.message : err);
    S.meta.backup.lastErrorAt = new Date().toISOString();
    await saveMeta(); renderBackupBar(); renderBackupPanel();
    backupAttempt++;
    const wait = [120000, 600000, 1800000][Math.min(backupAttempt-1, 2)];
    if (backupTimer) clearTimeout(backupTimer);
    backupTimer = setTimeout(() => { backupTimer = null; runBackup('retry'); }, wait);
    return {ok:false, why:'error', error: S.meta.backup.lastError};
  }
}

function backupHoursStale(){
  if (!S.meta.backup.lastVerifiedAt) return Infinity;
  return (Date.now() - new Date(S.meta.backup.lastVerifiedAt).getTime()) / 3600000;
}

function renderBackupBar(){
  const bar = $('#backupBar');
  const b = S.meta.backup;
  const hasData = !!S.profile;
  let cls = 'bar', html = '';
  if (!backupConfigured()){
    if (hasData) cls += ' bad';
    html = '<div>' + esc(hasData ? t('bar_unconf_data') : t('bar_unconf_new')) + '</div>' +
      '<div class="btnrow"><button class="btn quiet" type="button" data-act="go-settings">'+esc(t('bar_setup'))+'</button>' +
      (hasData ? '<button class="btn quiet" type="button" data-act="export">'+esc(t('bar_export'))+'</button>' : '') + '</div>';
  } else if (backupHoursStale() > 48){
    cls += ' bad';
    const h = isFinite(backupHoursStale()) ? Math.floor(backupHoursStale()) : null;
    html = '<div>' + esc(h === null ? t('bar_unconf_data') : t('bar_stale', {h: h})) + '</div>' +
      (b.lastError ? '<div class="verbatim">'+esc(b.lastError)+'</div>' : '') +
      '<div class="btnrow"><button class="btn quiet" type="button" data-act="backup-now">'+esc(t('b_run_now'))+'</button>' +
      '<button class="btn quiet" type="button" data-act="export">'+esc(t('bar_export'))+'</button></div>';
  }
  bar.className = cls + (html ? '' : ' hide');
  bar.innerHTML = html;
}

  if (!okToGo){ toast(t('cancelled')); return false; }

}

function getPath(o, path){ return path.split('.').reduce((a,k) => a == null ? a : a[k], o); }
function setPath(o, path, value){
  const parts = path.split('.');
  let x = o;
  for (let i = 0; i < parts.length-1; i++){ if (x[parts[i]] == null) x[parts[i]] = {}; x = x[parts[i]]; }
  x[parts[parts.length-1]] = value;
}

function profileMissing(d){
  const miss = [];
  const P = d.person, G = d.goals;
  if (!P.sex) miss.push(t('p_sex'));
  if (!P.age) miss.push(t('p_age'));
  if (!P.heightCm) miss.push(t('p_height'));
  if (!P.weightKg) miss.push(t('p_weight'));
  const inRange = (v,a,b) => Number(v) >= a && Number(v) <= b;
  if (P.age && !inRange(P.age,10,100)) miss.push(t('p_age')+' (10 '+t('range_to')+' 100)');
  if (P.heightCm && !inRange(P.heightCm,100,250)) miss.push(t('p_height')+' (100 '+t('range_to')+' 250)');
  if (P.weightKg && !inRange(P.weightKg,30,300)) miss.push(t('p_weight')+' (30 '+t('range_to')+' 300)');
  if (G.macroSplit.preset === 'custom'){
    const sum = Number(G.macroSplit.proteinPct)+Number(G.macroSplit.fatPct)+Number(G.macroSplit.carbPct);
    if (sum !== 100) miss.push(t('ms_sum_err'));
  }
  return miss;
}

async function saveProfile(){
  const d = S.draft;
  const miss = profileMissing(d);
  if (miss.length){ toast(t('p_missing', {list: miss.join(', ')}), 5000); return; }
  const rec = deepCopy(d);
  ['age','heightCm','weightKg','activityLevel'].forEach(k => { rec.person[k] = rec.person[k] === '' || rec.person[k] == null ? null : Number(rec.person[k]); });
  ['proteinPct','fatPct','carbPct'].forEach(k => { rec.goals.macroSplit[k] = Number(rec.goals.macroSplit[k]); });
  SLOTS.forEach(s => { rec.goals.slots[s] = Number(rec.goals.slots[s]) || 0; });
  rec.kitchen.timeWeekday = Number(rec.kitchen.timeWeekday); rec.kitchen.timeWeekend = Number(rec.kitchen.timeWeekend);
  rec.kitchen.mealPrep.cookDaysPerWeek = Number(rec.kitchen.mealPrep.cookDaysPerWeek) || 0;
  rec.kitchen.mealPrep.batchServings = Number(rec.kitchen.mealPrep.batchServings) || 1;
  const prevWeight = S.profile && S.profile.person ? S.profile.person.weightKg : null;
  const prevAge = S.profile && S.profile.person ? S.profile.person.age : null;
  if (rec.person.age !== prevAge || !rec.person.ageRecordedOn) rec.person.ageRecordedOn = localDateKey();
  await recPut(rec);
  S.profile = rec;
  if (rec.person.weightKg !== prevWeight){
    const today = localDateKey();
    const w = (await recByTypeDate('body_weight', today, today))[0];
    if (w){ w.kg = rec.person.weightKg; await recPut(w); }
    else await recPut({type:'body_weight', date: today, kg: rec.person.weightKg, source:'profile'});
  }
  await writeLocalSnapshot();
  toast(t('p_saved'));
  S.draft = null;
  go('today');
}

function testOut(id, cls, msg, verbatim){
  const el = document.getElementById(id);

async function testAnthropic(){
  const fld = $('#k-anthropic');
  const key = String((fld ? fld.value : S.secrets.anthropic) || '');
  if (!key.trim()){ testOut('r-anthropic','warn', t('test_need_key')); return; }
  S.secrets.anthropic = key.trim(); await secretSet('anthropic', S.secrets.anthropic);
  testOut('r-anthropic','', t('test_running'));
  try {
    const body = await API.anthropic('/v1/models?limit=100', {method:'GET'});
    const ids = (body.data || []).map(m => m.id);
    let msg = t('anthropic_ok', {n: ids.length});
    const want = [S.prefs.models.chat, S.prefs.models.vision, S.prefs.models.analysis].filter((v,i,a) => a.indexOf(v) === i);
    const missing = want.filter(m => ids.indexOf(m) < 0 && !ids.some(id => id.indexOf(m) === 0));
    msg += ' ' + (missing.length ? t('m_check_bad', {list: missing.join(', ')}) : t('m_check_ok'));
    testOut('r-anthropic', missing.length ? 'warn' : 'good', msg);
  } catch(err){
    testOut('r-anthropic','bad', t('err_prefix'), String(err.message || err));
  }
}

function pagesRepoGuess(){
  const host = location.hostname;
  if (!/\.github\.io$/i.test(host)) return null;
  const user = host.replace(/\.github\.io$/i,'');
  const seg = location.pathname.split('/').filter(Boolean)[0];
  return {owner: user, repo: seg || host};
}

async function testGithub(){
  const fldK = $('#k-github'), fldR = $('#k-repo'), fldB = $('#k-branch');
  const key = String((fldK ? fldK.value : S.secrets.github) || '');
  if (fldR) S.prefs.backup.repo = String(fldR.value || '').trim();
  if (fldB && String(fldB.value || '').trim()) S.prefs.backup.branch = String(fldB.value).trim();
  S.secrets.github = key.trim();
  await secretSet('github', S.secrets.github);
  await savePrefs();
  const r = parseRepo();
  if (!S.secrets.github || !r){ testOut('r-github','warn', t('test_need_repo')); return; }
  testOut('r-github','', t('test_running'));
  const lines = [];
  let worst = 'good';
  try {
    const info = await ghFetch('/repos/'+r.owner+'/'+r.repo);
    if (!info.res.ok) throw new Error(ghErrorText(info));
    if (info.body.private) lines.push(t('repo_private_ok'));
    else { lines.push(t('repo_public_warn')); worst = 'bad'; }
    const pages = pagesRepoGuess();
    if (pages && pages.owner.toLowerCase() === r.owner.toLowerCase() && pages.repo.toLowerCase() === r.repo.toLowerCase()){
      lines.push(t('repo_is_pages_warn')); worst = 'bad';
    }
    await backupTarget().putFile('nutrilog-write-test.txt', 'NutriLog write test ' + new Date().toISOString() + '\n', 'NutriLog: write test');
    lines.push(t('write_ok'));
    try { await backupTarget().deleteFile('nutrilog-write-test.txt'); }
    catch(e){ lines.push(t('delete_fail')); if (worst === 'good') worst = 'warn'; }
    const existing = await backupTarget().getFile(BACKUP_LATEST);
    if (existing && !S.profile) lines.push(t('b_restore_cloud') + ': ' + BACKUP_LATEST);
    testOut('r-github', worst, lines.join(' '));
  } catch(err){
    testOut('r-github','bad', t('write_fail'), String(err.message || err));
  }
  renderBackupBar();
}
