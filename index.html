/* ---------- tokens ---------- */
:root{
  --bg:#F2EADC;
  --bg2:#E9DFCC;
  --card:#FCF8EF;
  --card2:#F6EFE1;
  --ink:#2B2620;
  --ink2:#6E6353;
  --ink3:#8C816F;
  --line:#E0D3BC;
  --line2:#D2C2A6;
  --teal:#2F6F6A;
  --teal-soft:#DCE9E5;
  --garnet:#8C3B4A;
  --garnet-soft:#F2E0E1;
  --ochre:#A8762A;
  --ochre-soft:#F3E7CE;
  --indigo:#3D4E7A;
  --olive:#5C6B3C;
  --onaccent:#FCF8EF;
  --shadow:0 1px 2px rgba(60,44,20,.06), 0 6px 18px rgba(60,44,20,.07);
  --shadow-lift:0 2px 4px rgba(60,44,20,.08), 0 12px 30px rgba(60,44,20,.10);
  --r:18px; --r-sm:12px; --r-lg:26px;
  --maxw:600px;
  --tap:46px;
}
html[data-theme="dark"]{
  --bg:#17150F;
  --bg2:#100E0A;
  --card:#221F18;
  --card2:#2A261D;
  --ink:#F0E7D6;
  --ink2:#AEA28C;
  --ink3:#8B8171;
  --line:#38322A;
  --line2:#4A4238;
  --teal:#7CBFB3;
  --teal-soft:#1E2E2B;
  --garnet:#D9909B;
  --garnet-soft:#2E1F22;
  --ochre:#D8A85E;
  --ochre-soft:#2C2418;
  --indigo:#93A4D2;
  --olive:#A2B278;
  --onaccent:#17150F;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
  --shadow-lift:0 2px 4px rgba(0,0,0,.45), 0 12px 30px rgba(0,0,0,.45);
}
@media (prefers-color-scheme: dark){
  html[data-theme="device"]{
    --bg:#17150F; --bg2:#100E0A; --card:#221F18; --card2:#2A261D;
    --ink:#F0E7D6; --ink2:#AEA28C; --ink3:#8B8171;
    --line:#38322A; --line2:#4A4238;
    --teal:#7CBFB3; --teal-soft:#1E2E2B;
    --garnet:#D9909B; --garnet-soft:#2E1F22;
    --ochre:#D8A85E; --ochre-soft:#2C2418;
    --indigo:#93A4D2; --olive:#A2B278; --onaccent:#17150F;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
    --shadow-lift:0 2px 4px rgba(0,0,0,.45), 0 12px 30px rgba(0,0,0,.45);
  }
}

/* ---------- base ---------- */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-size:16px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overflow-wrap:break-word;
}
h1,h2,h3{font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif;font-weight:600;letter-spacing:.01em;margin:0}
h1{font-size:clamp(26px,7.5vw,32px);line-height:1.15}
h2{font-size:23px;line-height:1.2}
h3{font-size:19px;line-height:1.25}
p{margin:0 0 12px}
p:last-child{margin-bottom:0}
a{color:var(--teal)}
:focus-visible{outline:2px solid var(--ochre);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums lining-nums}

/* ---------- layout ---------- */
#app{max-width:var(--maxw);margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar .brand{flex:1;display:flex;align-items:center;gap:9px;min-width:0}
.topbar h1{font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brandmark{width:20px;height:20px;flex:none;border-radius:50%;border:1.5px solid var(--ochre);position:relative}
.brandmark::after{content:"";position:absolute;left:50%;top:52%;width:9px;height:5px;transform:translate(-50%,-50%);background:var(--teal);border-radius:0 0 9px 9px}
main{flex:1;padding:16px 14px calc(96px + env(safe-area-inset-bottom))}
.screen{display:none;animation:fade .18s ease-out}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}

/* ---------- bottom nav ---------- */
#tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:grid;grid-template-columns:repeat(5,1fr);
  gap:2px;
  padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  background:color-mix(in srgb, var(--bg2) 92%, transparent);
  backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
}
#tabbar .tab{
  background:none;border:0;cursor:pointer;color:var(--ink3);
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:7px 2px 5px;border-radius:14px;font-family:inherit;font-size:11px;font-weight:500;
  min-height:var(--tap);letter-spacing:.01em;
}
#tabbar .tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#tabbar .tab[aria-current="page"]{color:var(--teal);background:var(--teal-soft)}
#tabbar .tab .dot{width:4px;height:4px;border-radius:50%;background:var(--ochre);opacity:0}
#tabbar .tab[aria-current="page"] .dot{opacity:1}

/* ---------- cards, ornament ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin:0 0 14px;box-shadow:var(--shadow);
}
.card.flat{box-shadow:none;background:var(--card2)}
.card > h2, .card > h3{margin-bottom:8px}
.orn{display:flex;align-items:center;gap:10px;margin:20px 2px}
.orn i{width:7px;height:7px;transform:rotate(45deg);background:var(--ochre);opacity:.75;flex:none}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:linear-gradient(to right,transparent,var(--line2),transparent)}
.eyebrow{
  font-size:11.5px;font-weight:500;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink3);margin:0 0 6px;
}
.muted{color:var(--ink2);font-size:14.5px}
.tiny{font-size:13px;color:var(--ink2);line-height:1.5}

/* ---------- buttons ---------- */
button{font-family:inherit}
button svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.btn svg{width:18px;height:18px;flex:none}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:var(--tap);padding:11px 18px;border-radius:999px;
  border:1px solid var(--teal);background:var(--teal);color:var(--onaccent);
  font-size:15.5px;font-weight:500;cursor:pointer;text-decoration:none;
}
.btn.ghost{background:transparent;color:var(--teal)}
.btn.quiet{background:var(--card2);border-color:var(--line2);color:var(--ink)}
.btn.danger{background:var(--garnet);border-color:var(--garnet);color:var(--onaccent)}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btnrow{display:flex;flex-wrap:wrap;gap:9px}
.iconbtn{
  width:var(--tap);height:var(--tap);min-width:var(--tap);border-radius:50%;
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;
}
.iconbtn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.linkbtn{background:none;border:0;color:var(--teal);text-decoration:underline;text-underline-offset:3px;
  cursor:pointer;font-size:14.5px;padding:8px 0;min-height:38px}

/* ---------- forms ---------- */
.field{margin:0 0 16px}
.field > label, .flabel{display:block;font-size:13.5px;font-weight:500;color:var(--ink2);margin:0 0 6px;letter-spacing:.02em}
input[type=text],input[type=number],input[type=password],select,textarea{
  width:100%;min-height:var(--tap);padding:11px 13px;
  background:var(--card);color:var(--ink);
  border:1px solid var(--line2);border-radius:var(--r-sm);
  font-family:inherit;font-size:16px;
}
textarea{min-height:82px;resize:vertical;line-height:1.5}
input::placeholder,textarea::placeholder{color:var(--ink3);opacity:.85}
.opts{display:grid;gap:8px}
.opts.two{grid-template-columns:1fr 1fr}
.opts.three{grid-template-columns:repeat(3,1fr)}
.opt{
  display:flex;gap:10px;align-items:flex-start;
  border:1px solid var(--line2);background:var(--card);border-radius:var(--r-sm);
  padding:12px;cursor:pointer;min-height:var(--tap);
}
.opt input{position:absolute;opacity:0;width:0;height:0}
.opt .mark{
  width:19px;height:19px;flex:none;margin-top:1px;border-radius:50%;
  border:1.5px solid var(--line2);position:relative;background:var(--bg);
}
.opt.sq .mark{border-radius:6px}
.opt .txt{flex:1;min-width:0}
.opt .t1{font-size:15px;font-weight:500;display:block}
.opt .t2{font-size:13px;color:var(--ink2);display:block;margin-top:2px;line-height:1.45}
.opt:has(input:checked){border-color:var(--teal);background:var(--teal-soft)}
.opt:has(input:checked) .mark{border-color:var(--teal);background:var(--teal)}
.opt:has(input:checked) .mark::after{
  content:"";position:absolute;inset:0;margin:auto;width:7px;height:7px;border-radius:50%;background:var(--card)
}
.opt.sq:has(input:checked) .mark::after{
  width:5px;height:9px;border-radius:0;background:none;margin-top:2px;
  border:solid var(--card);border-width:0 2px 2px 0;transform:rotate(42deg)
}
.opt:has(input:focus-visible){outline:2px solid var(--ochre);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  border:1px solid var(--line2);background:var(--card);color:var(--ink);
  border-radius:999px;padding:8px 13px;font-size:14px;cursor:pointer;min-height:40px;
  display:inline-flex;align-items:center;gap:6px;font-family:inherit;
}
.chip[aria-pressed="true"]{background:var(--teal-soft);border-color:var(--teal);color:var(--teal)}
.chip.add{border-style:dashed;color:var(--ink2)}
.inline{display:flex;gap:9px;align-items:flex-start}
.inline > *{flex:1}
.inline > .none{flex:none}

/* ---------- range band (signature) ---------- */
.band{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 16px 12px;box-shadow:var(--shadow-lift);margin-bottom:14px}
.band .val{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(30px,10vw,42px);line-height:1.05;font-weight:600}
.band .val .to{font-size:.55em;color:var(--ink2);padding:0 .18em;font-family:'DM Sans',sans-serif;font-weight:400}
.band .unit{font-size:.42em;color:var(--ink2);font-family:'DM Sans',sans-serif;font-weight:400;padding-left:.25em}
.bandsvg{width:100%;height:74px;display:block;margin:6px 0 2px}
.macro{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.macro .m{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 10px;text-align:center}
.macro .m .k{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.macro .m .v{font-size:17px;font-weight:500;margin-top:3px;white-space:nowrap}
.macro .m .u{font-size:12px;color:var(--ink2)}
.macro .m.p{border-bottom:2px solid var(--teal)}
.macro .m.f{border-bottom:2px solid var(--ochre)}
.macro .m.c{border-bottom:2px solid var(--indigo)}

/* ---------- status / notices ---------- */
.notice{
  border-radius:var(--r-sm);padding:12px 13px;font-size:14px;line-height:1.5;
  border:1px solid var(--line2);background:var(--card2);margin:0 0 12px;
}
.notice.warn{border-color:var(--ochre);background:var(--ochre-soft)}
.notice.bad{border-color:var(--garnet);background:var(--garnet-soft)}
.notice.good{border-color:var(--teal);background:var(--teal-soft)}
.notice b{font-weight:500}
.bar{
  margin:0 14px 6px;padding:12px 14px;border-radius:var(--r-sm);
  border:1px solid var(--ochre);background:var(--ochre-soft);font-size:14px;
}
.bar.bad{border-color:var(--garnet);background:var(--garnet-soft)}
.bar .btnrow{margin-top:10px}
.verbatim{
  margin-top:8px;padding:10px 11px;border-radius:8px;
  background:var(--bg2);border:1px solid var(--line);
  font-size:13px;line-height:1.45;white-space:pre-wrap;word-break:break-word;
  max-height:230px;overflow:auto;
}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--ink2);font-size:14px}
.kv .v{font-size:14.5px;text-align:right;font-weight:500;min-width:0;overflow-wrap:anywhere}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px;border-radius:999px;
  border:1px solid var(--line2);background:var(--card2);color:var(--ink2)}
.pill.ok{border-color:var(--teal);color:var(--teal);background:var(--teal-soft)}
.pill.err{border-color:var(--garnet);color:var(--garnet);background:var(--garnet-soft)}
.pill.wait{border-color:var(--ochre);color:var(--ochre);background:var(--ochre-soft)}

/* ---------- soon screens ---------- */
.soonwrap{text-align:center;padding:34px 8px}
.soonwrap .glyph{width:64px;height:64px;margin:0 auto 14px;border-radius:50%;
  border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;color:var(--ink3)}
.soonwrap .glyph svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.soonwrap h2{margin-bottom:8px}
.soonwrap p{color:var(--ink2);font-size:15px;max-width:36ch;margin-left:auto;margin-right:auto}
.phasetag{display:inline-block;margin-bottom:12px;font-size:11.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ochre);border:1px solid var(--ochre);border-radius:999px;padding:3px 11px}

/* ---------- sheet + toast ---------- */
.sheetbg{position:fixed;inset:0;z-index:60;background:rgba(30,22,10,.42);display:flex;align-items:flex-end;justify-content:center}
.sheet{
  width:100%;max-width:var(--maxw);max-height:88dvh;overflow:auto;
  background:var(--bg);border-radius:var(--r-lg) var(--r-lg) 0 0;
  border-top:1px solid var(--line);padding:18px 16px calc(20px + env(safe-area-inset-bottom));
  animation:up .2s ease-out;
}
@keyframes up{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
.sheet h2{margin-bottom:10px}
.sheet .close{position:absolute;right:14px;top:-52px}
.sheethead{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px}
.sheethead h2{flex:1}
ol.reasons{margin:0;padding-left:20px}
ol.reasons li{margin-bottom:11px;font-size:14.5px;line-height:1.55}
#toast{
  position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);
  z-index:70;background:var(--ink);color:var(--bg);padding:11px 17px;border-radius:999px;
  font-size:14px;max-width:min(92vw,var(--maxw));text-align:center;box-shadow:var(--shadow-lift);
}
.hide{display:none !important}


/* ---------- v0.2 components ---------- */
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--bg2);border:1px solid var(--line)}
.seg button{flex:1;min-height:40px;border:0;border-radius:999px;background:transparent;color:var(--ink2);font:inherit;font-size:14.5px;font-weight:500;cursor:pointer;padding:6px 8px}
.seg button.on{background:var(--card);color:var(--teal);box-shadow:var(--shadow)}
.seg.small{margin-top:4px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.seg.small button{font-size:13px;min-height:36px;padding:4px 10px;flex:0 0 auto}
.scrollx{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-right:-14px;padding-right:14px}
.scrollx .chip{flex:0 0 auto}
.iconbtn.sm{width:38px;height:38px;min-width:38px;font-size:20px;line-height:1}
.iconbtn.sm svg{width:18px;height:18px}
.flip svg{transform:rotate(180deg)}

.daynav{display:flex;align-items:center;gap:10px;justify-content:space-between;margin:0 0 12px}
.daynav > span,.datepick{flex:1;text-align:center;font-weight:500}
.datepick{position:relative;cursor:pointer}
.datepick input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.totals{display:flex;flex-direction:column;gap:2px}

.rbar{position:relative;height:8px;border-radius:99px;background:var(--bg2);overflow:hidden;margin:6px 0 2px}
.rzone{position:absolute;top:0;bottom:0;background:var(--teal-soft);border-left:1.5px solid var(--teal);border-right:1.5px solid var(--teal)}
.rfill{position:absolute;left:0;top:2px;bottom:2px;border-radius:99px;background:var(--teal);opacity:.9}
.rfill.warn{background:var(--ochre)} .rfill.bad{background:var(--garnet)}
.band .val .unit{font-size:.42em}
.macro .m .rbar{margin-top:8px}

.rowbtn{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 2px;font:inherit;color:var(--ink);cursor:pointer;text-align:left;min-height:var(--tap)}
.rowbtn:last-child{border-bottom:0}
.rowbtn .k{flex:1;font-weight:500}
.rowbtn .plus{width:28px;height:28px;border-radius:50%;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;color:var(--teal);font-size:18px}

.entry{display:grid;grid-template-columns:1fr auto;grid-template-areas:"n k" "m m";gap:2px 12px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:10px 2px;font:inherit;color:var(--ink);text-align:left;cursor:pointer}
.entry .en{grid-area:n;font-weight:500;min-width:0;line-height:1.35}
.entry .ek{grid-area:k;text-align:right;font-weight:500;white-space:nowrap}
.entry .em{grid-area:m;color:var(--ink2)}
.ing.supp input:checked ~ .it{color:var(--teal);text-decoration:none}

.frow{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;margin:0 0 7px;font:inherit;color:var(--ink);cursor:pointer}
.frow .fn{font-weight:500;line-height:1.35}
.frow .fm{color:var(--ink2)}

.rlist{display:flex;flex-direction:column;gap:9px}
.rcard{display:flex;gap:12px;align-items:stretch;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;font:inherit;color:var(--ink);cursor:pointer;box-shadow:var(--shadow)}
.rthumb{flex:none;width:74px;height:74px;border-radius:12px;background:linear-gradient(135deg,var(--teal-soft),var(--ochre-soft));background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:var(--teal);font-family:'Cormorant Garamond',Georgia,serif;font-size:30px;font-weight:600}
.rthumb.has span,.rhero.has span{display:none}
.rbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.rtitle{font-weight:500;line-height:1.3}
.rmeta{font-size:13px;color:var(--ink2)}
.rextra{font-size:12.5px;color:var(--teal)}
.rtags{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.rtags .pill{font-size:11px;padding:2px 7px}
.star{color:var(--ochre)}
.btn svg,label.btn svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.rhero.has{height:220px}
.rhero{height:96px;border-radius:var(--r-lg);background:linear-gradient(135deg,var(--teal-soft),var(--ochre-soft));background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:var(--teal);font-family:'Cormorant Garamond',Georgia,serif;font-size:64px}
.kvgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kvgrid > div{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 10px;display:flex;flex-direction:column;gap:1px}
.kvgrid .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.kvgrid .v{font-weight:500}
.stepper{display:flex;align-items:center;gap:8px}
.ing{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.ing:last-child{border-bottom:0}
.ing input{width:18px;height:18px;flex:none;accent-color:var(--teal);transform:translateY(3px)}
.ing .q{flex:none;min-width:64px;font-weight:500;color:var(--teal)}
.ing .it{flex:1}
.ing input:checked ~ .it{color:var(--ink3);text-decoration:line-through}
.ptrow{display:flex;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.ptrow .it{flex:1}
.ptrow .chip{min-height:34px;padding:5px 10px}
ol.steps{margin:0;padding-left:22px}
ol.steps li{margin-bottom:10px;line-height:1.55}
ul.tips{margin:6px 0 0;padding-left:20px}
ul.tips li{margin-bottom:6px}
.src{padding:6px 0;border-bottom:1px solid var(--line)}
.src:last-child{border-bottom:0}
details summary{cursor:pointer}
.ntable .kv{padding:6px 0}

.scanbox{position:relative;border-radius:var(--r);overflow:hidden;background:#000;aspect-ratio:4/3}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanline{position:absolute;left:10%;right:10%;top:50%;height:2px;background:var(--garnet);box-shadow:0 0 12px var(--garnet)}
.phimg{width:100%;max-height:220px;object-fit:contain;border-radius:var(--r);background:var(--bg2);margin-bottom:12px}
.fit{display:inline-flex;align-items:center;justify-content:center;min-width:52px;height:36px;border-radius:999px;font-weight:600;font-size:15px;border:1.5px solid}
.fit.ok{color:var(--teal);border-color:var(--teal);background:var(--teal-soft)}
.fit.wait{color:var(--ochre);border-color:var(--ochre);background:var(--ochre-soft)}
.fit.err{color:var(--garnet);border-color:var(--garnet);background:var(--garnet-soft)}

.flag{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:10px;margin-bottom:6px;font-size:14px}
.flag .v{text-align:right}
.flag.lo{background:var(--ochre-soft)} .flag.lo2{background:var(--garnet-soft)} .flag.hi{background:var(--garnet-soft)}
.daychart{width:100%;height:auto;display:block;margin-top:12px}
.nrow{padding:4px 0 8px;border-bottom:1px solid var(--line)}
.aitext p{margin:0 0 8px}
.aitext ul,.aitext ol{margin:0 0 8px;padding-left:20px}

/* chat */
.chatbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chatlog{display:flex;flex-direction:column;gap:8px;padding-bottom:10px}
.bubble{max-width:88%;padding:10px 13px;border-radius:16px;font-size:15px;line-height:1.5;border:1px solid var(--line)}
.bubble p{margin:0 0 6px} .bubble p:last-child{margin:0}
.bubble ul,.bubble ol{margin:4px 0 6px;padding-left:20px}
.bubble.me{align-self:flex-end;background:var(--teal);color:var(--onaccent);border-color:var(--teal);border-bottom-right-radius:5px}
.bubble.ai{align-self:flex-start;background:var(--card);border-bottom-left-radius:5px}
.cnote{align-self:center;color:var(--ink3);background:var(--bg2);border-radius:999px;padding:4px 12px}
.typing{display:inline-flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink3);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s} .typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.chatin{position:sticky;bottom:calc(66px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:flex-end;padding:8px 0;background:var(--bg)}
.chatin textarea{min-height:46px;max-height:160px;resize:none}
.chatin .btn{flex:none;width:46px;padding:0}
#chatQuick{margin:4px 0}

/* on a computer the tab bar keeps the app's width */
@media (min-width: 660px){
  #tabbar{left:50%;right:auto;width:var(--maxw);transform:translateX(-50%);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0}
}

/* floating add button */
.fab{position:fixed;right:max(16px, calc(50% - var(--maxw)/2 + 16px));bottom:calc(78px + env(safe-area-inset-bottom));z-index:45;width:58px;height:58px;border-radius:50%;border:0;background:var(--teal);color:var(--onaccent);box-shadow:var(--shadow-lift);font-size:30px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.fabgrid{display:flex;flex-direction:column;gap:8px}
.fabgrid .btn{justify-content:flex-start}

.sheet{position:relative}
.sheet.tall{min-height:70dvh}
.sheetfoot{margin-top:16px;position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom));background:var(--bg);padding:10px 0 4px}
select{appearance:auto}
input[type=search],input[type=date]{width:100%;min-height:var(--tap);padding:11px 13px;background:var(--card);color:var(--ink);border:1px solid var(--line2);border-radius:var(--r-sm);font-family:inherit;font-size:16px}

</style>
</head>

/* ---- core.js ---- */
/* ============================================================
   NutriLog core: helpers, storage, records, state, migration,
   nutrient vocabulary, reference values, goal engine.
   Plain browser JavaScript, no build step beyond concatenation.
   ============================================================ */

/* ---------- 1. Small helpers ---------- */

const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function t(key, vars){
  const table = STR[S.lang] || STR.en;
  let s = table[key];
  if (s === undefined) s = (STR.en[key] !== undefined ? STR.en[key] : key);
  if (vars) for (const k in vars) s = s.split('{'+k+'}').join(String(vars[k]));
  return s;
}

/* Pick the Czech or English half of a {cs, en} pair. */
function L(obj){
  if (!obj) return '';
  if (typeof obj === 'string') return obj;
  return obj[S.lang] || obj.en || obj.cs || '';
}

function icon(name, cls){
  return '<svg class="'+(cls||'')+'" aria-hidden="true"><use href="#i-'+name+'"/></svg>';
}

function locale(){ return S.lang === 'cs' ? 'cs-CZ' : 'en-GB'; }

function fmtNum(n, digits){
  if (n == null || !isFinite(n)) return '–';
  return new Intl.NumberFormat(locale(), {maximumFractionDigits: digits == null ? 0 : digits}).format(n);
}

/* Smart rounding for nutrient amounts: fewer decimals for bigger numbers. */
function fmtAmt(n){
  if (n == null || !isFinite(n)) return '–';
  const a = Math.abs(n);
  if (a >= 100) return fmtNum(n, 0);
  if (a >= 10) return fmtNum(n, 1);
  if (a >= 1) return fmtNum(n, 1);
  if (a === 0) return '0';
  return fmtNum(n, 2);
}

function fmtDateTime(iso){
  if (!iso) return t('never');
  try {
    return new Intl.DateTimeFormat(locale(), {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}).format(new Date(iso));
  } catch(e){ return iso; }
}

function fmtLongDate(d){
  return new Intl.DateTimeFormat(locale(), {weekday:'long', day:'numeric', month:'long'}).format(d);
}

function fmtShortDate(key){
  const d = dateFromKey(key);
  return new Intl.DateTimeFormat(locale(), {weekday:'short', day:'numeric', month:'numeric'}).format(d);
}

function ago(iso){
  if (!iso) return t('never');
  const mins = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 2) return t('just_now');
  if (mins < 60) return t('ago_min', {n: mins});
  const h = Math.floor(mins/60);
  if (h < 48) return t('ago_hour', {n: h});
  return t('ago_day', {n: Math.floor(h/24)});
}

/* Local calendar date, not UTC. The phone is in Prague; a date taken
   from UTC would jump a day every evening. */
function localDateKey(d){
  const x = d || new Date();
  const p = n => String(n).padStart(2,'0');
  return x.getFullYear()+'-'+p(x.getMonth()+1)+'-'+p(x.getDate());
}
function dateFromKey(key){
  const [y,m,d] = key.split('-').map(Number);
  return new Date(y, m-1, d, 12, 0, 0);
}
function addDays(key, n){
  const d = dateFromKey(key); d.setDate(d.getDate()+n); return localDateKey(d);
}
function localTime(d){
  const x = d || new Date();
  const p = n => String(n).padStart(2,'0');
  return p(x.getHours())+':'+p(x.getMinutes());
}
/* ISO 8601 with the local offset, e.g. 2026-09-21T14:03:11+02:00.
   Other apps reading the data get both the instant and the wall clock. */
function nowIso(d){
  const x = d || new Date();
  const p = n => String(Math.floor(Math.abs(n))).padStart(2,'0');
  const off = -x.getTimezoneOffset();
  const sign = off >= 0 ? '+' : '-';
  return localDateKey(x)+'T'+p(x.getHours())+':'+p(x.getMinutes())+':'+p(x.getSeconds())+
    sign+p(off/60)+':'+p(off%60);
}

/* UTF-8 safe base64. btoa alone throws on Czech diacritics. */
function b64encode(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  const step = 0x8000;
  for (let i = 0; i < bytes.length; i += step){
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i+step));
  }
  return btoa(bin);
}
function b64decode(b64){
  const bin = atob(String(b64).replace(/\s/g,''));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

/* Cheap stable hash, used only to notice that nothing changed. */
function hashString(str){
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++){
    h ^= str.charCodeAt(i);
    h = (h + ((h<<1)+(h<<4)+(h<<7)+(h<<8)+(h<<24))) >>> 0;
  }
  return h.toString(16);
}

/* Time sortable unique id (ULID layout: 10 chars time, 16 chars random).
   Safe to merge between devices and apps without collisions. */
const ULID_CHARS = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
function ulid(){
  let ts = Date.now(), timePart = '';
  for (let i = 0; i < 10; i++){ timePart = ULID_CHARS[ts % 32] + timePart; ts = Math.floor(ts / 32); }
  const rnd = new Uint8Array(16);
  crypto.getRandomValues(rnd);
  let r = '';
  for (let i = 0; i < 16; i++) r += ULID_CHARS[rnd[i] % 32];
  return timePart + r;
}

/* Strip diacritics and lowercase, for search. */
function fold(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
}

function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
function round1(n){ return Math.round(n*10)/10; }
function deepCopy(o){ return o == null ? o : JSON.parse(JSON.stringify(o)); }
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

function toast(msg, ms){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.remove('hide');
  clearTimeout(toast._tm);
  toast._tm = setTimeout(() => el.classList.add('hide'), ms || 3200);
}

/* ---------- 2. Storage. IndexedDB, schema 2 ----------
   kv              prefs, meta (app settings, not shared data)
   secrets         API keys. Never exported, never backed up.
   records         all personal data as typed records (see RECORD TYPES)
   recipes         recipe records: archive, starter, own and Claude recipes
   media           small images (photo thumbnails, recipe thumbnails)
   profileHistory  legacy from schema 1, kept read only
   snapshots       rolling daily copies kept on the device
   ------------------------------------------------------ */

const DB_NAME = 'nutrilog';
const DB_VERSION = 2;
let _db = null;

function openDB(){
  if (_db) return Promise.resolve(_db);
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      const txu = req.transaction;
      if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv', {keyPath:'key'});
      if (!db.objectStoreNames.contains('secrets')) db.createObjectStore('secrets', {keyPath:'key'});
      if (!db.objectStoreNames.contains('profileHistory')) db.createObjectStore('profileHistory', {keyPath:'id', autoIncrement:true});
      if (!db.objectStoreNames.contains('snapshots')) db.createObjectStore('snapshots', {keyPath:'date'});
      let rec;
      if (!db.objectStoreNames.contains('records')) rec = db.createObjectStore('records', {keyPath:'id'});
      else rec = txu.objectStore('records');
      if (!rec.indexNames.contains('type')) rec.createIndex('type', 'type');
      if (!rec.indexNames.contains('type_date')) rec.createIndex('type_date', ['type','date']);
      if (!db.objectStoreNames.contains('recipes')) db.createObjectStore('recipes', {keyPath:'id'});
      if (!db.objectStoreNames.contains('media')) db.createObjectStore('media', {keyPath:'id'});
    };
    req.onsuccess = () => {
      _db = req.result;
      _db.onversionchange = () => { try { _db.close(); } catch(e){} _db = null; };
      resolve(_db);
    };
    req.onerror = () => reject(req.error);
    req.onblocked = () => toast(t('db_blocked'), 8000);
  });
}

function tx(store, mode){
  return openDB().then(db => db.transaction(store, mode).objectStore(store));
}
function reqp(r){
  return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
}
async function dbGet(store, key){ return reqp((await tx(store,'readonly')).get(key)); }
async function dbAll(store){ return reqp((await tx(store,'readonly')).getAll()); }
async function dbPut(store, val){ return reqp((await tx(store,'readwrite')).put(val)); }
async function dbDel(store, key){ return reqp((await tx(store,'readwrite')).delete(key)); }
async function dbClear(store){ return reqp((await tx(store,'readwrite')).clear()); }
async function dbPutMany(store, vals){
  const db = await openDB();
  return new Promise((res, rej) => {
    const t2 = db.transaction(store, 'readwrite');
    const os = t2.objectStore(store);
    vals.forEach(v => os.put(v));
    t2.oncomplete = () => res(true);
    t2.onerror = () => rej(t2.error);
  });
}

async function kvGet(key, fallback){
  const r = await dbGet('kv', key);
  return r ? r.value : fallback;
}
async function kvSet(key, value){ return dbPut('kv', {key, value}); }

async function secretGet(key){
  const r = await dbGet('secrets', key);
  return r ? r.value : '';
}
async function secretSet(key, value){ return dbPut('secrets', {key, value}); }

/* ---------- 3. Records ----------
   Every piece of personal data is one record with the same envelope:
     id         ULID, or a fixed id for singletons ("profile")
     type       what kind of record (see RECORD_TYPES)
     schema     version of that type's body, starts at 1
     app        which app wrote it ("nutrilog")
     createdAt  ISO 8601 with offset
     updatedAt  ISO 8601 with offset, changes on every write
     deleted    true for a tombstone (kept so sync can see deletions)
     date       local calendar day YYYY-MM-DD, for dated records
   The body follows. Units are part of field names or fixed per nutrient.
   ------------------------------------------------------ */

const RECORD_TYPES = {
  profile:           {schema:2, shared:true},  /* body data, goals, food preferences */
  body_weight:       {schema:1, shared:true},  /* dated weight in kg */
  food_entry:        {schema:1, shared:true},  /* one eaten item on one day */
  supplement:        {schema:1, shared:true},  /* a supplement you take */
  supplement_intake: {schema:1, shared:true},  /* one intake on one day */
  food:              {schema:1, shared:true},  /* your own food: label, barcode, manual */
  recipe_note:       {schema:1, shared:true},  /* favourite, rating, notes, cooked dates for a recipe */
  pantry_item:       {schema:1, shared:true},  /* what is at home */
  chat_message:      {schema:1, shared:false}, /* chat history */
  photo_eval:        {schema:1, shared:false}, /* result of a photo evaluation */
  summary:           {schema:1, shared:true},  /* written weekly or monthly review */
  meal_plan:         {schema:1, shared:true}   /* saved suggestions or meal prep plan */
};

let dirtyTimer = null;
function markDirty(reason){
  S.meta.dataChangedAt = nowIso();
  if (dirtyTimer) clearTimeout(dirtyTimer);
  dirtyTimer = setTimeout(() => { dirtyTimer = null; saveMeta(); scheduleBackup(reason || 'data changed'); }, 400);
}

async function recPut(rec, opts){
  if (!rec.type || !RECORD_TYPES[rec.type]) throw new Error('Unknown record type: ' + rec.type);
  const now = nowIso();
  if (!rec.id) rec.id = ulid();
  if (!rec.createdAt) rec.createdAt = now;
  if (!rec.schema) rec.schema = RECORD_TYPES[rec.type].schema;
  if (!rec.app) rec.app = 'nutrilog';
  rec.updatedAt = now;
  if (rec.deleted === undefined) rec.deleted = false;
  await dbPut('records', rec);
  if (!opts || !opts.silent) markDirty(rec.type);
  return rec;
}
async function recGet(id){
  const r = await dbGet('records', id);
  return (r && !r.deleted) ? r : null;
}
async function recByType(type, includeDeleted){
  const os = await tx('records','readonly');
  const all = await reqp(os.index('type').getAll(type));
  return includeDeleted ? all : all.filter(r => !r.deleted);
}
async function recByTypeDate(type, from, to){
  const os = await tx('records','readonly');
  const range = IDBKeyRange.bound([type, from], [type, to]);
  const all = await reqp(os.index('type_date').getAll(range));
  return all.filter(r => !r.deleted);
}
async function recDelete(id){
  const r = await dbGet('records', id);
  if (!r) return;
  r.deleted = true;
  r.updatedAt = nowIso();
  await dbPut('records', r);
  markDirty(r.type + ' deleted');
}

function mergeDefaults(target, defaults){
  const out = deepCopy(defaults);
  if (!target) return out;
  for (const k in target){
    if (target[k] && typeof target[k] === 'object' && !Array.isArray(target[k]) && out[k] && typeof out[k] === 'object' && !Array.isArray(out[k])){
      out[k] = mergeDefaults(target[k], out[k]);
    } else if (target[k] !== undefined){
      out[k] = target[k];
    }
  }
  return out;
}

async function loadState(){
  S.prefs   = mergeDefaults(await kvGet('prefs', null), DEFAULT_PREFS);
  S.meta    = mergeDefaults(await kvGet('meta', null), DEFAULT_META);
  /* Sonnet 5 stayed at 2 and 10 USD after August 2026; fix the old default. */
  if (S.prefs.prices['claude-sonnet-5'] && Number(S.prefs.prices['claude-sonnet-5'].in) === 3 && Number(S.prefs.prices['claude-sonnet-5'].out) === 15)
    S.prefs.prices['claude-sonnet-5'] = {in:2, out:10};
  S.lang    = S.prefs.lang;
  S.theme   = S.prefs.theme;
  S.secrets.anthropic = await secretGet('anthropic');
  S.secrets.github    = await secretGet('github');
  if (!S.meta.installedAt){ S.meta.installedAt = nowIso(); await saveMeta(); }
  await migrateFromSchema1();
  S.profile = await recGet('profile');
}

async function savePrefs(){ S.prefs.lang = S.lang; S.prefs.theme = S.theme; await kvSet('prefs', S.prefs); }
async function saveMeta(){ await kvSet('meta', S.meta); }

/* ---------- 5. Migration from schema 1 (v0.1) ----------
   v0.1 kept one flat profile under kv 'profile' and a history of
   profile saves. Both are converted into records; the old copies stay
   untouched in their stores so nothing is lost if something goes wrong. */

function profileFromV1(p){
  if (!p) return null;
  const rec = {
    id: 'profile', type: 'profile', schema: 2,
    person: {
      sex: p.sex || '',
      age: p.age === '' || p.age == null ? null : Number(p.age),
      ageRecordedOn: (p.savedAt || nowIso()).slice(0,10),
      heightCm: p.height === '' || p.height == null ? null : Number(p.height),
      weightKg: p.weight === '' || p.weight == null ? null : Number(p.weight),
      activityLevel: Number(p.activity) || 2
    },
    goals: {
      direction: p.direction || 'maintain',
      macroSplit: { preset: p.split || 'balanced',
        proteinPct: Number((p.custom||{}).p) || 25, fatPct: Number((p.custom||{}).f) || 30, carbPct: Number((p.custom||{}).c) || 45 },
      dietStyle: [], aims: [], focusNutrients: [], notes: '',
      slots: deepCopy(DEFAULT_SLOTS)
    },
    food: {
      exclusions: (p.exclusions || []).map(x => ({id: x.id || null, label: x.label, type: x.type || 'allergy', syn: x.syn || []})),
      cuisines: p.cuisines || [], cuisineOther: p.cuisineFree || '', dislikes: ''
    },
    kitchen: {
      timeWeekday: Number(p.timeWeekday) || 2, timeWeekend: Number(p.timeWeekend) || 3,
      equipment: p.equipment || [], budget: p.budget || 'bud3',
      mealPrep: { cookDaysPerWeek: 3, batchServings: 3 }
    }
  };
  return rec;
}

async function migrateFromSchema1(){
  const existing = await dbGet('records', 'profile');
  if (existing) return;
  const old = await kvGet('profile', null);
  if (!old) return;
  const rec = profileFromV1(old);
  rec.createdAt = old.savedAt ? nowIso(new Date(old.savedAt)) : nowIso();
  await recPut(rec, {silent:true});
  /* every saved weight becomes a dated weight record */
  const hist = await dbAll('profileHistory');
  const byDay = {};
  hist.forEach(h => { if (h.weight && h.savedAt) byDay[localDateKey(new Date(h.savedAt))] = h; });
  for (const day in byDay){
    await recPut({type:'body_weight', date: day, kg: Number(byDay[day].weight), source:'profile'}, {silent:true});
  }
  S.meta.migratedFromSchema1 = nowIso();
  await saveMeta();
}

/* ---------- 6. Nutrient vocabulary ----------
   Short keys are used inside the app and in the stored data. Each maps
   to an INFOODS tagname (FAO/INFOODS, the international standard), so
   other apps can read the data without guessing. Amounts are always in
   the unit listed here. */

const NUTRIENTS = [
  {k:'kcal', tag:'ENERC_KCAL', unit:'kcal', grp:'energy', cs:'Energie', en:'Energy'},
  {k:'prot', tag:'PROCNT', unit:'g', grp:'macro', cs:'Bílkoviny', en:'Protein'},
  {k:'fat',  tag:'FAT',    unit:'g', grp:'macro', cs:'Tuky', en:'Fat'},
  {k:'carb', tag:'CHOCDF', unit:'g', grp:'macro', cs:'Sacharidy', en:'Carbohydrate'},
  {k:'fib',  tag:'FIBTG',  unit:'g', grp:'macro', cs:'Vláknina', en:'Fibre'},
  {k:'sug',  tag:'SUGAR',  unit:'g', grp:'macro', cs:'Cukry', en:'Sugars'},

function nutLabel(k){ return NUT[k] ? L(NUT[k]) : (NUT_DERIVED[k] ? L(NUT_DERIVED[k]) : k); }

/* Add nutrient maps. Unknown stays unknown: null + number = number, but the
   count of unknowns is tracked separately by the review. */
function nutAdd(acc, n, factor){
  if (!n) return acc;
  const f = factor == null ? 1 : factor;
  for (const k in n){
    const v = n[k];
    if (v == null || !isFinite(v)) continue;
    acc[k] = (acc[k] || 0) + v * f;
  }
  return acc;
}
function nutScale(n, factor){
  const out = {};
  for (const k in (n||{})){
    const v = n[k];
    out[k] = (v == null || !isFinite(v)) ? null : Math.round(v * factor * 1000) / 1000;
  }
  return out;
}
function nutRound(n){
  const out = {};
  for (const k in (n||{})){
    const v = n[k];
    if (v == null || !isFinite(v)) { out[k] = null; continue; }
    const a = Math.abs(v);
    out[k] = a >= 100 ? Math.round(v) : a >= 1 ? Math.round(v*10)/10 : Math.round(v*1000)/1000;
  }
  return out;
}

/* ---------- 7. Goal engine (from v0.1, unchanged maths) ----------
   Mifflin, St Jeor resting energy, times an activity band,
   widened into a range, then held above a floor. */

const ACTIVITY = [
  {id:1, mult:1.25, unc:0.13, k:'act1'},
  {id:2, mult:1.40, unc:0.13, k:'act2'},
  {id:3, mult:1.55, unc:0.14, k:'act3'},
  {id:4, mult:1.75, unc:0.16, k:'act4'}
];
const SPLITS = {
  balanced: {p:25, f:30, c:45},
  protein:  {p:35, f:30, c:35},
  lowcarb:  {p:30, f:45, c:25}
};
const DIRECTIONS = { lose:0.90, maintain:1.00, gain:1.07 };
const RMR_REL_UNC = 0.10;
const FLOOR_ABS = { male:1500, female:1200 };
const DEFAULT_SLOTS = { breakfast:25, lunch:35, snack:10, dinner:30 };
const SLOTS = ['breakfast','lunch','snack','dinner'];

function round10(n){ return Math.round(n/10)*10; }
function round5(n){ return Math.round(n/5)*5; }

/* The engine reads a flat view, so the maths stays exactly as tested. */
function flatProfile(rec){
  if (!rec || !rec.person) return null;
  const P = rec.person, G = rec.goals || {};
  const ms = G.macroSplit || {};
  return {
    sex: P.sex, age: P.age, height: P.heightCm, weight: P.weightKg,
    activity: P.activityLevel, direction: G.direction || 'maintain',
    split: ms.preset || 'balanced', custom: {p: ms.proteinPct, f: ms.fatPct, c: ms.carbPct}
  };
}

function computeTargets(rec){
  const p = flatProfile(rec);
  if (!p || !p.sex || !p.age || !p.height || !p.weight) return null;
  const w = Number(p.weight), h = Number(p.height), a = Number(p.age);
  const rmr = 10*w + 6.25*h - 5*a + (p.sex === 'male' ? 5 : -161);
  const band = ACTIVITY.find(x => x.id === Number(p.activity)) || ACTIVITY[1];
  const tdee = rmr * band.mult;
  const actRel = band.unc / band.mult;
  const rel = Math.sqrt(RMR_REL_UNC*RMR_REL_UNC + actRel*actRel);
  const adj = DIRECTIONS[p.direction] || 1;
  let low  = tdee * (1 - rel) * adj;
  let high = tdee * (1 + rel) * adj;
  const floorAbs = FLOOR_ABS[p.sex] || 1200;
  const floor = Math.max(round10(rmr), floorAbs);
  let floorBinding = false;
  if (low < floor){ low = floor; floorBinding = true; }
  if (floorBinding && high < floor * 1.08) high = floor * 1.08;
  low = round10(low); high = round10(high);
  const split = p.split === 'custom'
    ? {p:Number(p.custom.p), f:Number(p.custom.f), c:Number(p.custom.c)}
    : SPLITS[p.split] || SPLITS.balanced;
  const mac = (pct, kcalPerG) => ({
    low:  round5(low  * pct/100 / kcalPerG),
    high: round5(high * pct/100 / kcalPerG)
  });
  const macros = { p: mac(split.p,4), f: mac(split.f,9), c: mac(split.c,4) };
  return {
    rmr: Math.round(rmr), mult: band.mult, tdee: Math.round(tdee),
    relPct: Math.round(rel*1000)/10,
    low, high, mid: round10((low+high)/2), floor, floorAbs, floorBinding, split, macros,
    proteinPerKg: { low: Math.round(macros.p.low/w*10)/10, high: Math.round(macros.p.high/w*10)/10 }
  };
}

function slotShares(){
  const s = (S.profile && S.profile.goals && S.profile.goals.slots) || DEFAULT_SLOTS;
  const sum = SLOTS.reduce((a,k) => a + (Number(s[k])||0), 0) || 100;
  const out = {};
  SLOTS.forEach(k => out[k] = (Number(s[k])||0) / sum);
  return out;
}

/* All exclusion words for the hard filter, folded for matching.
   Longer words are cut by one letter so Czech endings still match
   (mléko, mléka, mlékem). Over matching is the safe side for allergies. */
function exclusionTerms(){
  const ex = (S.profile && S.profile.food && S.profile.food.exclusions) || [];
  const out = [];
  ex.forEach(x => {
    /* a known allergen always carries the full, current list of other names */
    const known = x.id ? ALLERGENS.find(a => a.id === x.id) : null;
    const words = [x.label].concat(x.syn || [], known ? known.syn.concat([known.cs, known.en]) : []).map(fold)
      .map(w => w.replace(/[^a-z0-9]+/g,' ').trim()).filter(w => w.length >= 3)
      .map(w => (w.length >= 5 && w.indexOf(' ') < 0) ? w.slice(0, -1) : w);
    out.push({id: x.id || null, label: x.label, type: x.type, words});
  });
  return out;
}

/* Returns the exclusions a piece of text hits, e.g. a recipe's ingredient list. */
function exclusionHits(text){
  const base = ' ' + fold(text).replace(/[^a-z0-9]+/g,' ') + ' ';
  const hits = [];
  exclusionTerms().forEach(x => {
    let f = base;
    (EXCLUSION_FALSE_FRIENDS[x.id] || []).forEach(ph => { f = f.split(' ' + ph).join(' '); });
    for (const w of x.words){
      if (f.indexOf(' ' + w) >= 0){ hits.push({label:x.label, type:x.type, word:w}); break; }
    }
  });
  return hits;
}

const FOODDB = { ready:false, loading:null, foods:[], byId:{}, nutrients:[], source:'' };

async function loadFoodDb(){
  if (FOODDB.ready) return FOODDB;
  if (FOODDB.loading) return FOODDB.loading;
  FOODDB.loading = (async () => {
    const res = await fetch('data/foods.json?v=' + encodeURIComponent(VERSION));
    if (!res.ok) throw new Error('foods.json ' + res.status);
    const j = await res.json();
    FOODDB.nutrients = j.nutrients;
    FOODDB.source = j.source;
    FOODDB.foods = j.foods.map(f => {
      const per100 = {};
      j.nutrients.forEach((k, i) => { per100[k] = f.n[i]; });
      const food = {
        ref: 'usda:' + f.i, kind: 'usda', en: f.en, cs: f.cs || null, cat: f.c,
        per100, portions: (f.p || []).map(p => ({label: p[0], g: p[1]}))
      };
      food._tok = tokensOf(food.en + ' ' + (food.cs || ''));
      food._head = fold(food.en.split(',')[0]);
      return food;
    });
    FOODDB.foods.forEach(f => { FOODDB.byId[f.ref] = f; });
    FOODDB.ready = true;
    return FOODDB;
  })();
  try { return await FOODDB.loading; }
  catch(e){ FOODDB.loading = null; throw e; }
}

function tokensOf(s){
  return fold(s).replace(/[^a-z0-9%]+/g,' ').split(' ').filter(Boolean);
}

/* English alternatives for one Czech (or English) query word. */
function expandToken(tok){
  const alts = [tok];
  for (const [cs, en] of CS_EN){
    if (tok.startsWith(cs) || (cs.length >= 4 && cs.startsWith(tok) && tok.length >= 3)) alts.push(en);
  }
  return alts;
}

const PROCESSED = ['breaded','batter','tenders','nugget','patty','patties','fried','frozen','canned','prepared','with added','dehydrated','imitation','sweetened','flavored','mix,','powder','stick','substitute'];

/* Category weights: everyday groups first. */
const CAT_WEIGHT = {1:3,2:1,4:1,5:3,6:0,7:1,8:1,9:3,10:2,11:3,12:2,13:2,14:0,15:2,16:3,17:1,18:1,19:0,20:3,22:0,23:0};

function scoreFood(food, qTokens){
  let score = 0;
  for (let qi = 0; qi < qTokens.length; qi++){
    const alts = qTokens[qi];
    let best = -1;
    for (const a of alts){
      for (let i = 0; i < food._tok.length; i++){
        if (food._tok[i].startsWith(a)){
          const s = (food._tok[i] === a ? 3 : 2) + (i < 3 ? 2 : 0);
          if (s > best) best = s;
          break;
        }
      }
    }
    if (best < 0) return -1;
    score += best;
    if (qi === 0 && alts.some(a => food._head.startsWith(a))) score += 4;
  }
  score += (CAT_WEIGHT[food.cat] || 0);
  const en = food.en.toLowerCase();
  if (/\braw\b/.test(en)) score += 0.5;
  /* processed variants sink unless you asked for them */
  const q = qTokens.map(a => a.join(' ')).join(' ');
  PROCESSED.forEach(w => { if (en.indexOf(w) >= 0 && q.indexOf(w.slice(0, 4)) < 0) score -= 3; });
  if (/skinless|boneless|meat only|lean only/.test(en)) score += 0.8;
  score -= food.en.length / 90;
  return score;
}

/* Search everything local: your foods first, then the database. */
async function searchLocalFoods(q, limit){
  const qt = tokensOf(q);
  if (!qt.length) return [];
  const qTokens = qt.map(expandToken);
  const mine = (await recByType('food')).map(customFoodView);
  const out = [];
  mine.forEach(f => {
    f._tok = tokensOf(f.en + ' ' + (f.cs||'') + ' ' + (f.brand||''));
    f._head = fold((f.cs || f.en || '').split(',')[0]);
    const s = scoreFood(f, qTokens);
    if (s >= 0) out.push({food:f, s: s + 20});
  });
  try { await loadFoodDb(); } catch(e){ /* offline and never loaded: only own foods */ }
  FOODDB.foods.forEach(f => {
    const s = scoreFood(f, qTokens);
    if (s >= 0) out.push({food:f, s});
  });
  out.sort((a,b) => b.s - a.s);
  return out.slice(0, limit || 40).map(x => x.food);
}

function foodName(food){

  if (food.kind === 'custom' || food.kind === 'off') return food.en + (food.brand ? ' · ' + food.brand : '');
  return (S.lang === 'cs' && food.cs) ? food.cs : food.en;
}

async function getFoodByRef(ref){
  if (!ref) return null;
  if (ref.startsWith('usda:')){ await loadFoodDb(); return FOODDB.byId[ref] || null; }
  if (ref.startsWith('food:')){ const r = await recGet(ref.slice(5)); return r ? customFoodView(r) : null; }
  return null;
}

/* Foods you logged recently, most frequent first. */
async function recentFoods(days, limit){
  const to = localDateKey(), from = addDays(to, -(days || 45));
  const entries = await recByTypeDate('food_entry', from, to);
  const count = {};
  const last = {};
  entries.forEach(e => {
    const ref = e.source && e.source.ref;
    if (!ref || !(ref.startsWith('usda:') || ref.startsWith('food:'))) return;
    count[ref] = (count[ref] || 0) + 1;
    if (!last[ref] || e.updatedAt > last[ref].updatedAt) last[ref] = e;
  });
  const refs = Object.keys(count).sort((a,b) => count[b] - count[a]).slice(0, limit || 12);
  const out = [];
  for (const ref of refs){
    const f = await getFoodByRef(ref);
    if (f) out.push({food:f, lastGrams: last[ref].amount && last[ref].amount.grams});
  }
  return out;
}

/* ---------- Open Food Facts ----------
   Free, open database of packaged products, strong in Europe. Called
   directly from the phone; no key needed. */

const OFF_FIELDS = 'code,product_name,product_name_cs,product_name_en,brands,nutriments,serving_size,serving_quantity,quantity,allergens_tags,ingredients_text,ingredients_text_cs,image_front_small_url,nutriscore_grade,nova_group';

function offToFood(p){
  const n = p.nutriments || {};
  const g = (k) => (n[k] == null || n[k] === '') ? null : Number(n[k]);
  const per100 = {
    kcal: g('energy-kcal_100g') != null ? g('energy-kcal_100g') : (g('energy_100g') != null ? Math.round(g('energy_100g')/4.184) : null),
    prot: g('proteins_100g'), fat: g('fat_100g'), carb: g('carbohydrates_100g'), sug: g('sugars_100g'),
    fib: g('fiber_100g'), sfa: g('saturated-fat_100g'), mufa: g('monounsaturated-fat_100g'), pufa: g('polyunsaturated-fat_100g'),
    trans: g('trans-fat_100g'),
    na: g('sodium_100g') != null ? g('sodium_100g')*1000 : (g('salt_100g') != null ? g('salt_100g')*400 : null),
    chol: g('cholesterol_100g') != null ? g('cholesterol_100g')*1000 : null,
    ca: g('calcium_100g') != null ? g('calcium_100g')*1000 : null,
    fe: g('iron_100g') != null ? g('iron_100g')*1000 : null,
    k: g('potassium_100g') != null ? g('potassium_100g')*1000 : null,
    mg: g('magnesium_100g') != null ? g('magnesium_100g')*1000 : null,
    zn: g('zinc_100g') != null ? g('zinc_100g')*1000 : null,
    vitc: g('vitamin-c_100g') != null ? g('vitamin-c_100g')*1000 : null,
    vitd: g('vitamin-d_100g') != null ? g('vitamin-d_100g')*1e6 : null,
    vita: g('vitamin-a_100g') != null ? g('vitamin-a_100g')*1e6 : null,
    b12: g('vitamin-b12_100g') != null ? g('vitamin-b12_100g')*1e6 : null,
    caff: g('caffeine_100g') != null ? g('caffeine_100g')*1000 : null,
    alc: g('alcohol_100g') != null ? g('alcohol_100g')*0.789 : null
  };
  const name = p.product_name_cs || p.product_name || p.product_name_en || '';
  const portions = [];
  if (p.serving_quantity && Number(p.serving_quantity) > 0)
    portions.push({label: p.serving_size ? String(p.serving_size) : (S.lang === 'cs' ? '1 porce' : '1 serving'), g: Number(p.serving_quantity)});
  return {
    ref: 'off:' + p.code, kind: 'off', en: name, cs: null, brand: (p.brands || '').split(',')[0].trim(),
    barcode: p.code, per100: nutRound(per100), portions, cat: -2,
    ingredients: p.ingredients_text_cs || p.ingredients_text || '',
    allergens: (p.allergens_tags || []).map(a => a.replace(/^en:/,'')),
    image: p.image_front_small_url || '', nutriscore: p.nutriscore_grade || '', nova: p.nova_group || null
  };
}

async function offByBarcode(code){
  const url = 'https://world.openfoodfacts.org/api/v2/product/' + encodeURIComponent(code) + '.json?fields=' + OFF_FIELDS;
  const res = await fetch(url);
  if (res.status === 404) return null;
  if (!res.ok) throw new Error('Open Food Facts ' + res.status);
  const j = await res.json();
  if (!j || j.status === 0 || !j.product) return null;
  return offToFood(j.product);
}

async function offSearch(q){
  const url = 'https://world.openfoodfacts.org/cgi/search.pl?search_simple=1&action=process&json=1&page_size=25&lc=cs&search_terms=' +
    encodeURIComponent(q) + '&fields=' + OFF_FIELDS;
  const res = await fetch(url);
  if (!res.ok) throw new Error('Open Food Facts ' + res.status);
  const j = await res.json();
  return (j.products || []).filter(p => p.product_name || p.product_name_cs).map(offToFood)
    .filter(f => f.per100.kcal != null);
}

/* Keep a product you logged as your own food, so it works offline next time. */
async function saveOffAsCustom(food){
  const existing = (await recByType('food')).find(r => r.barcode && r.barcode === food.barcode);

    type: 'food', name: food.en, brand: food.brand, barcode: food.barcode,
    per100: food.per100, portions: food.portions, basis: 'label', source: 'openfoodfacts',
    ingredients: food.ingredients || '', allergens: food.allergens || []
  });
  return customFoodView(rec);
}

/* Nutrients for an amount of a food. */
function nutrientsFor(food, grams){

/* A foods-rich-in list for the review: which database foods give the most
   of a nutrient per 100 kcal, ignoring anything you excluded. */
async function foodsRichIn(k, limit){
  await loadFoodDb();
  const excl = exclusionTerms().length > 0;
  const scored = [];
  if (!foodsRichIn.common){
    /* everyday foods only: the head word must be one a Czech shopper would type */
    foodsRichIn.common = new Set(CS_EN.map(x => x[1]).filter(w => ['raw','cooked','boiled','roasted','fried','grilled','steamed','dried','frozen','canned','smoked','pickled','nonfat','lowfat','reduced','whole','powder','sauce','soup','broth','ice','sweet','hot','white','blue','french','toasted','sour','greek','ground','breast','thigh','wing','drumstick','shoulder','belly','ribs','chop','tenderloin','heart','kidney','tongue','snap','oyster'].indexOf(w) < 0));
  }
  const OBSCURE = /isolate|concentrate|spirulina|grouse|game meat|seaweed|dehydrated|freeze-dried|powder|flour|bran|germ|meal,|by-products|infant|formula|substitute|imitation|fortified|restaurant|fast food/;
  FOODDB.foods.forEach(f => {
    if ([6,14,19,22,23,4,7].indexOf(f.cat) >= 0) return;
    const head = f._head.split(' ')[0];
    if (!foodsRichIn.common.has(head) && !foodsRichIn.common.has(head.replace(/s$/,'')) && !foodsRichIn.common.has(head + 's')) return;
    if (OBSCURE.test(f.en.toLowerCase())) return;
    let v;
    if (k === 'o3ld') v = (f.per100.epa == null && f.per100.dha == null) ? null : ((f.per100.epa||0) + (f.per100.dha||0)) * 1000;
    else v = f.per100[k];
    const kc = f.per100.kcal;
    if (v == null || !kc || kc < 15) return;
    if (/\bdried\b|\bpowder\b|\bdehydrated\b|\bfreeze-dried\b|\bspices?\b/.test(f.en) && k !== 'fib') return;
    if (excl && exclusionHits(f.en + ' ' + (f.cs||'')).length) return;
    scored.push({food:f, perKcal: v / kc * 100, per100: v});
  });
  scored.sort((a,b) => b.perKcal - a.perKcal);
  /* one per head word, so the list is not ten kinds of liver */
  const seen = {}, out = [];
  for (const s of scored){
    const h = s.food._head;
    if (seen[h]) continue;
    seen[h] = 1; out.push(s);
    if (out.length >= (limit || 8)) break;
  }
  return out;
}

/* ============================================================
   Claude. Every call goes through API.anthropic or claudeStream, so the
   endpoint can move to a server proxy later without touching anything
   else. The key lives only on this phone (IndexedDB "secrets").
   ============================================================ */

const API = {
  anthropicBase: 'https://api.anthropic.com',
  headers(){
    return {
      'x-api-key': S.secrets.anthropic,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
      'content-type': 'application/json'
    };
  },
  async anthropic(path, init){
    const headers = Object.assign(API.headers(), (init && init.headers) || {});
    const res = await fetch(API.anthropicBase + path, Object.assign({}, init || {}, {headers}));
    const txt = await res.text();
    let body = null;
    try { body = txt ? JSON.parse(txt) : null; } catch(e){ body = {raw: txt}; }
    if (body && body.usage) trackUsage(body.model, body.usage);
    else { S.meta.usage.calls++; saveMeta(); }
    if (!res.ok){
      const msg = (body && body.error && body.error.message) || (body && body.raw) || txt || '';
      throw new Error(res.status + ' ' + res.statusText + (msg ? ': ' + String(msg).slice(0,400) : ''));
    }
    return body;
  }
};

function priceFor(model){
  const p = S.prefs.prices[model];
  if (p) return {in: Number(p.in)||0, out: Number(p.out)||0};
  const m = String(model||'');
  if (m.indexOf('opus') >= 0) return {in:5, out:25};
  if (m.indexOf('haiku') >= 0) return {in:1, out:5};
  if (m.indexOf('fable') >= 0) return {in:10, out:50};
  return {in:2, out:10};
}

function monthKey(){ return localDateKey().slice(0,7); }

function trackUsage(model, usage){
  const u = S.meta.usage;
  const inn = (usage.input_tokens || 0), out = (usage.output_tokens || 0);
  const cw = usage.cache_creation_input_tokens || 0, cr = usage.cache_read_input_tokens || 0;
  const pr = priceFor(model);
  const cost = (inn/1e6)*pr.in + (cw/1e6)*pr.in*1.25 + (cr/1e6)*pr.in*0.1 + (out/1e6)*pr.out;
  u.calls++;
  u.inTok += inn + cw + cr;
  u.outTok += out;
  const mid = model || 'unknown';
  if (!u.byModel[mid]) u.byModel[mid] = {in:0, out:0};
  u.byModel[mid].in += inn + cw + cr;
  u.byModel[mid].out += out;
  if (!u.byMonth) u.byMonth = {};
  const mk = monthKey();
  if (!u.byMonth[mk]) u.byMonth[mk] = {calls:0, cost:0};
  u.byMonth[mk].calls++;
  u.byMonth[mk].cost += cost;
  saveMeta();
}

function monthCost(){
  const b = (S.meta.usage.byMonth || {})[monthKey()];
  return b ? b.cost : 0;
}

/* Streaming call. onText gets each piece of text as it arrives.
   Returns the finished message with content blocks, like the plain API. */
async function claudeStream(body, onText){
  const payload = Object.assign({}, body, {stream: true});
  const res = await fetch(API.anthropicBase + '/v1/messages', {method:'POST', headers: API.headers(), body: JSON.stringify(payload)});
  if (!res.ok){
    const txt = await res.text();
    let msg = txt;
    try { const j = JSON.parse(txt); msg = (j.error && j.error.message) || txt; } catch(e){}
    S.meta.usage.calls++; saveMeta();
    throw new Error(res.status + ' ' + res.statusText + ': ' + String(msg).slice(0,400));
  }
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  const msg = {content: [], usage: {}, stop_reason: null, model: body.model};
  const handle = (ev, data) => {
    if (ev === 'message_start'){ msg.model = data.message.model; msg.usage = Object.assign({}, data.message.usage || {}); }
    else if (ev === 'content_block_start'){
      const b = Object.assign({}, data.content_block);
      if (b.type === 'tool_use'){ b._json = ''; b.input = {}; }
      if (b.type === 'text') b.text = b.text || '';
      msg.content[data.index] = b;
    }
    else if (ev === 'content_block_delta'){
      const b = msg.content[data.index];
      if (!b) return;
      if (data.delta.type === 'text_delta'){ b.text += data.delta.text; if (onText) onText(data.delta.text); }
      else if (data.delta.type === 'input_json_delta'){ b._json += data.delta.partial_json; }
    }
    else if (ev === 'content_block_stop'){
      const b = msg.content[data.index];
      if (b && b.type === 'tool_use'){ try { b.input = b._json ? JSON.parse(b._json) : {}; } catch(e){ b.input = {}; } delete b._json; }
    }
    else if (ev === 'message_delta'){
      if (data.delta && data.delta.stop_reason) msg.stop_reason = data.delta.stop_reason;
      if (data.usage) Object.assign(msg.usage, data.usage);
    }
    else if (ev === 'error'){ throw new Error((data.error && data.error.message) || 'stream error'); }
  };
  for (;;){
    const {value, done} = await reader.read();
    if (done) break;
    buf += dec.decode(value, {stream:true});
    let cut;
    while ((cut = buf.indexOf('\n\n')) >= 0){
      const chunk = buf.slice(0, cut); buf = buf.slice(cut + 2);
      let ev = '', data = '';
      chunk.split('\n').forEach(line => {
        if (line.startsWith('event:')) ev = line.slice(6).trim();
        else if (line.startsWith('data:')) data += line.slice(5).trim();
      });
      if (!data) continue;
      let parsed; try { parsed = JSON.parse(data); } catch(e){ continue; }
      handle(ev || parsed.type, parsed);
    }
  }
  msg.content = msg.content.filter(Boolean);
  trackUsage(msg.model, msg.usage);
  return msg;
}

/* Ask for one forced tool call and return its input: reliable JSON. */
async function claudeTool(opts){
  const body = {
    model: opts.model || S.prefs.models.chat,
    max_tokens: opts.max_tokens || 2000,
    system: opts.system ? [{type:'text', text: opts.system, cache_control:{type:'ephemeral'}}] : undefined,
    messages: opts.messages,
    tools: [opts.tool],
    tool_choice: {type:'tool', name: opts.tool.name}
  };
  const msg = await API.anthropic('/v1/messages', {method:'POST', body: JSON.stringify(body)});
  const tu = (msg.content || []).find(b => b.type === 'tool_use');
  if (!tu) throw new Error(t('ai_bad_reply'));
  return tu.input;
}

async function buildContext(opts){
  opts = opts || {};
  const P = S.profile;
  const lines = [];
  if (!P || !P.person){ lines.push('The person has not filled in a profile yet.'); return lines.join('\n'); }
  const p = P.person, G = P.goals || {}, F = P.food || {}, K = P.kitchen || {};
  const g = computeTargets(P);
  lines.push('PROFILE: ' + [p.sex === 'female' ? 'female physiology' : 'male physiology', p.age + ' years', p.heightCm + ' cm', p.weightKg + ' kg',
    'activity level ' + p.activityLevel + ' of 4', 'direction: ' + (G.direction || 'maintain')].join(', '));
  if (g) lines.push('DAILY TARGETS (ranges): energy ' + g.low + ' to ' + g.high + ' kcal; protein ' + g.macros.p.low + ' to ' + g.macros.p.high +
    ' g; fat ' + g.macros.f.low + ' to ' + g.macros.f.high + ' g; carbohydrate ' + g.macros.c.low + ' to ' + g.macros.c.high + ' g; fibre at least 25 g.');
  const shares = slotShares();
  lines.push('MEAL SLOTS share of the day: ' + SLOTS.map(s => s + ' ' + Math.round(shares[s]*100) + '%').join(', '));
  if ((G.dietStyle||[]).length) lines.push('DIET STYLE: ' + G.dietStyle.map(x => t('ds_'+x)).join(', '));
  if ((G.aims||[]).length) lines.push('AIMS: ' + G.aims.map(x => t('aim_'+x)).join(', '));
  if ((G.focusNutrients||[]).length) lines.push('NUTRIENTS TO FOCUS ON: ' + G.focusNutrients.map(nutLabel).join(', '));
  if (G.notes) lines.push('NOTES FROM THE PERSON (their own words): ' + G.notes);
  lines.push('HARD EXCLUSIONS, never include them, check every ingredient and hidden sources such as sauces and stock: ' + exclusionText());
  if (F.dislikes) lines.push('DISLIKES (avoid when possible): ' + F.dislikes);
  const cz = (F.cuisines||[]).map(id => { const c = CUISINES.find(x => x.id === id); return c ? c.en : id; });
  if (F.cuisineOther) cz.push(F.cuisineOther);
  if (cz.length) lines.push('LIKES CUISINES: ' + cz.join(', '));
  lines.push('KITCHEN: weekday cooking time up to ' + TIME_MAX_MIN[K.timeWeekday||2] + ' min, weekend up to ' + TIME_MAX_MIN[K.timeWeekend||3] +
    ' min; equipment: ' + ((K.equipment||[]).map(e => t('eq_'+e)).join(', ') || 'basic hob') + '; weekly food budget: ' + t(K.budget || 'bud3') +
    '; meal prep: cooks about ' + ((K.mealPrep||{}).cookDaysPerWeek || 3) + ' days a week, batches of about ' + ((K.mealPrep||{}).batchServings || 3) + ' servings.');
  if (opts.today){
    const d = await dayTotals(opts.date || localDateKey());
    const parts = SLOTS.concat(['other']).filter(s => d.bySlot[s]).map(s => s + ' ' + Math.round(d.bySlot[s].kcal||0) + ' kcal (P ' + Math.round(d.bySlot[s].prot||0) + ' g)');
    lines.push('EATEN ' + (opts.date || 'TODAY') + ': ' + (parts.length ? parts.join('; ') : 'nothing logged yet') +
      '. Total ' + Math.round(d.total.kcal||0) + ' kcal, protein ' + Math.round(d.total.prot||0) + ' g, fat ' + Math.round(d.total.fat||0) + ' g, carbohydrate ' + Math.round(d.total.carb||0) + ' g, fibre ' + Math.round(d.total.fib||0) + ' g.');
    if (g) lines.push('REMAINING TO THE MIDDLE OF THE TARGET: ' + Math.max(0, Math.round(g.mid - (d.total.kcal||0))) + ' kcal.');
  }
  if (opts.pantry){
    const items = await recByType('pantry_item');
    const have = items.filter(i => i.have).map(i => i.name);
    const out = items.filter(i => !i.have).map(i => i.name);
    lines.push('PANTRY, AT HOME: ' + (have.length ? have.join(', ') : 'unknown, nothing listed'));
    if (out.length) lines.push('PANTRY, RAN OUT OF: ' + out.join(', '));
  }
  if (opts.recipes){
    const idx = await recipeIndexForAi(opts.recipes === true ? 160 : opts.recipes);
    if (idx) lines.push('RECIPE ARCHIVE (id | title | kcal per serving | protein g | minutes | tags):\n' + idx);
  }
  return lines.join('\n');
}

/* ---------- Image helper ---------- */

function fileToDownscaledJpeg(file, maxSide, quality){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, (maxSide || 1568) / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', quality || 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('image')); };
    img.src = url;
  });
}

const sheetCleanups = [];

function openSheet(titleHtml, bodyHtml, footHtml, opts){
  runSheetCleanups();

  root.innerHTML =
    '<div class="sheetbg" role="dialog" aria-modal="true">' +
      '<div class="sheet'+(opts && opts.tall ? ' tall' : '')+'">' +
        '<div class="sheethead"><h2>'+titleHtml+'</h2>' +

        '<div class="sheetbody">' + bodyHtml + '</div>' +
        (footHtml ? '<div class="btnrow sheetfoot">'+footHtml+'</div>' : '') +
      '</div>' +

  root.querySelector('.sheetbg').addEventListener('click', e => {
    if (e.target.classList.contains('sheetbg')) closeSheet();
  });
  root.querySelectorAll('[data-sheet-close]').forEach(b => b.addEventListener('click', closeSheet));

  S.sheetOpen = true;
  return root.querySelector('.sheet');
}
function runSheetCleanups(){
  while (sheetCleanups.length){ try { sheetCleanups.pop()(); } catch(e){} }
}
/* Closing a sheet steps back over the history entry the sheet added, so
   the Android back gesture closes sheets first. The screen underneath is
   redrawn afterwards to show whatever the sheet changed. */
function closeSheet(fromPop){
  runSheetCleanups();
  $('#sheetRoot').innerHTML = '';
  const wasOpen = S.sheetOpen;
  S.sheetOpen = false;
  if (wasOpen && !fromPop){
    try { if (history.state && history.state.sheet){ S.swallowPop = true; history.back(); } } catch(e){}
  }
  const f = S.afterSheet; S.afterSheet = null;
  if (f) f();
  else if (fromPop || !S.swallowPop) refreshScreenSoon();
}
function refreshScreenSoon(){
  clearTimeout(refreshScreenSoon._t);
  refreshScreenSoon._t = setTimeout(() => { if (!S.sheetOpen) renderScreen(S.screen); }, 30);
}

function confirmSheet(title, bodyHtml, confirmLabel, danger){
  return new Promise(resolve => {
    let done = false;
    const sheet = openSheet(esc(title), bodyHtml,
      '<button class="btn quiet" type="button" data-c="0">'+esc(t('cancel'))+'</button>' +
      '<button class="btn '+(danger?'danger':'')+'" type="button" data-c="1">'+esc(confirmLabel)+'</button>');
    sheetCleanups.push(() => { if (!done){ done = true; resolve(false); } });
    sheet.querySelector('[data-c="0"]').addEventListener('click', () => { done = true; closeSheet(); resolve(false); });
    sheet.querySelector('[data-c="1"]').addEventListener('click', () => { done = true; closeSheet(); resolve(true); });
  });
}

function guessSlot(d){
  const x = d || new Date();
  const m = x.getHours()*60 + x.getMinutes();
  if (m < 10*60+30) return 'breakfast';
  if (m < 14*60+30) return 'lunch';
  if (m < 17*60+30) return 'snack';
  return 'dinner';
}

}
function bindSlotChips(root, cb){
  const box = root.querySelector('[data-slotchips]');

/* A compact table of all known nutrients, grouped. */
function nutrientTable(n, opts){
  n = n || {};
  opts = opts || {};
  const row = x => {
    let v = n[x.k], unit = x.unit;
    if ((x.k === 'epa' || x.k === 'dha' || x.k === 'ala') && v < 1){ v = v * 1000; unit = 'mg'; }
    return '<div class="kv"><span class="k">'+esc(L(x))+'</span><span class="v num">'+esc(fmtAmt(v))+' '+esc(unit)+'</span></div>';
  };
  const known = NUTRIENTS.filter(x => x.grp !== 'hidden' && n[x.k] != null && isFinite(n[x.k]));
  if (!known.length) return '<div class="ntable"><p class="tiny">'+esc(t('nt_none'))+'</p></div>';
  const main = ['kcal','prot','fat','carb','fib','sug','sfa','na'];
  let h = '<div class="ntable">' + known.filter(x => main.indexOf(x.k) >= 0).map(row).join('');
  const rest = known.filter(x => main.indexOf(x.k) < 0);
  if (rest.length) h += (opts.compact ? '<details><summary class="linkbtn">'+esc(t('nt_more', {n: rest.length}))+'</summary>' : '') +
    rest.map(row).join('') + (opts.compact ? '</details>' : '');
  return h + '</div>';
}

function fitBadge(score){
  const s = Math.round(Number(score) || 0);
  const cls = s >= 4 ? 'ok' : s === 3 ? 'wait' : 'err';
  return '<span class="fit '+cls+'">'+s+'/5</span>';
}

/* Horizontal bar with a target range drawn in. */
function rangeBar(value, low, high, kind){
  const max = Math.max(high || low || 1, value || 0) * 1.15 || 1;
  const pct = v => clamp((v / max) * 100, 0, 100);
  let cls = 'ok';
  /* progress through a day: neutral until it passes the top of the range */
  if (kind === 'progress'){ cls = high != null && value > high*1.1 ? 'bad' : high != null && value > high ? 'warn' : 'ok'; }
  else if (kind === 'max'){ cls = value > (low||0) ? 'bad' : value > (low||0)*0.9 ? 'warn' : 'ok'; }
  else if (low != null){ cls = value < low*0.5 ? 'bad' : value < low ? 'warn' : (high != null && value > high*1.1 ? 'warn' : 'ok'); }
  return '<div class="rbar"><div class="rzone" style="left:'+pct(low||0)+'%;width:'+Math.max(1, pct(high||low||0) - pct(low||0))+'%"></div>' +
    '<div class="rfill '+cls+'" style="width:'+pct(value||0)+'%"></div></div>';
}

const RECIPES = { list: [], byId: {}, loaded: false, notes: {} };

function recipeFromAi(r, origin){
  const id = 'rcp-' + ulid();

  return {
    id, type: 'recipe', schema: 1, origin: origin || 'claude', lang: RECIPE_LANG,
